function CashFlowTab({trezorerie,setTrezorerie,bilete,setBilete,furnizoriLista,setFurnizoriLista,C,card,inp,btnP,btnS,row,fmtD,tday,gid,daysTo}){
  const [sectiune,setSectiune]=React.useState("registru");
  const [showForm,setShowForm]=React.useState(null); // null | {data, tip}
  const [formData,setFormData]=React.useState({descriere:"",suma:""});
  const [editId,setEditId]=React.useState(null);
  const [editData,setEditData]=React.useState({descriere:"",suma:"",data:""});
  const [showAddRec,setShowAddRec]=React.useState(false);
  const [newRec,setNewRec]=React.useState({denumire:"",suma:"",ziua:"15"});

  const updT=(f,v)=>setTrezorerie(t=>({...t,[f]:v}));
  const inreg=trezorerie.inregistrari||[];
  const recurente=trezorerie.recurente||[];
  const soldInit=Number(trezorerie.soldInitial||0);

  const adaugaInreg=(data,tip)=>{
    if(!formData.suma) return;
    updT("inregistrari",[...inreg,{id:gid(),descriere:formData.descriere,suma:Number(formData.suma),data,tip}]);
    setFormData({descriere:"",suma:""});setShowForm(null);
  };
  const stergeInreg=(id)=>updT("inregistrari",inreg.filter(x=>x.id!==id));
  const salveazaEdit=(id)=>{
    updT("inregistrari",inreg.map(x=>x.id!==id?x:{...x,descriere:editData.descriere,suma:Number(editData.suma),data:editData.data||x.data}));
    setEditId(null);
  };
  const adaugaRec=()=>{
    if(!newRec.denumire||!newRec.suma) return;
    updT("recurente",[...recurente,{id:gid(),...newRec,suma:Number(newRec.suma)}]);
    setNewRec({denumire:"",suma:"",ziua:"15"});setShowAddRec(false);
  };

  // Construieste zilele
  const getZile=()=>{
    const zile=[];
    let sold=soldInit;
    for(let i=-3;i<90;i++){
      const d=new Date();d.setDate(d.getDate()+i);
      const ds=dateToKey(d);
      const zi=d.getDate();
      const soldZiStart=sold;
      const incasariZi=inreg.filter(x=>x.data===ds&&x.tip==="incasare");
      const platiZi=inreg.filter(x=>x.data===ds&&x.tip==="plata");
      const bileteZi=bilete.filter(b=>!b.achitat&&b.scadenta===ds);
      const recZi=recurente.filter(r=>parseInt(r.ziua)===zi);
      const totalIn=incasariZi.reduce((s,x)=>s+x.suma,0);
      const totalOut=platiZi.reduce((s,x)=>s+x.suma,0)+bileteZi.reduce((s,b)=>s+Number(b.valoare||0),0)+recZi.reduce((s,r)=>s+r.suma,0);
      sold=sold+totalIn-totalOut;
      zile.push({data:ds,soldStart:soldZiStart,soldEnd:sold,totalIn,totalOut,incasariZi,platiZi,bileteZi,recZi,
        label:d.toLocaleDateString("ro-RO",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}),
        isAzi:ds===tday(),isTrecut:ds<tday()});
    }
    return zile;
  };
  const zile=getZile();
  const soldAzi=zile.find(z=>z.isAzi)?.soldEnd||soldInit;
  const primaZiNeg=zile.find(z=>z.soldEnd<0&&!z.isTrecut);
  const inpS={...inp,padding:"6px 10px",fontSize:13};

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:12}}>Cash Flow · Registru zilnic</div>

    {primaZiNeg&&<div style={{padding:"10px 14px",background:C.dangerLight,border:`1px solid #C9BCA6`,marginBottom:10,fontSize:13,color:C.danger,fontWeight:500}}>
      ● Sold negativ previzionat pe {primaZiNeg.label}: {primaZiNeg.soldEnd.toLocaleString("ro-RO")} RON
    </div>}
    {bilete.filter(b=>!b.achitat&&b.scadenta&&daysTo(b.scadenta)<=7&&daysTo(b.scadenta)>=0).map(b=>(
      <div key={b.id} style={{padding:"8px 14px",background:C.warnLight,border:`1px solid #C9BCA6`,marginBottom:6,fontSize:12,color:C.warn}}>
        ⏰ Bilet #{b.numar} · {b.furnizor} · {Number(b.valoare).toLocaleString("ro-RO")} RON — scadent {fmtD(b.scadenta)}
      </div>
    ))}

    {/* Sold initial + sold azi */}
    <div style={{...card,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Sold inițial</div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input type="number" value={trezorerie.soldInitial||0} onChange={e=>updT("soldInitial",Number(e.target.value))} style={{...inpS,width:130}}/>
            <span style={{fontSize:12,color:C.textMuted}}>RON</span>
          </div>
        </div>
        <div style={{flex:1}}/>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Sold azi</div>
          <div style={{fontSize:26,fontWeight:700,color:soldAzi<0?C.danger:C.accent}}>{soldAzi.toLocaleString("ro-RO")} RON</div>
        </div>
      </div>
    </div>

    {/* Sectiuni */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {[["registru","Registru"],["bilete","Bilete la ordin"],["recurente","Recurente"]].map(([id,l])=>
        <button key={id} onClick={()=>setSectiune(id)} style={{padding:"7px 14px",border:`1px solid ${sectiune===id?C.accent:C.border}`,background:sectiune===id?C.accentLight:"transparent",color:sectiune===id?C.accent:C.textSub,cursor:"pointer",fontSize:12,fontWeight:sectiune===id?500:400}}>{l}</button>
      )}
    </div>

    {/* REGISTRU ZILNIC */}
    {sectiune==="registru"&&<div>
      {zile.filter(z=>!z.isTrecut||z.totalIn>0||z.totalOut>0||z.isAzi).map(z=>(
        <div key={z.data} style={{...card,marginBottom:10,opacity:z.isTrecut&&!z.isAzi?0.7:1,border:z.isAzi?`2px solid ${C.accent}`:`1px solid ${C.border}`}}>

          {/* Header zi */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:z.isAzi?C.accent:C.text}}>{z.label}</div>
              <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>Sold la început de zi: <strong style={{color:z.soldStart<0?C.danger:C.textSub}}>{z.soldStart.toLocaleString("ro-RO")} RON</strong></div>
            </div>
            {z.isAzi&&<span style={{fontSize:10,background:C.accent,color:"#fff",padding:"3px 8px",fontWeight:600}}>AZI</span>}
          </div>

          {/* ÎNCASĂRI */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:"#3A6A3A",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,marginBottom:6}}>↓ Încasări</div>
            {z.incasariZi.map(m=><div key={m.id} style={{marginBottom:4}}>
              {editId===m.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:"#F2F8F2",flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Descriere" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>salveazaEdit(m.id)} style={{...btnP("#3A6A3A"),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",gap:8,borderBottom:"1px dashed #C0DCC0"}}>
                  <span style={{flex:1,fontSize:13,color:"#2A4A2A"}}>{m.descriere||"—"}</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#2A6A2A",minWidth:140,textAlign:"right"}}>+{m.suma.toLocaleString("ro-RO")} RON</span>
                  <button onClick={()=>{setEditId(m.id);setEditData({descriere:m.descriere,suma:m.suma,data:m.data});}} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,width:16}}>✎</button>
                  <button onClick={()=>stergeInreg(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.danger,fontSize:14,width:16}}>×</button>
                </div>
              }
            </div>)}
            {/* Buton adauga incasare */}
            {showForm?.data===z.data&&showForm?.tip==="incasare"?
              <div style={{display:"flex",gap:6,alignItems:"center",padding:"8px 10px",background:"#F2F8F2",marginTop:4}}>
                <input autoFocus value={formData.descriere} onChange={e=>setFormData(x=>({...x,descriere:e.target.value}))} placeholder="Client / descriere" style={{...inpS,flex:2}}/>
                <input type="number" value={formData.suma} onChange={e=>setFormData(x=>({...x,suma:e.target.value}))} placeholder="Sumă" style={{...inpS,width:100}}/>
                <button onClick={()=>{adaugaInreg(z.data,"incasare");setShowForm(null);}} style={{...btnP("#3A6A3A"),fontSize:11,padding:"5px 12px"}}>✓</button>
                <button onClick={()=>setShowForm(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
              </div>:
              <button onClick={()=>{setShowForm({data:z.data,tip:"incasare"});setFormData({descriere:"",suma:"",});}} style={{fontSize:11,color:"#2A2118",border:"none",padding:"4px 12px",background:"#5C6B65",cursor:"pointer",marginTop:4}}>+ adaugă încasare</button>
            }
            {z.totalIn>0&&<div style={{textAlign:"right",fontSize:12,fontWeight:700,color:"#2A6A2A",marginTop:6,paddingTop:6,borderTop:"1px solid #D0E8D0"}}>Total încasări: +{z.totalIn.toLocaleString("ro-RO")} RON</div>}
          </div>

          {/* PLĂȚI */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.danger,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,marginBottom:6}}>↑ Plăți</div>
            {z.platiZi.map(m=><div key={m.id} style={{marginBottom:4}}>
              {editId===m.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:C.dangerLight,flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Descriere" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>salveazaEdit(m.id)} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",gap:8,borderBottom:"1px dashed #DDB8B8"}}>
                  <span style={{flex:1,fontSize:13,color:"#4A2A2A"}}>{m.descriere||"—"}</span>
                  <span style={{fontSize:14,fontWeight:700,color:C.danger,minWidth:140,textAlign:"right"}}>-{m.suma.toLocaleString("ro-RO")} RON</span>
                  <button onClick={()=>{setEditId(m.id);setEditData({descriere:m.descriere,suma:m.suma,data:m.data});}} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,width:16}}>✎</button>
                  <button onClick={()=>stergeInreg(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.danger,fontSize:14,width:16}}>×</button>
                </div>
              }
            </div>)}
            {/* Bilete scadente */}
            {z.bileteZi.map(b=><div key={b.id} style={{marginBottom:4}}>
              {editId===b.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:C.dangerLight,flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Furnizor" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>{setBilete(p=>p.map(x=>x.id!==b.id?x:{...x,furnizor:editData.descriere,valoare:Number(editData.suma),scadenta:editData.data}));setEditId(null);}} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",background:"#FBF5F5",gap:8}}>
                  <span style={{flex:1,fontSize:13,color:"#4A2A2A"}}>Bilet #{b.numar} · {b.furnizor}</span>

                      <button onClick={()=>setFormData(x=>({...x,addingFurnizor:false}))} style={{...btnS,fontSize:11,padding:"5px 8px"}}>✕</button>
                    </>:
                    <>
                      <select value={formData.descriere} onChange={e=>setFormData(x=>({...x,descriere:e.target.value}))} style={{...inpS,flex:2,minWidth:120}}>
                        <option value="">— alege furnizor —</option>
                        {furnizoriLista.map(f=><option key={f} value={f}>{f}</option>)}
                      </select>
                      <button onClick={()=>setFormData(x=>({...x,addingFurnizor:true}))} style={{fontSize:11,padding:"5px 10px",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",color:C.textSub,whiteSpace:"nowrap"}}>+ nou</button>
                    </>
                  }
                  <input type="number" value={formData.suma} onChange={e=>setFormData(x=>({...x,suma:e.target.value}))} placeholder="Sumă" style={{...inpS,width:100}}/>

                  <button onClick={()=>{adaugaInreg(z.data,"plata");setShowForm(null);}} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓ Salvează</button>

              </div>:
              <button onClick={()=>{setShowForm({data:z.data,tip:"plata"});setFormData({descriere:"",suma:"",addingFurnizor:false});}} style={{fontSize:11,color:"#2A2118",border:"none",padding:"4px 12px",background:"#5C6B65",cursor:"pointer",marginTop:4}}>+ adaugă plată</button>
            }
            {z.totalOut>0&&<div style={{textAlign:"right",fontSize:12,fontWeight:700,color:C.danger,marginTop:6,paddingTop:6,borderTop:"1px solid #DED2BE"}}>Total plăți: -{z.totalOut.toLocaleString("ro-RO")} RON</div>}
          </div>

          {/* SOLD FINAL ZI */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:z.soldEnd<0?C.dangerLight:C.accentLight,marginTop:4}}>
            <div style={{fontSize:12,color:C.textSub}}>
              {z.soldStart.toLocaleString("ro-RO")} RON
              {z.totalIn>0&&<span style={{color:"#3A6A3A"}}> + {z.totalIn.toLocaleString("ro-RO")}</span>}
              {z.totalOut>0&&<span style={{color:C.danger}}> − {z.totalOut.toLocaleString("ro-RO")}</span>}
            </div>
            <div style={{fontSize:16,fontWeight:700,color:z.soldEnd<0?C.danger:C.accent}}>= {z.soldEnd.toLocaleString("ro-RO")} RON</div>
          </div>
        </div>
      ))}
    </div>}

    {/* BILETE LA ORDIN */}
    {sectiune==="bilete"&&<div>
      <AddBiletForm furnizori={furnizoriLista} onAddFurnizor={(f)=>setFurnizoriLista(p=>[...p,f])} onAdd={(b)=>setBilete(p=>[{id:gid(),...b,achitat:false},...p])}/>
      {bilete.length>0&&<div style={{display:"flex",gap:10,marginBottom:12}}>
        <div style={{flex:1,...card,padding:"12px 16px",marginBottom:0}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Neachitat</div>
          <div style={{fontSize:18,fontWeight:700,color:C.danger}}>{bilete.filter(b=>!b.achitat).reduce((s,b)=>s+Number(b.valoare||0),0).toLocaleString("ro-RO")} RON</div>
        </div>
        <div style={{flex:1,...card,padding:"12px 16px",marginBottom:0}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Achitat</div>
          <div style={{fontSize:18,fontWeight:700,color:C.accent}}>{bilete.filter(b=>b.achitat).reduce((s,b)=>s+Number(b.valoare||0),0).toLocaleString("ro-RO")} RON</div>
        </div>
      </div>}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"70px 1fr 110px 100px 90px 40px",padding:"8px 14px",background:C.bg,borderBottom:`1px solid ${C.border}`}}>
          {["NR.","FURNIZOR","VALOARE","SCADENȚĂ","STATUS",""].map(h=><div key={h} style={{fontSize:9,fontWeight:600,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</div>)}
        </div>
        {bilete.length===0&&<div style={{padding:"2rem",textAlign:"center",fontSize:13,color:C.textMuted}}>Niciun bilet la ordin.</div>}
        {bilete.map(b=>{
          const ov=!b.achitat&&b.scadenta&&b.scadenta<tday();
          const soon=!b.achitat&&b.scadenta&&daysTo(b.scadenta)<=7&&daysTo(b.scadenta)>=0;
          return <div key={b.id} style={{display:"grid",gridTemplateColumns:"70px 1fr 110px 100px 90px 40px",padding:"10px 14px",borderBottom:`1px solid ${C.bg}`,alignItems:"center",opacity:b.achitat?0.55:1}}>
            <div style={{fontSize:12,color:C.textSub}}>#{b.numar}</div>
            <div style={{fontSize:13,color:C.text,fontWeight:500}}>{b.furnizor}</div>
            <div style={{fontSize:13,fontWeight:600,color:ov?C.danger:C.text}}>{Number(b.valoare||0).toLocaleString("ro-RO")} RON</div>
            <div style={{fontSize:12,color:ov?C.danger:soon?C.warn:C.textSub,fontWeight:ov||soon?600:400}}>{fmtD(b.scadenta)}</div>
            <button onClick={()=>setBilete(p=>p.map(x=>x.id===b.id?{...x,achitat:!x.achitat}:x))}
              style={{fontSize:10,padding:"3px 8px",border:"none",cursor:"pointer",fontWeight:500,background:b.achitat?C.accentLight:C.dangerLight,color:b.achitat?C.accent:C.danger}}>
              {b.achitat?"✓ Achitat":"Neachitat"}
            </button>
            <button onClick={()=>setBilete(p=>p.filter(x=>x.id!==b.id))} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:16}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {/* PLATI RECURENTE */}
    {sectiune==="recurente"&&<div>
      <div style={{marginBottom:12}}>
        <button onClick={()=>setShowAddRec(!showAddRec)} style={{...btnP(),fontSize:11}}>+ Plată recurentă nouă</button>
      </div>
      {showAddRec&&<div style={{...card,marginBottom:12}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <input placeholder="ex: Salarii, Chirie..." value={newRec.denumire} onChange={e=>setNewRec(x=>({...x,denumire:e.target.value}))} style={{...inpS,flex:2,minWidth:150}}/>
          <input type="number" placeholder="Sumă RON" value={newRec.suma} onChange={e=>setNewRec(x=>({...x,suma:e.target.value}))} style={{...inpS,width:120}}/>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:12,color:C.textMuted}}>Ziua</span>
            <input type="number" min="1" max="31" value={newRec.ziua} onChange={e=>setNewRec(x=>({...x,ziua:e.target.value}))} style={{...inpS,width:60}}/>
            <span style={{fontSize:12,color:C.textMuted}}>a lunii</span>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={adaugaRec} style={{...btnP(),fontSize:11}}>Salvează</button>
          <button onClick={()=>setShowAddRec(false)} style={{...btnS,fontSize:11}}>Anulează</button>
        </div>
      </div>}
      {recurente.length===0&&<div style={{textAlign:"center",padding:"2rem",fontSize:13,color:C.textMuted}}>Nicio plată recurentă.</div>}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {recurente.map(r=><div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${C.bg}`,flexWrap:"wrap"}}>
          <div style={{flex:2,minWidth:120}}>
            <input value={r.denumire} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,denumire:e.target.value}))} style={{width:"100%",fontSize:13,fontWeight:500,color:C.text,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",background:C.surface}}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:11,color:C.textMuted}}>Ziua</span>
            <input type="number" min="1" max="31" value={r.ziua} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,ziua:e.target.value}))} style={{width:50,fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",textAlign:"center",background:C.surface}}/>
            <span style={{fontSize:11,color:C.textMuted}}>/ lună</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <input type="number" value={r.suma} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,suma:Number(e.target.value)||0}))} style={{width:100,fontSize:13,fontWeight:600,color:C.danger,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",textAlign:"right",background:C.surface}}/>
            <span style={{fontSize:12,color:C.textMuted}}>RON</span>
          </div>
          <button onClick={()=>updT("recurente",recurente.filter(x=>x.id!==r.id))} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:16}}>×</button>
        </div>)}
        {recurente.length>0&&<div style={{padding:"10px 16px",background:C.bg,fontSize:12,fontWeight:600,color:C.danger,textAlign:"right"}}>
          Total lunar: {recurente.reduce((s,r)=>s+r.suma,0).toLocaleString("ro-RO")} RON
        </div>}
      </div>
    </div>}
  </div>;
}


function AddFacturaForm({motoare, onAdd}){
  const [open,setOpen]=React.useState(false);
  const [furnizor,setFurnizor]=React.useState("");
  const [factura,setFactura]=React.useState("");
  const [data,setData]=React.useState(tday());
  const [pozitii,setPozitii]=React.useState([{id:"p1",model:motoare[0]?.model||"",qty:1}]);
  const C2={bg:"#F2EFE9",surface:"#FAF8F4",border:"#E0D8CC",text:"#2A2118",textMuted:"#A8998A"};
  const addPoz=()=>setPozitii(p=>[...p,{id:Date.now().toString(),model:motoare[0]?.model||"",qty:1}]);
  const updPoz=(id,f,v)=>setPozitii(p=>p.map(pz=>pz.id!==id?pz:{...pz,[f]:f==="qty"?parseInt(v)||1:v}));
  const delPoz=(id)=>setPozitii(p=>p.filter(pz=>pz.id!==id));
  const handleSave=()=>{
    if(pozitii.length===0) return;
    onAdd({furnizor:furnizor||"Furnizor necunoscut",factura,data,pozitii:[...pozitii]});
    setFurnizor("");setFactura("");setData(tday());
    setPozitii([{id:"p1",model:motoare[0]?.model||"",qty:1}]);
    setOpen(false);
  };
  if(!open) return <button onClick={()=>setOpen(true)} style={{width:"100%",padding:"11px",fontSize:12,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer",fontWeight:500,marginBottom:16}}>+ Înregistrează intrare nouă (factură)</button>;
  return <div style={{background:"#F2F8F2",border:"1.5px solid #90C090",padding:"16px",marginBottom:16}}>
    <div style={{fontSize:11,color:"#3A6A3A",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:12}}>Intrare nouă · Factură</div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
      <div style={{flex:2,minWidth:120}}><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Furnizor *</div>
        <input value={furnizor} onChange={e=>setFurnizor(e.target.value)} placeholder="ex: Coulisse" style={{width:"100%",fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
      <div style={{flex:2,minWidth:120}}><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Nr. factură</div>
        <input value={factura} onChange={e=>setFactura(e.target.value)} placeholder="ex: F2024-001" style={{width:"100%",fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Data</div>
        <input type="date" value={data} onChange={e=>setData(e.target.value)} style={{fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
    </div>
    <div style={{fontSize:10,color:C2.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:8}}>Poziții</div>
    {pozitii.map((pz,i)=><div key={pz.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
      <select value={pz.model} onChange={e=>updPoz(pz.id,"model",e.target.value)} style={{fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 8px",background:C2.surface,outline:"none",flex:1}}>
        {motoare.map(m=><option key={m.model} value={m.model}>{m.model}</option>)}
      </select>
      <input type="number" min="1" value={pz.qty} onChange={e=>updPoz(pz.id,"qty",e.target.value)} style={{width:70,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 8px",outline:"none",textAlign:"center"}}/>
      <span style={{fontSize:12,color:C2.textMuted}}>buc.</span>
      {pozitii.length>1&&<button onClick={()=>delPoz(pz.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#C07070",fontSize:16,padding:"0 4px"}}>×</button>}
    </div>)}
    <button onClick={addPoz} style={{fontSize:11,color:"#2A2118",border:"none",padding:"4px 12px",background:"#5C6B65",cursor:"pointer",marginBottom:12}}>+ adaugă poziție</button>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
      <button onClick={()=>setOpen(false)} style={{padding:"7px 16px",border:`1px solid ${C2.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C2.textMuted}}>Anulează</button>
      <button onClick={handleSave} style={{padding:"7px 20px",border:"none",background:"#3A6A3A",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:500}}>Salvează factura</button>
    </div>
  </div>;
}

function EnergieCard({energie,setEnergie,C,card,tday}){
  const azi=tday();
  const eAzi=energie[azi]||{};
  const completat=!!(eAzi.nivel&&eAzi.mod&&eAzi.contact!==undefined);
  const [open,setOpen]=useState(!completat);
  const updEnergie=(field,val)=>setEnergie(p=>({...p,[azi]:{...(p[azi]||{}),[field]:val}}));
  const culoareNivel=eAzi.nivel?C.accent:C.textMuted;
  const emojiNivel="·";
  return <div style={{...card,marginBottom:12,padding:"14px 18px",border:completat?`1px solid ${C.border}`:`1.5px solid ${C.accent}`}}>
    <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",userSelect:"none"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:16}}>{emojiNivel}</span>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:completat?culoareNivel:C.accent,textTransform:"uppercase",letterSpacing:"0.08em"}}>
            {completat?"Stare zilnică":"Cum ești azi?"}
          </div>
          {completat&&<div style={{fontSize:11,color:C.textMuted,marginTop:1}}>
            {{"1":"Energie scăzută","2":"Energie medie","3":"Energie ridicată"}[eAzi.nivel]}
            {" · "}{eAzi.mod==="blocuri"?"Blocuri mari":"Task-uri mici"}
            {" · "}{eAzi.contact?"Deschisă spre contact":"Fără contact extern"}
          </div>}
        </div>
      </div>
      <span style={{fontSize:11,color:C.textMuted}}>{open?"▾":"▸"}</span>
    </div>
    {open&&<div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Energie</div>
        <div style={{display:"flex",gap:8}}>
          {[["1","Scăzută"],["2","Medie"],["3","Ridicată"]].map(([v,l])=>
            <button key={v} onClick={()=>updEnergie("nivel",v)}
              style={{flex:1,padding:"8px 6px",border:`1.5px solid ${eAzi.nivel===v?C.accent:C.border}`,background:eAzi.nivel===v?C.accentLight:"transparent",color:eAzi.nivel===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.nivel===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Focalizare posibilă</div>
        <div style={{display:"flex",gap:8}}>
          {[["blocuri","Blocuri mari de timp"],["mici","Task-uri mici / rapide"]].map(([v,l])=>
            <button key={v} onClick={()=>updEnergie("mod",v)}
              style={{flex:1,padding:"8px 10px",border:`1.5px solid ${eAzi.mod===v?C.accent:C.border}`,background:eAzi.mod===v?C.accentLight:"transparent",color:eAzi.mod===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.mod===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      <div style={{marginBottom:4}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Contact extern</div>
        <div style={{display:"flex",gap:8}}>
          {[[true,"Da, sunt deschisă"],[false,"Nu azi"]].map(([v,l])=>
            <button key={String(v)} onClick={()=>updEnergie("contact",v)}
              style={{flex:1,padding:"8px 10px",border:`1.5px solid ${eAzi.contact===v?C.accent:C.border}`,background:eAzi.contact===v?C.accentLight:"transparent",color:eAzi.contact===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.contact===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      {completat&&<button onClick={()=>setOpen(false)} style={{marginTop:12,width:"100%",padding:"7px",border:"none",background:C.accent,color:"#fff",cursor:"pointer",fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase"}}>✓ Salvat</button>}
    </div>}
  </div>;
}

                    <input value={it.link||""} onChange={e=>updTaskJurnalItem(pi,ti,it.id,"link",e.target.value)} placeholder="Link" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.bg,outline:"none",marginBottom:6,boxSizing:"border-box"}}/>
                    {it.link&&<a href={it.link.startsWith("http")?it.link:`https://${it.link}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:C.accent,display:"inline-block",marginBottom:6}}>Deschide link →</a>}
                    <input value={it.nota||""} onChange={e=>updTaskJurnalItem(pi,ti,it.id,"nota",e.target.value)} placeholder="Ce mi-a plăcut / observații" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.bg,outline:"none",boxSizing:"border-box"}}/>
                  </div>)}
                  <div style={{display:"flex",gap:8}}>
                    <input value={newTaskJurnalItemText} onChange={e=>setNewTaskJurnalItemText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){addTaskJurnalItem(pi,ti,newTaskJurnalItemText);setNewTaskJurnalItemText("");}}} placeholder="Titlu nou..." style={{flex:1,fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"}}/>
                    <button onClick={()=>{addTaskJurnalItem(pi,ti,newTaskJurnalItemText);setNewTaskJurnalItemText("");}} style={{fontSize:12,color:"#2A2118",background:"#5C6B65",border:"none",padding:"0 16px",cursor:"pointer"}}>+ adaugă</button>
                  </div>
                </div>}
              </div>;
            })}
            {addingToPr===pi?<div style={{...row,marginTop:8}}>
              <input autoFocus value={newTaskPr[pi]||""} onChange={e=>setNewTaskPr(p=>({...p,[pi]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")addPrTask(pi);if(e.key==="Escape")setAddingToPr(null);}} placeholder="Sarcina nouă..." style={{...inp,flex:1,padding:"7px 10px"}}/>
              <button onClick={()=>addPrTask(pi)} style={btnP(color)}>OK</button>
              <button onClick={()=>setAddingToPr(null)} style={btnS}>✕</button>
            </div>:<div style={{...row,justifyContent:"space-between",marginTop:8,marginBottom:8}}>
              <button onClick={()=>setAddingToPr(pi)} style={{...btnS,fontSize:12,padding:"4px 12px"}}>+ sarcină</button>
              <button onClick={()=>delPr(pi)} style={{fontSize:12,color:C.textMuted,border:"none",background:"transparent",cursor:"pointer"}}>șterge proiect</button>
            </div>}
          </div>}
        </div>;
      })}
      <div style={{marginTop:12}}>
        {addingPr?<div style={row}>
          <input autoFocus value={newPrName} onChange={e=>setNewPrName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addPr();if(e.key==="Escape")setAddingPr(false);}} placeholder="Nume proiect (ex: Renovare apartament)..." style={{...inp,flex:1}}/>
          <button onClick={addPr} style={btnP()}>Adaugă</button>
          <button onClick={()=>setAddingPr(false)} style={btnS}>✕</button>
        </div>:<button onClick={()=>setAddingPr(true)} style={{width:"100%",padding:"12px",fontSize:13,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer"}}>+ proiect nou</button>}
      </div>
    </div>}

    {tab==="perdele"&&<div>
      <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:4}}>Plan Dezvoltare · Perdele & Smart Shading</div>
      <PBar pct={perdele.reduce((s,e)=>s+e.taskuri.length,0)?Math.round(perdele.reduce((s,e)=>s+e.taskuri.filter(t=>t.done).length,0)/perdele.reduce((s,e)=>s+e.taskuri.length,0)*100):0} color="#4A6070"/>
      <div style={{marginTop:16}}>
        {perdele.map((etapa,ei)=>{
          const dE=etapa.taskuri.filter(t=>t.done).length,tE=etapa.taskuri.length,pE=tE?Math.round(dE/tE*100):0,isOpen=openEtapa[ei];
          const sorted=[...etapa.taskuri].sort((a,b)=>{if(!a.deadline&&!b.deadline)return 0;if(!a.deadline)return 1;if(!b.deadline)return -1;return a.deadline>b.deadline?1:-1;});
          return <div key={ei} style={{border:`1px solid ${C.border}`,marginBottom:10,overflow:"hidden",background:C.surface}}>
            <div onClick={()=>setOpenEtapa(p=>({...p,[ei]:!p[ei]}))} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 18px",cursor:"pointer",userSelect:"none"}}>
              <div style={{width:40,height:40,background:etapa.color,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:13,fontWeight:300,color:"rgba(255,255,255,0.9)"}}>{pE}%</span></div>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500,color:C.text}}>{etapa.titlu}</div><div style={{fontSize:11,color:C.textMuted,marginTop:2}}>{etapa.period} · {dE}/{tE}</div></div>
              <div style={{fontSize:11,color:C.textMuted}}>{isOpen?"▾":"▸"}</div>
            </div>
            {isOpen&&<div style={{padding:"4px 16px 16px"}}>
              <div style={{background:C.border,height:"1px",marginBottom:12}}/>
              {sorted.map(t=>{
                const ov=t.deadline&&!t.done&&t.deadline<tday();
                return <div key={t.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 0",borderBottom:`1px solid ${C.bg}`,opacity:t.done?0.45:1}}>
                  <input type="checkbox" checked={t.done} onChange={()=>togP(ei,t.id)} style={{cursor:"pointer",width:15,height:15,marginTop:3,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:t.done?C.textMuted:C.text,textDecoration:t.done?"line-through":"none",lineHeight:1.55,marginBottom:8}}>{t.text}</div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:C.textMuted}}>Resp.</span><input value={t.resp||""} onChange={e=>updP(ei,t.id,"resp",e.target.value)} style={{...inp,width:140,padding:"3px 8px",fontSize:12,color:etapa.color,fontWeight:500}}/></div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:C.textMuted}}>Termen</span><input type="date" value={t.deadline||""} onChange={e=>updP(ei,t.id,"deadline",e.target.value)} style={{...inp,width:"auto",padding:"3px 8px",fontSize:12,color:ov?C.danger:C.text}}/></div>
                      {ov&&<span style={{fontSize:11,color:C.danger,fontWeight:500}}>Depășit</span>}
                    </div>
                  </div>
                </div>;
              })}
            </div>}
          </div>;
        })}
      </div>
    </div>}

    {tab==="vopsele"&&<div style={{textAlign:"center",padding:"4rem 1rem"}}>
      <div style={{fontSize:13,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:12}}>În construcție</div>
      <div style={{fontSize:20,fontWeight:300,color:C.text,marginBottom:8}}>Plan Dezvoltare Vopsele</div>
      <div style={{fontSize:13,color:C.textMuted,maxWidth:360,margin:"0 auto",lineHeight:1.7}}>Planul pentru Benjamin Moore — sesiune dedicată.</div>
    </div>}

    {tab==="trezorerie"&&<CashFlowTab trezorerie={trezorerie} setTrezorerie={setTrezorerie} bilete={bilete} setBilete={setBilete} furnizoriLista={furnizoriLista} setFurnizoriLista={setFurnizoriLista} C={C} card={card} inp={inp} btnP={btnP} btnS={btnS} row={row} fmtD={fmtD} tday={tday} gid={gid} daysTo={daysTo}/> }

    {tab==="chat"&&<div>
      <div style={{fontSize:11,color:C.textMuted,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.06em"}}>Asistentă · prioritizare · execuție</div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,minHeight:280,maxHeight:400,overflowY:"auto",padding:16,marginBottom:12,display:"flex",flexDirection:"column",gap:10}}>
        {chat.length===0&&<div style={{color:C.textMuted,fontSize:13,textAlign:"center",marginTop:"3rem",lineHeight:1.7}}>Ce faci <strong>mai întâi</strong> azi?<br/><span style={{fontSize:12}}>Sau scrie "bună dimineața" să stabilim top 3 împreună.</span></div>}
        {chat.map((m,i)=><div key={i} style={{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"80%"}}>
          <div style={{background:m.role==="user"?C.accent:C.bg,color:m.role==="user"?"#fff":C.text,border:m.role==="assistant"?`1px solid ${C.border}`:"none",padding:"10px 14px",fontSize:13,lineHeight:1.6}}>{m.content}</div>
        </div>)}
        {loading&&<div style={{alignSelf:"flex-start"}}><div style={{background:C.bg,border:`1px solid ${C.border}`,padding:"10px 14px",fontSize:13,color:C.textMuted}}>···</div></div>}
        <div ref={chatRef}/>
      </div>
      <div style={row}>
        <input style={{...inp,flex:1}} value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()} placeholder="Ce faci acum? Ce te blochează?"/>
        <button style={btnP()} onClick={sendChat} disabled={loading}>{loading?"···":"Trimite"}</button>
      </div>
      <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
        {["Bună dimineața, stabilim top 3","Ce am amânat?","Ce pot delega azi?"].map(s=><button key={s} style={{fontSize:11,padding:"5px 10px",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",color:C.textSub}} onClick={()=>setChatInput(s)}>{s}</button>)}
      </div>
    </div>}

    </div>
  </div>;
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
