function excelOdd(x){
  const c = Math.ceil(Math.abs(x));
  const odd = (c%2===0) ? c+1 : c;
  return x<0 ? -odd : odd;
}

// Excel SEARCH-style wildcard match: ? = any 1 char, * = any sequence, case-insensitive substring
function wildcardMatch(pattern, text){
  if(pattern==="" || pattern==null) return true; // empty pattern = always matches (like Excel SEARCH(""))
  if(pattern==="@") return true; // "@" used in sheet as "any / no constraint"
  const esc = pattern.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\?/g,".").replace(/\*/g,".*");
  return new RegExp(esc, "i").test(text);
}

function getPartsList(articleCode, calcResult, numberOfSystems){
  const mult = numberOfSystems||1;
  return PARTS.map(p=>{
    const used = p.used.some(pat=>wildcardMatch(pat, articleCode));
    if(!used) return null;
    const excluded = p.excl.some(pat=>wildcardMatch(pat, articleCode));
    if(excluded) return null;
    const colourOk = !p.colourCode || wildcardMatch(p.colourCode, articleCode);
    if(!colourOk) return null;
    const qty = p.qty(calcResult)*mult;
    if(!qty || qty<=0) return null;
    return {code:p.code, desc:p.desc, colour:p.colour, qty: Math.round(qty*100)/100};
  }).filter(Boolean);
}

  return {errors, warnings};

function romanCalc(input){
  const {width,height,installHeight,mechKey,motorKey,fabricKey,colourKey,controlSide,cordsSpools,options} = input;
  const mech = RS_MECH[mechKey];
  const isMotor = mechKey==="RSC-B10 motorised";
  const isTwin = mechKey==="RSC-I10 twin pull";

  const tubelength = width - mech.tubeDed;
  const profilelength = width - mech.profileDed;
  const btbrailLength = width - mech.midrailDed;

  const maxDistSpools=800, overhangSpools=160;
  const spoolsRaw = Math.ceil((width-2*overhangSpools)/maxDistSpools);
  const spoolsAuto = (spoolsRaw<=1?2:spoolsRaw+1);
  const numberSpools = (cordsSpools==="Auto"||!cordsSpools) ? spoolsAuto : Number(cordsSpools);

  const maxDistClips=800, overhangClips=100;
  const clipsRaw = Math.ceil((width-2*overhangClips)/maxDistClips);
  const numberClips = clipsRaw===1?2:clipsRaw+1;

  let tiltrod1, tiltrod2=null;
  if(isMotor){
    if(numberSpools%2===0){ tiltrod1=tubelength/2; } else { tiltrod1=(tubelength/2)-(0.5*maxDistSpools); }
    tiltrod2 = tubelength - tiltrod1;
  } else {
    tiltrod1 = tubelength;
  }

  const cordConsumption = 2600;

  const widthCode="W"+(width<1000?"0":"")+width+"-";
  const heightCode="H"+(height<1000?"0":"")+height+"-";
  const mhCode="MH"+(installHeight?(installHeight<1000?"0":""):"9999")+(installHeight||"")+"-";
  const colourCode2=RS_COLOURS[colourKey];
  const controlCode=isMotor?"":(RS_CONTROL_SIDE[controlSide]||"");
  const fabricCode=RS_FABRICS[fabricKey];
  const motorCode = isMotor ? (RS_MOTORS[motorKey]?RS_MOTORS[motorKey].code+"-":"") : "";
  const optCodes=(options||[]).map(o=>RS_OPTIONS[o].code+"-").join("");

  const articleCode = mech.code+"-"+colourCode2+"-"+widthCode+heightCode+mhCode+motorCode+optCodes+"SPL"+numberSpools+"-"+(controlCode?controlCode+"-":"")+fabricCode;

  return {articleCode, headrail:Math.round(profilelength), tiltrod1:Math.round(tiltrod1), tiltrod2:tiltrod2?Math.round(tiltrod2):null,
    bottombar:Math.round(btbrailLength), spools:numberSpools, clips:numberClips, cordConsumption, isMotor, isTwin, mech};
}

function validateCoulisseInput(input){
  const {width, railSegments, packKey} = input;
  const pack = PACK_SIDES[packKey];
  const rs = Number(railSegments);
  const errors=[], warnings=[];
  if(width<400){
    errors.push(`Lățimea (${width}mm) e sub minimul admis de sistem (400mm).`);
  }
  if(width>10000){
    errors.push(`Lățimea (${width}mm) depășește maximul admis de sistem (10000mm).`);
  }
  if(input.height>5000){
    errors.push(`Înălțimea (${input.height}mm) depășește maximul admis de sistem (5000mm).`);
  }
  if(width>5800 && rs===1){
    errors.push(`Lățimea (${width}mm) depășește lungimea maximă a unei șine dintr-o bucată (5800mm). Alege minim 2 segmente de șină.`);
  }
  const uzuraNecentralaMultiSeg = rs>=2 && pack && !pack.center;
  const uzuraCentrala3Seg = pack && pack.center && rs===3;
  if(uzuraNecentralaMultiSeg){
    warnings.push(`Cu șină în ${rs} segmente și împachetare ${packKey} (nu centrală), căruciorul principal trece peste îmbinarea șinei — risc de uzură/blocare. Se recomandă "Center opening" pentru șine îmbinate.`);
  } else if(uzuraCentrala3Seg){
    warnings.push(`Chiar și cu deschidere centrală, la 3 segmente de șină un cărucior tot traversează o îmbinare — risc de uzură/blocare. Recomandat maxim 2 segmente.`);
  }
  return {errors, warnings};
}

function coulisseCalc(input){
  const {width, height, motorKey, gliderKey, packKey, colourKey, railSegments, options} = input;
  const motor = MOTORS[motorKey];
  const glider = GLIDER_TYPES[gliderKey];
  const pack = PACK_SIDES[packKey];
  const colourCode = COLOURS[colourKey];
  const motorized = motor.prefix.startsWith("CC-B");
  const center = pack.center;

  const railOffset = motor.railOffset;
  const rail = width - railOffset;
  const belt = motorized ? (width*2 + motor.beltOffset) : 0;

  let glidersRaw;
  if(glider.type==="pleat"){
    const spacing = 1000/(glider.perMeter-1);
    glidersRaw = center ? Math.ceil(width/spacing/2) : Math.ceil(width/spacing);
  } else {
    glidersRaw = center ? excelOdd(width/glider.spacing/2) : excelOdd(width/glider.spacing);
  }
  const gliders = glidersRaw;
  const hooks = center ? gliders+1 : (glider.type==="pleat" ? gliders+2 : gliders+1);

  const D53 = 500;
  const brackets = railSegments===2
    ? Math.ceil((((width-(motor.firstBracket*2))/D53)+1)/2)*2
    : Math.ceil((width-(motor.firstBracket*2))/D53)+1;

  const stackwidth = motor.endcapW + 43 + gliders*glider.pitch;

  const configCode = motor.prefix + glider.digit + pack.digit;
  const widthCode = "W"+(width<1000?"0":"")+width+"-";
  const heightCode = "H"+(height<1000?"0":"")+height+"-";
  const railSegCode = railSegments===2?"SGM2-":(railSegments===3?"SGM3-":"");
  const optCodes = (options||[]).map(o=>OPTIONS[o].code+"-").join("");
  const glidersCode = "RNR"+gliders+"-";
  const bracketsCode = "CLP"+brackets;

  const articleCode = configCode+"-"+motor.codeAdd+widthCode+heightCode+glider.code+"-"+colourCode+"-"+railSegCode+pack.code+"-"+optCodes+glidersCode+bracketsCode;

  return {articleCode, rail, belt, gliders, hooks, brackets, stackwidth, motorized, center};
}

function nxtRecur(r) {
  const now=new Date();
  const lastDone=r.lastDone||"";
  const dayOccurrence=(y,m,day)=>{
    let d=new Date(y,m,day);
    if(d.getMonth()!==((m%12)+12)%12) d=new Date(y,m+1,0); // depășire lună -> ultima zi a lunii
    return d;
  };
  if(r.type==="lunar_zi"){
    const day=parseInt(r.day);
    let y=now.getFullYear(), m=now.getMonth();
    let d=dayOccurrence(y,m,day), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; if(m>11){m=0;y+=1;} d=dayOccurrence(y,m,day); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="lunar_inceput"){
    let y=now.getFullYear(), m=now.getMonth();
    let d=new Date(y,m,1), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; if(m>11){m=0;y+=1;} d=new Date(y,m,1); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="lunar_sfarsit"){
    let y=now.getFullYear(), m=now.getMonth();
    let d=new Date(y,m+1,0), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; d=new Date(y,m+1,0); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="saptamanal"){
    const dm={"Luni":1,"Marți":2,"Miercuri":3,"Joi":4,"Vineri":5,"Sâmbătă":6,"Duminică":0};
    const target=dm[r.day]??1;
    let d=new Date(now); d.setDate(d.getDate()+((target-d.getDay()+7)%7));
    let ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ d.setDate(d.getDate()+7); ds=dateToKey(d); }
    return ds;
  }
  return tmrw();
}

function impactScore(task,cat,prio) {
  let s=0;
  if(prio==="Urgent")s+=40;else if(prio==="Normal")s+=20;
  if(cat==="Benjamin Moore"||cat==="Kreativo")s+=30;
  const t=(task||"").toLowerCase();
  if(t.includes("b2b")||t.includes("arhitect"))s+=25;
  if(t.includes("factur")||t.includes("plat"))s+=20;
  if(t.includes("campanie")||t.includes("ads"))s+=15;
  if(t.includes("ofert"))s+=10;
  return s;
}

function TudorDocumente({t,ti_,setTudor,C,sb,tday,fmtD}){
  const [uploading,setUploading]=React.useState(false);
  const inputRef=React.useRef(null);
  const fisiere=t.fisiere||[];
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const path=`tudor/${t.id}/${Date.now()}_${file.name}`;

      if(error){ alert("Eroare la încărcare: "+error.message); setUploading(false); return; }
      const {data}=sb.storage.from("oferte-clienti").getPublicUrl(path);
      setTudor(p=>p.map((x,i)=>i!==ti_?x:{...x,fisiere:[...(x.fisiere||[]),{nume:file.name,url:data.publicUrl,path,data:tday()}]}));
    }catch(err){ alert("Eroare: "+err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value="";
  };
  const handleDelete=async(f)=>{

    setTudor(p=>p.map((x,i)=>i!==ti_?x:{...x,fisiere:(x.fisiere||[]).filter(y=>y.path!==f.path)}));

    <button onClick={()=>inputRef.current?.click()} disabled={uploading} style={{fontSize:12,color:"#2A2118",border:"none",padding:"7px 12px",background:"#5C6B65",cursor:uploading?"default":"pointer",width:"100%"}}>{uploading?"Se încarcă...":"+ adaugă comandă (Excel)"}</button>
  </div>;
}

function BlocareZi({blocate,onAdd,onDel,C,fmtD}){
  const [start,setStart]=React.useState("");
  const [end,setEnd]=React.useState("");
  const [motiv,setMotiv]=React.useState("");
  const sorted=(blocate||[]).slice().sort((a,b)=>a.dataStart<b.dataStart?-1:1);
  return <div style={{marginTop:20}}>
    <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Blocare perioadă</div>
    <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
      <input type="date" value={start} onChange={e=>{setStart(e.target.value);if(!end||end<e.target.value)setEnd(e.target.value);}} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
      <span style={{fontSize:12,color:C.textMuted}}>→</span>
      <input type="date" value={end} onChange={e=>setEnd(e.target.value)} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
      <input value={motiv} onChange={e=>setMotiv(e.target.value)} placeholder="Motiv (ex: concediu)" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 10px",background:C.surface,outline:"none",minWidth:120}}/>
      <button onClick={()=>{if(!start) return; onAdd(start,end||start,motiv); setStart(""); setEnd(""); setMotiv("");}} style={{fontSize:12,color:"#2A2118",background:"#5C6B65",border:"none",padding:"6px 14px",cursor:"pointer"}}>Blochează perioada</button>
    </div>
    {sorted.length>0&&<div>
      {sorted.map(z=><div key={z.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:C.bg,marginBottom:4}}>
        <span style={{fontSize:12,fontWeight:600,color:C.text,minWidth:150}}>{fmtD(z.dataStart)}{z.dataEnd&&z.dataEnd!==z.dataStart?` → ${fmtD(z.dataEnd)}`:""}</span>
        <span style={{fontSize:12,color:C.textSub,flex:1}}>{z.motiv||"—"}</span>
        <button onClick={()=>onDel(z.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14}}>×</button>
      </div>)}
    </div>}
  </div>;
}

function TabNico({clients,setClients,sb,tday,fmtD,C,blocate,onAddBlocat,onDelBlocat}){
  const [openId,setOpenId]=React.useState(null);
  const [calMonth,setCalMonth]=React.useState(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};});
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const ZILE_SCURT=["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const todayKey=tday();

  const nicoClients=clients.filter(c=>c.alocatNico).sort((a,b)=>a.name.localeCompare(b.name,"ro"));
  const client=clients.find(c=>c.id===openId);
  const ci=client?clients.indexOf(client):-1;

  const productieByDay={};
  nicoClients.forEach(c=>{
    const start=c.prodStart||"", end=c.prodEnd||start;
    if(!start||!end) return;
    let d=new Date(start);
    const endD=new Date(end);
    while(d<=endD){
      const key=d.toISOString().slice(0,10);
      (productieByDay[key]=productieByDay[key]||[]).push(c.name);
      d.setDate(d.getDate()+1);
    }
  });

  const addConsum=()=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:[...(c.consumuri||[]),{produs:"",cod:"",cantitate:""}]}));
  const updConsum=(idx,field,val)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).map((r,i)=>i!==idx?r:{...r,[field]:val})}));
  const delConsum=(idx)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).filter((_,i)=>i!==idx)}));
  const printConsum=()=>{
    if(!client) return;
    const rows=(client.consumuri||[]).map(r=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${r.produs||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cod||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cantitate||""}</td></tr>`).join("");
    const html=`<html><head><title>Consum ${client.name}</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Consum materiale — ${client.name}</h2>
      <table style="border-collapse:collapse;width:100%;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Produs</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
    printHtmlDoc(html);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10,fontWeight:600}}>Alocare producție</div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:10}}>
      <button onClick={()=>setCalMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[calMonth.m]} {calMonth.y}</div>
      <button onClick={()=>setCalMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
      {ZILE_SCURT.map(z=><div key={z} style={{textAlign:"center",fontSize:10,color:C.textMuted,fontWeight:600}}>{z}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:20}}>
      {(()=>{
        const first=new Date(calMonth.y,calMonth.m,1);
        const offset=(first.getDay()+6)%7;
        const total=daysInM(calMonth.y,calMonth.m);
        const cells=[];
        for(let i=0;i<offset;i++) cells.push(<div key={`e${i}`}/>);
        for(let day=1;day<=total;day++){
          const key=keyFor(calMonth.y,calMonth.m,day);
          const isToday=key===todayKey;
          const nume=productieByDay[key]||[];
          const dow=new Date(calMonth.y,calMonth.m,day).getDay();
          const isWeekend=dow===0||dow===6;
          const blocat=(blocate||[]).find(z=>key>=z.dataStart&&key<=(z.dataEnd||z.dataStart));
          let bg=nume.length?"#5C6B65":C.bg, textCol=nume.length?"rgba(255,255,255,0.75)":C.textMuted;
          if(isWeekend){bg="#DDD6C8";textCol="#A89E8C";}
          if(blocat){bg="#B8A88F";textCol="#fff";}
          cells.push(<div key={key} style={{minHeight:56,padding:"4px 5px",background:bg,border:isToday?`1.5px solid ${C.text}`:`1px solid ${C.border}`,overflow:"hidden"}}>
            <div style={{fontSize:11,fontWeight:isToday?700:400,color:textCol,marginBottom:2}}>{day}</div>
            {blocat?<div style={{fontSize:9,color:"#fff",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{blocat.motiv||"Blocat"}</div>:
             nume.map((n,i)=><div key={i} style={{fontSize:10,color:"rgba(255,255,255,0.95)",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n}</div>)}
          </div>);
        }
        return cells;
      })()}
    </div>

    <BlocareZi blocate={blocate} onAdd={onAddBlocat} onDel={onDelBlocat} C={C} fmtD={fmtD}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(105px,1fr))",gap:6,marginBottom:16,marginTop:20}}>
      {nicoClients.map((c,fi)=><div key={c.id} onClick={()=>setOpenId(c.id===openId?null:c.id)} style={{display:"flex",alignItems:"center",justifyContent:"center",aspectRatio:"1 / 1",padding:8,cursor:"pointer",userSelect:"none",textAlign:"center",background:CC[fi%CC.length],border:openId===c.id?"2px solid #2A2118":"1px solid transparent"}}>
        <span style={{fontSize:12,fontWeight:500,color:C.text,wordBreak:"break-word"}}>{c.name}</span>
      </div>)}
      {nicoClients.length===0&&<div style={{fontSize:13,color:C.textMuted,gridColumn:"1/-1",padding:"20px 0"}}>Niciun client alocat încă. Bifează "Alocă la Nico" din fișa clientului, în tab-ul Clienți.</div>}
    </div>
    {client&&<div style={{border:`1px solid ${C.border}`,background:C.surface}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{client.name}</div>
        <button onClick={()=>setOpenId(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.textSub,fontSize:15}}>×</button>
      </div>
      <div style={{padding:"12px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"10px 14px",background:C.bg,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.textMuted}}>Producție:</span>
          <input type="date" value={client.prodStart||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodStart:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
          <span style={{fontSize:12,color:C.textMuted}}>→</span>
          <input type="date" value={client.prodEnd||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodEnd:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Comenzi croitorie</div>
          <ComenziNico client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Poze și măsurători (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danPoze" folder="dan-poze" accept="image/*,.pdf" buttonLabel="+ fă poză / adaugă măsurătoare"/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Șină / sisteme de produs (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danComenzi" folder="dan-comenzi" accept=".pdf,.doc,.docx,.xlsx,.xls,.csv,image/*" buttonLabel="+ adaugă comandă"/>
        </div>

        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Consum materiale</div>
          {(client.consumuri||[]).map((r,idx)=><div key={idx} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
            <input value={r.produs} onChange={e=>updConsum(idx,"produs",e.target.value)} placeholder="Produs" style={{flex:2,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cod} onChange={e=>updConsum(idx,"cod",e.target.value)} placeholder="Cod" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cantitate} onChange={e=>updConsum(idx,"cantitate",e.target.value)} placeholder="Cantitate" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <button onClick={()=>delConsum(idx)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,flexShrink:0}}>×</button>
          </div>)}
          <button onClick={addConsum} style={{fontSize:12,color:"#2A2118",border:"none",padding:"6px 12px",background:"#5C6B65",cursor:"pointer",width:"100%",marginBottom:10}}>+ adaugă consum</button>
          {(client.consumuri||[]).length>0&&<button onClick={printConsum} style={{width:"100%",fontSize:12,fontWeight:600,padding:"8px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează consum</button>}
        </div>
      </div>
    </div>}
  </div>;
}

function TabConfigurator({C,clients,setClients,clientIdFixat}){
  const [width,setWidth]=React.useState(2000);
  const [height,setHeight]=React.useState(2500);
  const [motorKey,setMotorKey]=React.useState("CM-57");
  const [gliderKey,setGliderKey]=React.useState("Pleat");
  const [packKey,setPackKey]=React.useState("Right");
  const [colourKey,setColourKey]=React.useState("White");
  const [railSegments,setRailSegments]=React.useState(1);
  const [quantity,setQuantity]=React.useState(1);
  const [options,setOptions]=React.useState([]);
  const [clientId,setClientId]=React.useState(clientIdFixat||"");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const toggleOption=(opt)=>setOptions(p=>p.includes(opt)?p.filter(o=>o!==opt):[...p,opt]);

  let result=null, parts=[], error=null;
  try{
    result=coulisseCalc({width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),options});
    parts=getPartsList(result.articleCode,result,Number(quantity)||1);
  }catch(e){ error="Verifică valorile introduse."; }
  const {errors:validErrors,warnings:validWarnings}=validateCoulisseInput({width:Number(width),height:Number(height),railSegments:Number(railSegments),packKey});

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};

  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=(cfg)=>{
    const rows=cfg.parts.map(p=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${p.code}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}${p.colour?" ("+p.colour+")":""}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
    return `<html><head><title>Comandă Coulisse ${cfg.result.articleCode}</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Configurator Coulisse SmartCurtain</h2>
      ${cfg.clientName?`<p><b>Client:</b> ${cfg.clientName}${cfg.camera?" · "+cfg.camera:""}</p>`:""}
      ${cfg.observatii?`<p style="background:#5C6B65;color:#fff;padding:10px 14px;"><b>Observație:</b> ${cfg.observatii}</p>`:""}
      <p><b>Cod articol:</b> ${cfg.result.articleCode}</p>
      <p>Lățime: ${cfg.input.width}mm · Înălțime: ${cfg.input.height}mm · Motor: ${cfg.input.motorKey} · Glisor: ${cfg.input.gliderKey} · Împachetare: ${cfg.input.packKey} · Culoare: ${cfg.input.colourKey} · Segmente șină: ${cfg.input.railSegments} · Cantitate: ${cfg.input.quantity}</p>
      <p>Șină de tăiat: ${cfg.result.rail}mm · Curea: ${cfg.result.belt}mm · Glisoare/buc: ${cfg.result.gliders} · Cârlige/buc: ${cfg.result.hooks} · Console/buc: ${cfg.result.brackets} · Stackwidth: ${Math.round(cfg.result.stackwidth)}mm</p>
      <table style="border-collapse:collapse;width:100%;margin-top:14px;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
  };

  const printParts=()=>{
    if(!result) return;
    const html=buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:{width,height,motorKey,gliderKey,packKey,colourKey,railSegments,quantity},result,parts});
    printHtmlDoc(html);
  };

  const printSaved=(cfg)=>{
    const html=buildPrintHtml(cfg);
    printHtmlDoc(html);
  };

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(validErrors.length>0){ alert("Nu poți salva — sunt erori de validare care trebuie corectate întâi:\n\n"+validErrors.join("\n")); return; }
    if(validWarnings.length>0 && !window.confirm("Atenție:\n\n"+validWarnings.join("\n")+"\n\nSigur vrei să salvezi oricum?")) return;
    const cfg={
      id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      input:{width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),quantity:Number(quantity)||1,options},
      result, parts
    };
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiSina:[...(c.configuratiiSina||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator șină Coulisse SmartCurtain</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle} disabled={!!clientIdFixat}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Motor</label>
        <select value={motorKey} onChange={e=>setMotorKey(e.target.value)} style={selStyle}>
          {Object.keys(MOTORS).map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Tip glisor</label>
        <select value={gliderKey} onChange={e=>setGliderKey(e.target.value)} style={selStyle}>
          {Object.keys(GLIDER_TYPES).map(g=><option key={g} value={g}>{g}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Parte împachetare</label>
        <select value={packKey} onChange={e=>setPackKey(e.target.value)} style={selStyle}>
          {Object.keys(PACK_SIDES).map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare</label>
        <select value={colourKey} onChange={e=>setColourKey(e.target.value)} style={selStyle}>
          {Object.keys(COLOURS).map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Segmente șină</label>
        <select value={railSegments} onChange={e=>setRailSegments(e.target.value)} style={selStyle}>
          <option value={1}>1 (o bucată)</option>
          <option value={2}>2 (o îmbinare)</option>
          <option value={3}>3 (două îmbinări)</option>
        </select>
      </div>
      <div><label style={lblStyle}>Cantitate (buc. identice)</label><input type="number" min="1" value={quantity} onChange={e=>setQuantity(e.target.value)} style={selStyle}/></div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Opțiuni suplimentare</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {Object.keys(OPTIONS).map(opt=>
          <label key={opt} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer"}}>
            <input type="checkbox" checked={options.includes(opt)} onChange={()=>toggleOption(opt)}/>
            {opt}
          </label>
        )}
      </div>
    </div>

    {error&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{error}</div>}

    {validErrors.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>

      {validWarnings.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>

        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol {Number(quantity)>1?`(× ${quantity} buc.)`:""}</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[["Șină de tăiat",result.rail+" mm"],["Curea",result.belt+" mm"],["Glisoare / buc.",result.gliders],["Cârlige / buc.",result.hooks],["Console / buc.",result.brackets],["Stackwidth",Math.round(result.stackwidth)+" mm"]].map(([l,v])=>

    {result&&clients&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={salveazaLaClient} disabled={!clientId} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:clientId?"#5C6B65":C.border,color:"#2A2118",border:"none",cursor:clientId?"pointer":"default"}}>💾 Salvează configurația la client</button>
      {savedMsg&&<span style={{fontSize:12,color:C.accent,fontWeight:600}}>{savedMsg}</span>}
      {!clientId&&<span style={{fontSize:11,color:C.textMuted}}>Alege un client mai sus ca să poți salva.</span>}
    </div>}

    {result&&<div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <div style={{flex:1,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600}}>Listă piese de comandat ({parts.length})</div>
        <button onClick={printParts} style={{fontSize:12,fontWeight:600,padding:"6px 14px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
      </div>
      {parts.map(p=><div key={p.code} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.bg,marginBottom:3}}>
        <span style={{fontSize:12,fontWeight:600,color:C.accent,minWidth:100,flexShrink:0}}>{p.code}</span>
        <span style={{fontSize:12,color:C.text,flex:1}}>{p.desc}{p.colour&&` (${p.colour})`}</span>
        <span style={{fontSize:12,fontWeight:600,color:C.text,flexShrink:0}}>{p.qty}</span>
      </div>)}
    </div>}

    {clientObj&&(clientObj.configuratiiSina||[]).length>0&&<div>
      <div style={{height:1,background:C.border,margin:"8px 0 16px"}}/>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:10}}>Configurații salvate la {clientObj.name} ({(clientObj.configuratiiSina||[]).length})</div>
      {(clientObj.configuratiiSina||[]).map(cfg=>
        <ConfigSalvataRow key={cfg.id} cfg={cfg} clientId={clientObj.id} setClients={setClients} C={C} onPrint={()=>printSaved({...cfg,clientName:clientObj.name})}/>
      )}
    </div>}
  </div>;
}

function TabConfiguratorRoman({C,clients,setClients}){
  const [width,setWidth]=React.useState(1000);
  const [height,setHeight]=React.useState(1000);
  const [installHeight,setInstallHeight]=React.useState(1000);
  const [mechKey,setMechKey]=React.useState("RSC-A10 chain");
  const [motorKey,setMotorKey]=React.useState("CM-06");
  const [fabricKey,setFabricKey]=React.useState("normal 500 gr");
  const [colourKey,setColourKey]=React.useState("White");
  const [controlSide,setControlSide]=React.useState("Left");
  const [cordsSpools,setCordsSpools]=React.useState("Auto");
  const [options,setOptions]=React.useState([]);
  const [clientId,setClientId]=React.useState("");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const isMotor = mechKey==="RSC-B10 motorised";
  const toggleOption=(opt)=>setOptions(p=>p.includes(opt)?p.filter(o=>o!==opt):[...p,opt]);

  let result=null, parts=[], error=null;
  try{
    result=romanCalc({width:Number(width),height:Number(height),installHeight:Number(installHeight),mechKey,motorKey,fabricKey,colourKey,controlSide,cordsSpools,options});
    parts=getRomanPartsList(result.articleCode,result);
  }catch(e){ error="Verifică valorile introduse."; }
  const {errors:validErrors,warnings:validWarnings}=romanValidate({width:Number(width),height:Number(height),mechKey});

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};
  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=(cfg)=>{
    const rows=cfg.parts.map(p=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${p.code}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}${p.colour?" ("+p.colour+")":""}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
    return `<html><head><title>Comandă Stor Roman ${cfg.result.articleCode}</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Configurator Absolute Roman</h2>
      ${cfg.clientName?`<p><b>Client:</b> ${cfg.clientName}${cfg.camera?" · "+cfg.camera:""}</p>`:""}
      ${cfg.observatii?`<p style="background:#5C6B65;color:#fff;padding:10px 14px;"><b>Observație:</b> ${cfg.observatii}</p>`:""}
      <p><b>Cod articol:</b> ${cfg.result.articleCode}</p>
      <p>Lățime: ${cfg.input.width}mm · Înălțime: ${cfg.input.height}mm · Înălțime montaj: ${cfg.input.installHeight}mm · Mecanism: ${cfg.input.mechKey}${cfg.input.motorKey&&cfg.result.isMotor?" · Motor: "+cfg.input.motorKey:""} · Țesătură: ${cfg.input.fabricKey} · Culoare: ${cfg.input.colourKey}</p>
      <p>Șină: ${cfg.result.headrail}mm · Tub/tijă: ${cfg.result.tiltrod1}mm${cfg.result.tiltrod2?" + "+cfg.result.tiltrod2+"mm (2 bucăți)":""} · Bară de jos: ${cfg.result.bottombar}mm · Bobine: ${cfg.result.spools} · Console: ${cfg.result.clips}</p>
      <table style="border-collapse:collapse;width:100%;margin-top:14px;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
  };
  const printParts=()=>{ if(!result) return; printHtmlDoc(buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:{width,height,installHeight,mechKey,motorKey,fabricKey,colourKey},result,parts})); };
  const printSaved=(cfg)=>printHtmlDoc(buildPrintHtml(cfg));

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(validErrors.length>0){ alert("Nu poți salva — erori de validare:\n\n"+validErrors.join("\n")); return; }
    const cfg={id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      input:{width:Number(width),height:Number(height),installHeight:Number(installHeight),mechKey,motorKey,fabricKey,colourKey,controlSide,cordsSpools,options},
      result, parts};
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiRoman:[...(c.configuratiiRoman||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator Stor Roman (Absolute Roman)</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime montaj (mm)</label><input type="number" value={installHeight} onChange={e=>setInstallHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Mecanism</label>
        <select value={mechKey} onChange={e=>setMechKey(e.target.value)} style={selStyle}>
          {Object.keys(RS_MECH).map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      {isMotor&&<div><label style={lblStyle}>Motor</label>
        <select value={motorKey} onChange={e=>setMotorKey(e.target.value)} style={selStyle}>
          {Object.keys(RS_MOTORS).map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>}
      <div><label style={lblStyle}>Țesătură</label>
        <select value={fabricKey} onChange={e=>setFabricKey(e.target.value)} style={selStyle}>
          {Object.keys(RS_FABRICS).map(f=><option key={f} value={f}>{f}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare profil</label>
        <select value={colourKey} onChange={e=>setColourKey(e.target.value)} style={selStyle}>
          {Object.keys(RS_COLOURS).map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      {!isMotor&&<div><label style={lblStyle}>Parte comandă</label>
        <select value={controlSide} onChange={e=>setControlSide(e.target.value)} style={selStyle}>
          {Object.keys(RS_CONTROL_SIDE).map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>}
      <div><label style={lblStyle}>Bobine (spools)</label>
        <select value={cordsSpools} onChange={e=>setCordsSpools(e.target.value)} style={selStyle}>
          <option value="Auto">Auto</option>
          {[2,3,4,5,6,7,8,9,10].map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Opțiuni suplimentare</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {Object.keys(RS_OPTIONS).map(opt=>
          <label key={opt} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer"}}>
            <input type="checkbox" checked={options.includes(opt)} onChange={()=>toggleOption(opt)}/>
            {opt}
          </label>
        )}
      </div>
    </div>

    {error&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{error}</div>}
    {validErrors.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>⚠ Configurație imposibilă:</div>
      {validErrors.map((e,i)=><div key={i} style={{marginBottom:4}}>{e}</div>)}
    </div>}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>
      <div style={{padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol</div>
        <div style={{fontSize:14,fontWeight:600,color:C.text,wordBreak:"break-all"}}>{result.articleCode}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[["Șină",result.headrail+" mm"],result.tiltrod2?["Tub/tijă 1",result.tiltrod1+" mm"]:["Tub/tijă",result.tiltrod1+" mm"],...(result.tiltrod2?[["Tub/tijă 2",result.tiltrod2+" mm"]]:[]),["Bară de jos",result.bottombar+" mm"],["Bobine",result.spools],["Console",result.clips]].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{v}</div>
          </div>
        )}
      </div>
      {result.tiltrod2&&<div style={{padding:"0 16px 12px",fontSize:11,color:C.textMuted}}>Mecanism motorizat — tubul se taie în 2 bucăți (motorul intră central).</div>}
    </div>}

    {result&&clients&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={salveazaLaClient} disabled={!clientId} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:clientId?"#5C6B65":C.border,color:"#2A2118",border:"none",cursor:clientId?"pointer":"default"}}>💾 Salvează configurația la client</button>
      {savedMsg&&<span style={{fontSize:12,color:C.accent,fontWeight:600}}>{savedMsg}</span>}
    </div>}

    {result&&<div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <div style={{flex:1,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600}}>Listă piese de comandat ({parts.length})</div>
        <button onClick={printParts} style={{fontSize:12,fontWeight:600,padding:"6px 14px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
      </div>
      {parts.map(p=><div key={p.code} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.bg,marginBottom:3}}>
        <span style={{fontSize:12,fontWeight:600,color:C.accent,minWidth:100,flexShrink:0}}>{p.code}</span>
        <span style={{fontSize:12,color:C.text,flex:1}}>{p.desc}{p.colour&&` (${p.colour})`}</span>
        <span style={{fontSize:12,fontWeight:600,color:C.text,flexShrink:0}}>{p.qty}</span>
      </div>)}
    </div>}

function ComenziDan({client,ci,setClients,C,sb,tday,fmtD,field,folder,accept,buttonLabel,onlyImages}){
  const [uploading,setUploading]=React.useState(false);
  const inputRef=React.useRef(null);
  const fisiere=client[field]||[];
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const path=`${folder}/${client.id}/${Date.now()}_${file.name}`;
      const {error}=await sb.storage.from("oferte-clienti").upload(path,file);
      if(error){ alert("Eroare la încărcare: "+error.message); setUploading(false); return; }
      const {data}=sb.storage.from("oferte-clienti").getPublicUrl(path);
      setClients(p=>p.map((c,i)=>i!==ci?c:{...c,[field]:[...(c[field]||[]),{nume:file.name,url:data.publicUrl,path,data:tday()}]}));
    }catch(err){ alert("Eroare: "+err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value="";
  };
  const handleDelete=async(f)=>{
    if(!window.confirm(`Ștergi fișierul "${f.nume}"?`)) return;
    try{ await sb.storage.from("oferte-clienti").remove([f.path]); }catch{}
    setClients(p=>p.map((c,i)=>i!==ci?c:{...c,[field]:(c[field]||[]).filter(x=>x.path!==f.path)}));
  };
  return <div>
    {fisiere.map((f,i)=>{
      const ext=(f.nume.split(".").pop()||"").toLowerCase();
      const isImg=["jpg","jpeg","png","gif","webp","heic"].includes(ext);
      const office=["xlsx","xls","doc","docx","csv"].includes(ext);
      const openUrl=office?`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(f.url)}`:f.url;
      return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:C.bg,marginBottom:4}}>
        {isImg&&<img src={f.url} alt="" style={{width:36,height:36,objectFit:"cover",flexShrink:0}}/>}
        <a href={openUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:C.accent,flex:1,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isImg?"":<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-1px",marginRight:5}}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>}{f.nume}</a>
        <span style={{fontSize:10,color:C.textMuted,flexShrink:0}}>{fmtD(f.data)}</span>
        <button onClick={()=>handleDelete(f)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>;
    })}
    <input ref={inputRef} type="file" accept={accept} style={{display:"none"}} onChange={handleUpload}/>
    <button onClick={()=>inputRef.current?.click()} disabled={uploading} style={{fontSize:12,color:"#2A2118",border:"none",padding:"7px 12px",background:"#5C6B65",cursor:uploading?"default":"pointer",width:"100%"}}>{uploading?"Se încarcă...":buttonLabel}</button>
  </div>;
}

function TabObiective({obiective,setObiective,C,obMonth,setObMonth,addingOb,setAddingOb,newObName,setNewObName,addObiectiv,delObiectiv,toggleZi,setNotaZi}){
  const [expandedOi,setExpandedOi]=React.useState(null);
  const [newItemText,setNewItemText]=React.useState("");
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const todayKey=tday();
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const total=daysInM(obMonth.y,obMonth.m);
  const days=Array.from({length:total},(_,i)=>i+1);

  const dKey=(d)=>keyFor(d.getFullYear(),d.getMonth(),d.getDate());
  const calcStreak=(ob)=>{
    let streak=0;let d=new Date();
    const tk=dKey(d);
    if(!ob.zile[tk]) d.setDate(d.getDate()-1);
    while(true){const k=dKey(d);if(ob.zile[k]){streak++;d.setDate(d.getDate()-1);}else break;}
    return streak;
  };
  const calcPercent=(ob,y,m)=>{
    const today=new Date();
    const lastDay=(y===today.getFullYear()&&m===today.getMonth())?today.getDate():((y>today.getFullYear()||(y===today.getFullYear()&&m>today.getMonth()))?0:daysInM(y,m));
    if(!lastDay) return null;
    let done=0;for(let day=1;day<=lastDay;day++) if(ob.zile[keyFor(y,m,day)]) done++;
    return Math.round(done/lastDay*100);
  };
  const missedTwice=(ob)=>{
    const d1=new Date();d1.setDate(d1.getDate()-1);
    const d2=new Date();d2.setDate(d2.getDate()-2);
    return !ob.zile[dKey(d1)] && !ob.zile[dKey(d2)];
  };
  const addNota=(oi)=>{
    const v=window.prompt("Notiță pentru azi ("+todayKey+"):","");
    if(v&&v.trim()) setNotaZi(oi,todayKey,v.trim());
  };

  const setDescriere=(oi,val)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,descriere:val}));

  const updItem=(oi,itemId,field,val)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,itemi:(o.itemi||[]).map(it=>it.id!==itemId?it:{...it,[field]:val})}));
  const delItem=(oi,itemId)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,itemi:(o.itemi||[]).filter(it=>it.id!==itemId)}));

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12,fontWeight:600}}>Obiective zilnice · imagine de ansamblu</div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:12}}>
      <button onClick={()=>setObMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[obMonth.m]} {obMonth.y}</div>
      <button onClick={()=>setObMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>

    {obiective.length>0?<div style={{overflowX:"auto",marginBottom:14,border:`1px solid ${C.border}`}}>
      <table style={{borderCollapse:"collapse",width:"100%"}}>
        <thead>
          <tr>
            <th style={{position:"sticky",left:0,background:C.surface,padding:"6px 10px",fontSize:10,color:C.textMuted,textAlign:"left",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",zIndex:1}}>Obiectiv</th>
            {days.map(day=>{
              const isToday=keyFor(obMonth.y,obMonth.m,day)===todayKey;
              const dow=new Date(obMonth.y,obMonth.m,day).getDay();
              const isWeekend=dow===0||dow===6;
              return <th key={day} style={{fontSize:10,color:isToday?C.text:isWeekend?"#A89E8C":C.textMuted,fontWeight:isToday?700:400,padding:"6px 2px",borderBottom:`1px solid ${C.border}`,minWidth:24,background:isWeekend?"#EFE9DC":"transparent"}}>{day}</th>;
            })}
            <th style={{fontSize:10,color:C.textMuted,padding:"6px 8px",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>Streak</th>
            <th style={{fontSize:10,color:C.textMuted,padding:"6px 8px",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>%</th>
            <th style={{borderBottom:`1px solid ${C.border}`}}></th>
          </tr>
        </thead>
        <tbody>
          {obiective.map((o,oi)=>{
            const streak=calcStreak(o);
            const pct=calcPercent(o,obMonth.y,obMonth.m);
            return <tr key={o.id}>
              <td onClick={()=>setExpandedOi(expandedOi===oi?null:oi)} style={{position:"sticky",left:0,background:C.surface,padding:"6px 10px",fontSize:12,fontWeight:500,color:C.text,whiteSpace:"nowrap",cursor:"pointer"}}>
                {o.name} <span style={{fontSize:9,color:C.textMuted}}>{expandedOi===oi?"▾":"▸"}</span>
              </td>
              {days.map(day=>{
                const key=keyFor(obMonth.y,obMonth.m,day);
                const done=!!o.zile[key];
                const isFuture=key>todayKey;
                const nota=o.note&&o.note[key];
                const dow=new Date(obMonth.y,obMonth.m,day).getDay();
                const isWeekend=dow===0||dow===6;
                const bg=done?C.accent:isWeekend?"#DDD6C8":C.bg;
                return <td key={day} style={{padding:2,textAlign:"center"}}>
                  <div onClick={()=>!isFuture&&toggleZi(oi,key)} title={nota||""} style={{width:20,height:20,margin:"0 auto",cursor:isFuture?"default":"pointer",background:bg,border:`1px solid ${C.border}`,opacity:isFuture?0.35:1}}/>
                </td>;
              })}
              <td style={{textAlign:"center",fontSize:12,fontWeight:600,color:C.accent}}>{streak}</td>
              <td style={{textAlign:"center",fontSize:11,color:C.textMuted}}>{pct!==null?pct+"%":"—"}</td>
              <td style={{textAlign:"center",whiteSpace:"nowrap"}}>
                <button onClick={()=>addNota(oi)} title="Adaugă notiță pentru azi" style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,marginRight:4}}>✎</button>
                <button onClick={()=>delObiectiv(oi)} title="Șterge obiectiv" style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14}}>×</button>
              </td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>:<div style={{fontSize:13,color:C.textMuted,padding:"16px 0"}}>Niciun obiectiv încă. Adaugă unul mai jos (ex: Sport, Organizare) — apare ca rând nou, cu bifă pentru fiecare zi din lună.</div>}

    {expandedOi!==null&&obiective[expandedOi]&&(()=>{
      const o=obiective[expandedOi];
      return <div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
          <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{o.name} · jurnal</div>
          <button onClick={()=>setExpandedOi(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.textSub,fontSize:15}}>×</button>
        </div>
        <div style={{padding:"14px 16px"}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:6}}>Ce vreau de la {o.name.toLowerCase()}</div>
          <textarea value={o.descriere||""} onChange={e=>setDescriere(expandedOi,e.target.value)} placeholder="Ex: 20 pagini pe zi, un subiect nou pe lună..." rows={3} style={{width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.bg,outline:"none",boxSizing:"border-box",resize:"vertical",marginBottom:16,fontFamily:"inherit"}}/>

          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Listă (cărți, subiecte, orice de urmărit)</div>
          {(o.itemi||[]).map(it=><div key={it.id} style={{background:C.bg,padding:"10px 12px",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <input type="checkbox" checked={it.bifat} onChange={e=>updItem(expandedOi,it.id,"bifat",e.target.checked)} style={{cursor:"pointer",width:14,height:14,flexShrink:0}}/>
              <input value={it.text} onChange={e=>updItem(expandedOi,it.id,"text",e.target.value)} placeholder="Titlu / subiect" style={{flex:1,fontSize:13,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",textDecoration:it.bifat?"line-through":"none",color:it.bifat?C.textMuted:C.text}}/>
              <button onClick={()=>delItem(expandedOi,it.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,flexShrink:0}}>×</button>
            </div>
            <input value={it.link||""} onChange={e=>updItem(expandedOi,it.id,"link",e.target.value)} placeholder="Link (unde l-ai găsit / de unde îl cumperi)" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",marginBottom:6,boxSizing:"border-box"}}/>
            {it.link&&<a href={it.link.startsWith("http")?it.link:`https://${it.link}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:C.accent,display:"inline-block",marginBottom:6}}>Deschide link →</a>}
            <input value={it.nota||""} onChange={e=>updItem(expandedOi,it.id,"nota",e.target.value)} placeholder="Ce mi-a plăcut / observații" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",boxSizing:"border-box"}}/>
          </div>)}
          <div style={{display:"flex",gap:8}}>
            <input value={newItemText} onChange={e=>setNewItemText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addItem(expandedOi);}} placeholder="Titlu nou (ex: numele cărții)..." style={{flex:1,fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.surface,outline:"none"}}/>
            <button onClick={()=>addItem(expandedOi)} style={{fontSize:12,color:"#2A2118",background:"#5C6B65",border:"none",padding:"0 16px",cursor:"pointer"}}>+ adaugă</button>
          </div>
        </div>
      </div>;
    })()}

    <div>
      {addingOb?<div style={{display:"flex",alignItems:"center",gap:10}}>
        <input autoFocus value={newObName} onChange={e=>setNewObName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addObiectiv();if(e.key==="Escape")setAddingOb(false);}} placeholder="Obiectiv nou (ex: Sport, Organizare)..." style={{padding:"9px 14px",border:`1px solid ${C.border}`,fontSize:13,flex:1,background:C.surface,color:C.text,outline:"none"}}/>
        <button onClick={addObiectiv} style={{padding:"8px 20px",border:"none",background:C.accent,color:"#FAF8F4",cursor:"pointer",fontSize:12,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase"}}>Adaugă</button>
        <button onClick={()=>setAddingOb(false)} style={{padding:"8px 16px",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C.textSub}}>✕</button>
      </div>:<button onClick={()=>setAddingOb(true)} style={{width:"100%",padding:"12px",fontSize:13,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer"}}>+ obiectiv nou</button>}
    </div>
  </div>;
}

function TabMotionBlinds({motoare,clients,iesiri,intrari,openModel,setOpenModel,stocRamas,soldInitial,totalIntrat,updStoc,delMotorModel,addMotorModel,newMotorModel,setNewMotorModel,adaugaFactura,updPozitie,stergeFactura,stergePozitie,card,C,fmtD,inp,btnP}){
  return <div>
            <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:16}}>Fișe Magazie · Motoare MotionBlinds / Coulisse</div>

      {/* Listă achiziții necesare */}
      {(()=>{
        const lipsa=motoare.filter(m=>stocRamas(m.model)<0);
        if(lipsa.length===0) return null;
        const totalBuc=lipsa.reduce((s,m)=>s+Math.abs(stocRamas(m.model)),0);
        return <div style={{...card,marginBottom:16,padding:"16px 20px"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.text,textTransform:"uppercase",letterSpacing:"0.08em"}}>Listă achiziții necesare</div>
            <div style={{fontSize:11,color:C.textMuted}}>{lipsa.length} poziții · {totalBuc} buc.</div>
          </div>
          {lipsa.map(m=><div key={m.model} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:13,fontWeight:500,color:C.text,minWidth:70}}>{m.model}</span>
            <span style={{fontSize:12,color:C.textMuted,flex:1}}>de comandat</span>
            <span style={{fontSize:14,fontWeight:700,color:C.text}}>{Math.abs(stocRamas(m.model))} buc.</span>
          </div>)}
        </div>;
      })()}

      {/* Formular intrare centralizată */}
      <AddFacturaForm motoare={motoare} onAdd={adaugaFactura}/>

      {/* Lista facturi intrare */}
      {intrari.length>0&&<div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:10}}>Facturi intrare ({intrari.length})</div>
        {intrari.map(f=>{
          const isOpenF=openModel[`f_${f.id}`]===true;
          return <div key={f.id} style={{background:C.surface,border:"1px solid #C8DCC8",marginBottom:6,overflow:"hidden"}}>
            <div onClick={()=>setOpenModel(p=>({...p,[`f_${f.id}`]:!isOpenF}))} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:"#F2F8F2",cursor:"pointer",userSelect:"none"}}>
              <div style={{flex:1}}>
                <span style={{fontSize:13,fontWeight:500,color:"#2A4A2A"}}>{f.furnizor}</span>
                {f.factura&&<span style={{fontSize:12,color:"#5A8A5A",marginLeft:8}}>· {f.factura}</span>}
                <span style={{fontSize:11,color:"#5A8A5A",marginLeft:8}}>· {fmtD(f.data)}</span>
                <span style={{fontSize:11,color:"#5A8A5A",marginLeft:8}}>· {f.pozitii.reduce((s,p)=>s+p.qty,0)} buc.</span>
              </div>
              <button onClick={e=>{e.stopPropagation();stergeFactura(f.id);}} style={{fontSize:11,color:C.danger,border:`1px solid #C9BCA6`,padding:"2px 8px",background:"transparent",cursor:"pointer"}}>× șterge</button>
              <span style={{fontSize:11,color:"#5A8A5A"}}>{isOpenF?"▾":"▸"}</span>
            </div>
            {isOpenF&&<div style={{padding:"8px 14px 12px"}}>
              {f.pozitii.map(pz=><div key={pz.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${C.bg}`}}>
                <select value={pz.model} onChange={e=>updPozitie(f.id,pz.id,"model",e.target.value)} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",background:C.surface,outline:"none",color:C.accent,fontWeight:500}}>
                  {motoare.map(m=><option key={m.model} value={m.model}>{m.model}</option>)}
                </select>
                <input type="number" min="1" value={pz.qty} onChange={e=>updPozitie(f.id,pz.id,"qty",e.target.value)} style={{width:60,fontSize:13,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",textAlign:"center"}}/>
                <span style={{fontSize:12,color:C.textMuted}}>buc.</span>
                <button onClick={()=>stergePozitie(f.id,pz.id)} style={{marginLeft:"auto",fontSize:11,color:C.danger,border:`1px solid #C9BCA6`,padding:"2px 8px",background:"transparent",cursor:"pointer"}}>× șterge</button>
              </div>)}
            </div>}
          </div>;
        })}
      </div>}

      {/* Fișe per model */}
      <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:12}}>Situație stoc per model</div>
      {motoare.map(m=>{
        const isOpen=openModel[m.model]===true;
        const si=soldInitial(m.model);
        const ti=totalIntrat(m.model);
        const alocat=clients.reduce((s,c)=>{const x=(c.motoare||[]).find(x=>x.model===m.model);return s+(x?x.qty:0);},0);
        const livrate=iesiri.filter(e=>e.model===m.model).reduce((s,e)=>s+e.qty,0);
        const sf=stocRamas(m.model);
        const st=sf<0?"lipsa":sf===0&&(alocat+livrate)>0?"exact":"ok";
        const iesiriFisa=iesiri.filter(e=>e.model===m.model).map(e=>({...e,tip:"iesire",sursa:e.client}));
        const intrarifisa=intrari.flatMap(f=>f.pozitii.filter(p=>p.model===m.model).map(p=>({id:f.id+p.id,data:f.data,tip:"intrare",sursa:f.furnizor,factura:f.factura,qty:p.qty})));
        const miscariFisa=[...iesiriFisa,...intrarifisa].sort((a,b)=>a.data>b.data?1:-1);

        return <div key={m.model} style={{background:C.surface,border:`1px solid ${C.border}`,marginBottom:10,overflow:"hidden"}}>
          <div onClick={()=>setOpenModel(p=>({...p,[m.model]:!isOpen}))} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 18px",cursor:"pointer",userSelect:"none",background:CC[1]}}>
            <div style={{fontSize:14,fontWeight:500,color:C.text,minWidth:70,letterSpacing:"0.03em"}}>{m.model}</div>
            <div style={{display:"flex",gap:16,flex:1}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>Sold inițial</div><div style={{fontSize:13,fontWeight:500,color:C.textSub}}>{si}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>+ Intrări</div><div style={{fontSize:13,fontWeight:600,color:"#3A6A3A"}}>{ti}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>− Ieșiri</div><div style={{fontSize:13,fontWeight:600,color:C.danger}}>{alocat+livrate}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>Sold final</div><div style={{fontSize:15,fontWeight:700,color:st==="lipsa"?C.danger:C.accent}}>{sf}</div></div>
            </div>
            <span style={{fontSize:11,padding:"3px 10px",fontWeight:500,background:st==="lipsa"?C.dangerLight:st==="exact"?"#F0EFED":C.accentLight,color:st==="lipsa"?C.danger:st==="exact"?C.textSub:C.accent}}>{st==="lipsa"?`Lipsă ${Math.abs(sf)}`:st==="exact"?"Exact":"OK"}</span>
            <span style={{fontSize:11,color:C.textMuted}}>{isOpen?"▾":"▸"}</span>
          </div>
          {isOpen&&<div style={{padding:"14px 18px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:12,color:C.textMuted,minWidth:100}}>Sold inițial:</span>
              <input type="number" min="0" value={m.stoc} onChange={e=>updStoc(m.model,e.target.value)} style={{width:70,fontSize:13,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",textAlign:"center"}}/>
              <span style={{fontSize:12,color:C.textMuted}}>buc.</span>
            </div>
            {miscariFisa.length>0&&<div>
              <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Fișă mișcări</div>
              <div style={{border:`1px solid ${C.border}`,overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"90px 80px 1fr 70px 90px",padding:"7px 12px",background:C.bg,borderBottom:`1px solid ${C.border}`}}>
                  {["DATA","TIP","SURSĂ","BUC.","FACTURĂ"].map(h=><div key={h} style={{fontSize:9,fontWeight:600,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{h}</div>)}
                </div>
                {miscariFisa.map(e=><div key={e.id} style={{display:"grid",gridTemplateColumns:"90px 80px 1fr 70px 90px",padding:"8px 12px",borderBottom:`1px solid ${C.bg}`,alignItems:"center"}}>
                  <div style={{fontSize:11,color:C.textSub}}>{fmtD(e.data)}</div>
                  <div><span style={{padding:"2px 7px",fontSize:10,fontWeight:600,background:e.tip==="intrare"?"#EAF2EA":"#F5EEEE",color:e.tip==="intrare"?"#3A6A3A":C.danger}}>{e.tip==="intrare"?"↓ IN":"↑ OUT"}</span></div>
                  <div style={{fontSize:12,color:C.text,fontWeight:500}}>{e.sursa||"—"}</div>
                  <div style={{fontSize:13,fontWeight:600,color:e.tip==="intrare"?"#3A6A3A":C.danger}}>{e.tip==="intrare"?"+":"-"}{e.qty}</div>
                  <div style={{fontSize:11,color:C.textMuted}}>{e.factura||"—"}</div>
                </div>)}
              </div>
            </div>}
            {alocat>0&&<div style={{marginTop:12,padding:"10px 14px",background:C.accentLight}}>
              <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Alocat clienți activi</div>
              {clients.filter(c=>(c.motoare||[]).find(x=>x.model===m.model)).map(c=>{const mx=c.motoare.find(x=>x.model===m.model);return <div key={c.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}><span style={{flex:1,fontSize:12,color:C.text}}>{c.name}</span><span style={{fontSize:12,fontWeight:600,color:C.accent}}>{mx.qty} buc.</span></div>;})}
            </div>}
            <button onClick={()=>delMotorModel(m.model)} style={{marginTop:12,fontSize:11,color:C.textMuted,border:"none",background:"transparent",cursor:"pointer"}}>× șterge model</button>
          </div>}
        </div>;
      })}

      <div style={{marginTop:8}}>
        <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:8}}>Adaugă model nou</div>
        <div style={{display:"flex",gap:8}}>
          <input value={newMotorModel} onChange={e=>setNewMotorModel(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&addMotorModel()} placeholder="Ex: CM-60" style={{...inp,flex:1}}/>
          <button style={btnP()} onClick={addMotorModel}>+ Adaugă</button>
        </div>
      </div>
  </div>;
}

function LogDiscutii({id,log,setLog,C,inp,btnP,gid,tday,fmtD}){
  const [open,setOpen]=React.useState(false);
  const [text,setText]=React.useState("");
  const entries=(log[id]||[]).slice().reverse();
  const addEntry=()=>{
    if(!text.trim()) return;
    const now=new Date();
    const ora=now.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
    setLog(p=>({...p,[id]:[...(p[id]||[]),{id:Date.now().toString(),text:text.trim(),data:tday(),ora}]}));
    setText("");
  };
  const delEntry=(eid)=>setLog(p=>({...p,[id]:(p[id]||[]).filter(e=>e.id!==eid)}));
  return <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:open?10:0}}>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,cursor:"pointer"}} onClick={()=>setOpen(!open)}>
        Discuții {entries.length>0&&<span style={{background:C.accentLight,color:C.accent,padding:"1px 6px",fontSize:10,marginLeft:4}}>{entries.length}</span>}
        <span style={{marginLeft:6,fontSize:10}}>{open?"▾":"▸"}</span>
      </div>
      {!open&&entries.length>0&&<span style={{fontSize:11,color:C.textMuted}}>{fmtD(entries[0].data)} — {entries[0].text.slice(0,40)}{entries[0].text.length>40?"...":""}</span>}
    </div>
    {open&&<div>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEntry()} placeholder="Notează ce s-a discutat..." style={{...inp,flex:1,padding:"6px 10px",fontSize:12}}/>
        <button onClick={addEntry} style={{...btnP(),fontSize:11,padding:"6px 14px"}}>+ Adaugă</button>
      </div>
      {entries.length===0&&<div style={{fontSize:12,color:C.textMuted,textAlign:"center",padding:"0.5rem"}}>Nicio discuție notată.</div>}
      {entries.map(e=><div key={e.id} style={{display:"flex",gap:8,padding:"8px 10px",background:C.bg,marginBottom:4,alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:12,color:C.text}}>{e.text}</div>
          <div style={{fontSize:10,color:C.textMuted,marginTop:2}}>{fmtD(e.data)} · {e.ora}</div>
        </div>
        <button onClick={()=>delEntry(e.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>)}
    </div>}
  </div>;
}

      <div style={{flex:2,minWidth:140}}>

          <input autoFocus value={furnizorNou} onChange={e=>setFurnizorNou(e.target.value)} onKeyDown={e=>e.key==="Enter"&&confirmFurnizorNou()} placeholder="Nume furnizor nou" style={{flex:1,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/>

        <input type="number" value={valoare} onChange={e=>setValoare(e.target.value)} placeholder="0" style={{width:110,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/></div>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Scadență</div>
