            <span style={{fontSize:12,color:C.textMuted,minWidth:100}}>Adresă:</span>
            {client.adresa?<a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(client.adresa)}`} target="_blank" rel="noopener noreferrer" style={{fontSize:13,color:C.accent,fontWeight:500,textDecoration:"none"}}>{client.adresa} 📍</a>:<span style={{fontSize:13,color:C.textMuted}}>— nesetată —</span>}
          </div>
        </div>}
        {(clientDetailTab[client.id]||"contact")==="contract"&&<div style={{marginBottom:16,padding:"14px",background:C.bg}}>
          <ContractClientSection client={client} ci={ci} setClients={setClients} C={C} contractCounter={contractCounter} setContractCounter={setContractCounter}/>
        </div>}
        {(clientDetailTab[client.id]||"contact")==="pv"&&<div style={{marginBottom:16,padding:"14px",background:C.bg}}>
          <ProcesVerbalClientSection client={client} ci={ci} setClients={setClients} C={C} pvCounter={pvCounter} setPvCounter={setPvCounter}/>
        </div>}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Poze și măsurători</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danPoze" folder="dan-poze" accept="image/*,.pdf" buttonLabel="+ fă poză / adaugă măsurătoare"/>
        </div>
        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Comenzi șină / sisteme de produs</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danComenzi" folder="dan-comenzi" accept=".pdf,.doc,.docx,.xlsx,.xls,.csv,image/*" buttonLabel="+ adaugă comandă"/>
        </div>
        {((client.configuratiiSina||[]).length+(client.configuratiiRoman||[]).length+(client.configuratiiRulou||[]).length+(client.configuratiiPanou||[]).length)>0&&<div style={{marginTop:16}}>
          <button onClick={()=>exportClientPartsXLSX(client)} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>📊 Consum centralizat componente (Excel, pentru contabilitate)</button>
        </div>}
        {(client.configuratiiSina||[]).length>0&&<div style={{marginTop:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Configurații șină ({(client.configuratiiSina||[]).length})</div>
          {(client.configuratiiSina||[]).map(cfg=>
            <ConfigSalvataRow key={cfg.id} cfg={cfg} clientId={client.id} setClients={setClients} C={C} onPrint={()=>{
              const rows=cfg.parts.map((p,i)=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${i+1}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.code}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}${p.colour?" ("+p.colour+")":""}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
              const html=`<html><head><title>Comandă Coulisse ${cfg.result.articleCode}</title></head><body style="font-family:sans-serif;padding:20px;"><h2>Configurator Coulisse SmartCurtain</h2><p><b>Client:</b> ${client.name}</p><p><b>Destinație (cameră):</b> ${cfg.camera||"—"}</p>${cfg.observatii?`<p style="background:#5C6B65;color:#fff;padding:10px 14px;"><b>Observație:</b> ${cfg.observatii}</p>`:""}<p><b>Cod articol:</b> ${cfg.result.articleCode}</p><p>Lățime: ${cfg.input.width}mm · Înălțime: ${cfg.input.height}mm · Motor: ${cfg.input.motorKey} · Glisor: ${cfg.input.gliderKey} · Împachetare: ${cfg.input.packKey} · Culoare: ${cfg.input.colourKey} · Cantitate: ${cfg.input.quantity}</p><p>Șină: ${cfg.result.rail}mm · Curea: ${cfg.result.belt}mm · Glisoare/buc: ${cfg.result.gliders} · Cârlige/buc: ${cfg.result.hooks} · Console/buc: ${cfg.result.brackets}</p><table style="border-collapse:collapse;width:100%;margin-top:14px;"><tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">#</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>${rows}</table></body></html>`;
              printHtmlDoc(html);
            }}/>
          )}
        </div>}
        {(client.configuratiiRoman||[]).length>0&&<div style={{marginTop:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Storuri romane ({(client.configuratiiRoman||[]).length})</div>
          {(client.configuratiiRoman||[]).map(cfg=>
            <ConfigRomanSalvataRow key={cfg.id} cfg={cfg} clientId={client.id} setClients={setClients} C={C} onPrint={()=>{
              printHtmlDoc(buildRomanPrintHtml({...cfg,clientName:client.name}));
            }}/>
          )}
        </div>}
        {(client.configuratiiRulou||[]).length>0&&<div style={{marginTop:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Rulouri ({(client.configuratiiRulou||[]).length})</div>
          {(client.configuratiiRulou||[]).map(cfg=>
            <ConfigRulouSalvataRow key={cfg.id} cfg={cfg} clientId={client.id} setClients={setClients} C={C} onPrint={()=>{
              printHtmlDoc(buildRulouPrintHtml({...cfg,clientName:client.name}));
            }}/>
          )}
        </div>}
        {(client.configuratiiPanou||[]).length>0&&<div style={{marginTop:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Panouri ({(client.configuratiiPanou||[]).length})</div>
          {(client.configuratiiPanou||[]).map(cfg=>
            <ConfigPanouSalvataRow key={cfg.id} cfg={cfg} clientId={client.id} setClients={setClients} C={C} onPrint={()=>{
              printHtmlDoc(buildPanouPrintHtml({...cfg,clientName:client.name}));
            }}/>
          )}
        </div>}
      </div>
    </div>}
  </div>;
}

function TabObiective({obiective,setObiective,C,obMonth,setObMonth,addingOb,setAddingOb,newObName,setNewObName,addObiectiv,delObiectiv,toggleZi,setNotaZi}){
  const [expandedOi,setExpandedOi]=React.useState(null);
  const [newItemText,setNewItemText]=React.useState("");
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const todayKey=tday();
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const total=daysInM(obMonth.y,obMonth.m);
  const days=Array.from({length:total},(_,i)=>i+1);

  const dKey=(d)=>keyFor(d.getFullYear(),d.getMonth(),d.getDate());
  const calcStreak=(ob)=>{
    let streak=0;let d=new Date();
    const tk=dKey(d);
    if(!ob.zile[tk]) d.setDate(d.getDate()-1);
    while(true){const k=dKey(d);if(ob.zile[k]){streak++;d.setDate(d.getDate()-1);}else break;}
    return streak;
  };
  const calcPercent=(ob,y,m)=>{
    const today=new Date();
    const lastDay=(y===today.getFullYear()&&m===today.getMonth())?today.getDate():((y>today.getFullYear()||(y===today.getFullYear()&&m>today.getMonth()))?0:daysInM(y,m));
    if(!lastDay) return null;
    let done=0;for(let day=1;day<=lastDay;day++) if(ob.zile[keyFor(y,m,day)]) done++;
    return Math.round(done/lastDay*100);
  };
  const missedTwice=(ob)=>{
    const d1=new Date();d1.setDate(d1.getDate()-1);
    const d2=new Date();d2.setDate(d2.getDate()-2);
    return !ob.zile[dKey(d1)] && !ob.zile[dKey(d2)];
  };
  const addNota=(oi)=>{
    const v=window.prompt("Notiță pentru azi ("+todayKey+"):","");
    if(v&&v.trim()) setNotaZi(oi,todayKey,v.trim());
  };

  const setDescriere=(oi,val)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,descriere:val}));
  const addItem=(oi)=>{const t=(newItemText||"").trim();if(!t) return;setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,itemi:[...(o.itemi||[]),{id:gid(),text:t,link:"",nota:"",bifat:false}]}));setNewItemText("");};
  const updItem=(oi,itemId,field,val)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,itemi:(o.itemi||[]).map(it=>it.id!==itemId?it:{...it,[field]:val})}));
  const delItem=(oi,itemId)=>setObiective(p=>p.map((o,i)=>i!==oi?o:{...o,itemi:(o.itemi||[]).filter(it=>it.id!==itemId)}));

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12,fontWeight:600}}>Obiective zilnice · imagine de ansamblu</div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:12}}>
      <button onClick={()=>setObMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[obMonth.m]} {obMonth.y}</div>
      <button onClick={()=>setObMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>

    {obiective.length>0?<div style={{overflowX:"auto",marginBottom:14,border:`1px solid ${C.border}`}}>
      <table style={{borderCollapse:"collapse",width:"100%"}}>
        <thead>
          <tr>
            <th style={{position:"sticky",left:0,background:C.surface,padding:"6px 10px",fontSize:10,color:C.textMuted,textAlign:"left",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",zIndex:1}}>Obiectiv</th>
            {days.map(day=>{
              const isToday=keyFor(obMonth.y,obMonth.m,day)===todayKey;
              const dow=new Date(obMonth.y,obMonth.m,day).getDay();
              const isWeekend=dow===0||dow===6;
              return <th key={day} style={{fontSize:10,color:isToday?C.text:isWeekend?"#A89E8C":C.textMuted,fontWeight:isToday?700:400,padding:"6px 2px",borderBottom:`1px solid ${C.border}`,minWidth:24,background:isWeekend?"#EFE9DC":"transparent"}}>{day}</th>;
            })}
            <th style={{fontSize:10,color:C.textMuted,padding:"6px 8px",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>Streak</th>
            <th style={{fontSize:10,color:C.textMuted,padding:"6px 8px",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>%</th>
            <th style={{borderBottom:`1px solid ${C.border}`}}></th>
          </tr>
        </thead>
        <tbody>
          {obiective.map((o,oi)=>{
            const streak=calcStreak(o);
            const pct=calcPercent(o,obMonth.y,obMonth.m);
            return <tr key={o.id}>
              <td onClick={()=>setExpandedOi(expandedOi===oi?null:oi)} style={{position:"sticky",left:0,background:C.surface,padding:"6px 10px",fontSize:12,fontWeight:500,color:C.text,whiteSpace:"nowrap",cursor:"pointer"}}>
                {o.name} <span style={{fontSize:9,color:C.textMuted}}>{expandedOi===oi?"▾":"▸"}</span>
              </td>
              {days.map(day=>{
                const key=keyFor(obMonth.y,obMonth.m,day);
                const done=!!o.zile[key];
                const isFuture=key>todayKey;
                const nota=o.note&&o.note[key];
                const dow=new Date(obMonth.y,obMonth.m,day).getDay();
                const isWeekend=dow===0||dow===6;
                const bg=done?C.accent:isWeekend?"#DDD6C8":C.bg;
                return <td key={day} style={{padding:2,textAlign:"center"}}>
                  <div onClick={()=>!isFuture&&toggleZi(oi,key)} title={nota||""} style={{width:20,height:20,margin:"0 auto",cursor:isFuture?"default":"pointer",background:bg,border:`1px solid ${C.border}`,opacity:isFuture?0.35:1}}/>
                </td>;
              })}
              <td style={{textAlign:"center",fontSize:12,fontWeight:600,color:C.accent}}>{streak}</td>
              <td style={{textAlign:"center",fontSize:11,color:C.textMuted}}>{pct!==null?pct+"%":"—"}</td>
              <td style={{textAlign:"center",whiteSpace:"nowrap"}}>
                <button onClick={()=>addNota(oi)} title="Adaugă notiță pentru azi" style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,marginRight:4}}>✎</button>
                <button onClick={()=>delObiectiv(oi)} title="Șterge obiectiv" style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14}}>×</button>
              </td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>:<div style={{fontSize:13,color:C.textMuted,padding:"16px 0"}}>Niciun obiectiv încă. Adaugă unul mai jos (ex: Sport, Organizare) — apare ca rând nou, cu bifă pentru fiecare zi din lună.</div>}

    {expandedOi!==null&&obiective[expandedOi]&&(()=>{
      const o=obiective[expandedOi];
      return <div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
          <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{o.name} · jurnal</div>
          <button onClick={()=>setExpandedOi(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.textSub,fontSize:15}}>×</button>
        </div>
        <div style={{padding:"14px 16px"}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:6}}>Ce vreau de la {o.name.toLowerCase()}</div>
          <textarea value={o.descriere||""} onChange={e=>setDescriere(expandedOi,e.target.value)} placeholder="Ex: 20 pagini pe zi, un subiect nou pe lună..." rows={3} style={{width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.bg,outline:"none",boxSizing:"border-box",resize:"vertical",marginBottom:16,fontFamily:"inherit"}}/>

          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Listă (cărți, subiecte, orice de urmărit)</div>
          {(o.itemi||[]).map(it=><div key={it.id} style={{background:C.bg,padding:"10px 12px",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <input type="checkbox" checked={it.bifat} onChange={e=>updItem(expandedOi,it.id,"bifat",e.target.checked)} style={{cursor:"pointer",width:14,height:14,flexShrink:0}}/>
              <input value={it.text} onChange={e=>updItem(expandedOi,it.id,"text",e.target.value)} placeholder="Titlu / subiect" style={{flex:1,fontSize:13,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",textDecoration:it.bifat?"line-through":"none",color:it.bifat?C.textMuted:C.text}}/>
              <button onClick={()=>delItem(expandedOi,it.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,flexShrink:0}}>×</button>
            </div>
            <input value={it.link||""} onChange={e=>updItem(expandedOi,it.id,"link",e.target.value)} placeholder="Link (unde l-ai găsit / de unde îl cumperi)" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",marginBottom:6,boxSizing:"border-box"}}/>
            {it.link&&<a href={it.link.startsWith("http")?it.link:`https://${it.link}`} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:C.accent,display:"inline-block",marginBottom:6}}>Deschide link →</a>}
            <input value={it.nota||""} onChange={e=>updItem(expandedOi,it.id,"nota",e.target.value)} placeholder="Ce mi-a plăcut / observații" style={{width:"100%",fontSize:12,border:`1px solid ${C.border}`,padding:"5px 8px",background:C.surface,outline:"none",boxSizing:"border-box"}}/>
          </div>)}
          <div style={{display:"flex",gap:8}}>
            <input value={newItemText} onChange={e=>setNewItemText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addItem(expandedOi);}} placeholder="Titlu nou (ex: numele cărții)..." style={{flex:1,fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.surface,outline:"none"}}/>
            <button onClick={()=>addItem(expandedOi)} style={{fontSize:12,color:"#2A2118",background:"#5C6B65",border:"none",padding:"0 16px",cursor:"pointer"}}>+ adaugă</button>
          </div>
        </div>
      </div>;
    })()}

    <div>
      {addingOb?<div style={{display:"flex",alignItems:"center",gap:10}}>
        <input autoFocus value={newObName} onChange={e=>setNewObName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addObiectiv();if(e.key==="Escape")setAddingOb(false);}} placeholder="Obiectiv nou (ex: Sport, Organizare)..." style={{padding:"9px 14px",border:`1px solid ${C.border}`,fontSize:13,flex:1,background:C.surface,color:C.text,outline:"none"}}/>
        <button onClick={addObiectiv} style={{padding:"8px 20px",border:"none",background:C.accent,color:"#FAF8F4",cursor:"pointer",fontSize:12,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase"}}>Adaugă</button>
        <button onClick={()=>setAddingOb(false)} style={{padding:"8px 16px",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C.textSub}}>✕</button>
      </div>:<button onClick={()=>setAddingOb(true)} style={{width:"100%",padding:"12px",fontSize:13,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer"}}>+ obiectiv nou</button>}
    </div>
  </div>;
}

function TabMotionBlinds({motoare,clients,iesiri,intrari,openModel,setOpenModel,stocRamas,soldInitial,totalIntrat,updStoc,delMotorModel,addMotorModel,newMotorModel,setNewMotorModel,adaugaFactura,updPozitie,stergeFactura,stergePozitie,card,C,fmtD,inp,btnP}){
  return <div>
            <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:16}}>Fișe Magazie · Motoare MotionBlinds / Coulisse</div>

      {/* Listă achiziții necesare */}
      {(()=>{
        const lipsa=motoare.filter(m=>stocRamas(m.model)<0);
        if(lipsa.length===0) return null;
        const totalBuc=lipsa.reduce((s,m)=>s+Math.abs(stocRamas(m.model)),0);
        return <div style={{...card,marginBottom:16,padding:"16px 20px"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.text,textTransform:"uppercase",letterSpacing:"0.08em"}}>Listă achiziții necesare</div>
            <div style={{fontSize:11,color:C.textMuted}}>{lipsa.length} poziții · {totalBuc} buc.</div>
          </div>
          {lipsa.map(m=><div key={m.model} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:13,fontWeight:500,color:C.text,minWidth:70}}>{m.model}</span>
            <span style={{fontSize:12,color:C.textMuted,flex:1}}>de comandat</span>
            <span style={{fontSize:14,fontWeight:700,color:C.text}}>{Math.abs(stocRamas(m.model))} buc.</span>
          </div>)}
        </div>;
      })()}

      {/* Formular intrare centralizată */}
      <AddFacturaForm motoare={motoare} onAdd={adaugaFactura}/>

      {/* Lista facturi intrare */}
      {intrari.length>0&&<div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:10}}>Facturi intrare ({intrari.length})</div>
        {intrari.map(f=>{
          const isOpenF=openModel[`f_${f.id}`]===true;
          return <div key={f.id} style={{background:C.surface,border:"1px solid #C8DCC8",marginBottom:6,overflow:"hidden"}}>
            <div onClick={()=>setOpenModel(p=>({...p,[`f_${f.id}`]:!isOpenF}))} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:"#F2F8F2",cursor:"pointer",userSelect:"none"}}>
              <div style={{flex:1}}>
                <span style={{fontSize:13,fontWeight:500,color:"#2A4A2A"}}>{f.furnizor}</span>
                {f.factura&&<span style={{fontSize:12,color:"#5A8A5A",marginLeft:8}}>· {f.factura}</span>}
                <span style={{fontSize:11,color:"#5A8A5A",marginLeft:8}}>· {fmtD(f.data)}</span>
                <span style={{fontSize:11,color:"#5A8A5A",marginLeft:8}}>· {f.pozitii.reduce((s,p)=>s+p.qty,0)} buc.</span>
              </div>
              <button onClick={e=>{e.stopPropagation();stergeFactura(f.id);}} style={{fontSize:11,color:C.danger,border:`1px solid #C9BCA6`,padding:"2px 8px",background:"transparent",cursor:"pointer"}}>× șterge</button>
              <span style={{fontSize:11,color:"#5A8A5A"}}>{isOpenF?"▾":"▸"}</span>
            </div>
            {isOpenF&&<div style={{padding:"8px 14px 12px"}}>
              {f.pozitii.map(pz=><div key={pz.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${C.bg}`}}>
                <select value={pz.model} onChange={e=>updPozitie(f.id,pz.id,"model",e.target.value)} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",background:C.surface,outline:"none",color:C.accent,fontWeight:500}}>
                  {motoare.map(m=><option key={m.model} value={m.model}>{m.model}</option>)}
                </select>
                <input type="number" min="1" value={pz.qty} onChange={e=>updPozitie(f.id,pz.id,"qty",e.target.value)} style={{width:60,fontSize:13,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",textAlign:"center"}}/>
                <span style={{fontSize:12,color:C.textMuted}}>buc.</span>
                <button onClick={()=>stergePozitie(f.id,pz.id)} style={{marginLeft:"auto",fontSize:11,color:C.danger,border:`1px solid #C9BCA6`,padding:"2px 8px",background:"transparent",cursor:"pointer"}}>× șterge</button>
              </div>)}
            </div>}
          </div>;
        })}
      </div>}

      {/* Fișe per model */}
      <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:12}}>Situație stoc per model</div>
      {motoare.map(m=>{
        const isOpen=openModel[m.model]===true;
        const si=soldInitial(m.model);
        const ti=totalIntrat(m.model);
        const alocat=clients.reduce((s,c)=>{const x=(c.motoare||[]).find(x=>x.model===m.model);return s+(x?x.qty:0);},0);
        const livrate=iesiri.filter(e=>e.model===m.model).reduce((s,e)=>s+e.qty,0);
        const sf=stocRamas(m.model);
        const st=sf<0?"lipsa":sf===0&&(alocat+livrate)>0?"exact":"ok";
        const iesiriFisa=iesiri.filter(e=>e.model===m.model).map(e=>({...e,tip:"iesire",sursa:e.client}));
        const intrarifisa=intrari.flatMap(f=>f.pozitii.filter(p=>p.model===m.model).map(p=>({id:f.id+p.id,data:f.data,tip:"intrare",sursa:f.furnizor,factura:f.factura,qty:p.qty})));
        const miscariFisa=[...iesiriFisa,...intrarifisa].sort((a,b)=>a.data>b.data?1:-1);

        return <div key={m.model} style={{background:C.surface,border:`1px solid ${C.border}`,marginBottom:10,overflow:"hidden"}}>
          <div onClick={()=>setOpenModel(p=>({...p,[m.model]:!isOpen}))} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 18px",cursor:"pointer",userSelect:"none",background:CC[1]}}>
            <div style={{fontSize:14,fontWeight:500,color:C.text,minWidth:70,letterSpacing:"0.03em"}}>{m.model}</div>
            <div style={{display:"flex",gap:16,flex:1}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>Sold inițial</div><div style={{fontSize:13,fontWeight:500,color:C.textSub}}>{si}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>+ Intrări</div><div style={{fontSize:13,fontWeight:600,color:"#3A6A3A"}}>{ti}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>− Ieșiri</div><div style={{fontSize:13,fontWeight:600,color:C.danger}}>{alocat+livrate}</div></div>
              <div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>Sold final</div><div style={{fontSize:15,fontWeight:700,color:st==="lipsa"?C.danger:C.accent}}>{sf}</div></div>
            </div>
            <span style={{fontSize:11,padding:"3px 10px",fontWeight:500,background:st==="lipsa"?C.dangerLight:st==="exact"?"#F0EFED":C.accentLight,color:st==="lipsa"?C.danger:st==="exact"?C.textSub:C.accent}}>{st==="lipsa"?`Lipsă ${Math.abs(sf)}`:st==="exact"?"Exact":"OK"}</span>
            <span style={{fontSize:11,color:C.textMuted}}>{isOpen?"▾":"▸"}</span>
          </div>
          {isOpen&&<div style={{padding:"14px 18px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:12,color:C.textMuted,minWidth:100}}>Sold inițial:</span>
              <input type="number" min="0" value={m.stoc} onChange={e=>updStoc(m.model,e.target.value)} style={{width:70,fontSize:13,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",textAlign:"center"}}/>
              <span style={{fontSize:12,color:C.textMuted}}>buc.</span>
            </div>
            {miscariFisa.length>0&&<div>
              <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Fișă mișcări</div>
              <div style={{border:`1px solid ${C.border}`,overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"90px 80px 1fr 70px 90px",padding:"7px 12px",background:C.bg,borderBottom:`1px solid ${C.border}`}}>
                  {["DATA","TIP","SURSĂ","BUC.","FACTURĂ"].map(h=><div key={h} style={{fontSize:9,fontWeight:600,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{h}</div>)}
                </div>
                {miscariFisa.map(e=><div key={e.id} style={{display:"grid",gridTemplateColumns:"90px 80px 1fr 70px 90px",padding:"8px 12px",borderBottom:`1px solid ${C.bg}`,alignItems:"center"}}>
                  <div style={{fontSize:11,color:C.textSub}}>{fmtD(e.data)}</div>
                  <div><span style={{padding:"2px 7px",fontSize:10,fontWeight:600,background:e.tip==="intrare"?"#EAF2EA":"#F5EEEE",color:e.tip==="intrare"?"#3A6A3A":C.danger}}>{e.tip==="intrare"?"↓ IN":"↑ OUT"}</span></div>
                  <div style={{fontSize:12,color:C.text,fontWeight:500}}>{e.sursa||"—"}</div>
                  <div style={{fontSize:13,fontWeight:600,color:e.tip==="intrare"?"#3A6A3A":C.danger}}>{e.tip==="intrare"?"+":"-"}{e.qty}</div>
                  <div style={{fontSize:11,color:C.textMuted}}>{e.factura||"—"}</div>
                </div>)}
              </div>
            </div>}
            {alocat>0&&<div style={{marginTop:12,padding:"10px 14px",background:C.accentLight}}>
              <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Alocat clienți activi</div>
              {clients.filter(c=>(c.motoare||[]).find(x=>x.model===m.model)).map(c=>{const mx=c.motoare.find(x=>x.model===m.model);return <div key={c.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}><span style={{flex:1,fontSize:12,color:C.text}}>{c.name}</span><span style={{fontSize:12,fontWeight:600,color:C.accent}}>{mx.qty} buc.</span></div>;})}
            </div>}
            <button onClick={()=>delMotorModel(m.model)} style={{marginTop:12,fontSize:11,color:C.textMuted,border:"none",background:"transparent",cursor:"pointer"}}>× șterge model</button>
          </div>}
        </div>;
      })}

      <div style={{marginTop:8}}>
        <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:8}}>Adaugă model nou</div>
        <div style={{display:"flex",gap:8}}>
          <input value={newMotorModel} onChange={e=>setNewMotorModel(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&addMotorModel()} placeholder="Ex: CM-60" style={{...inp,flex:1}}/>
          <button style={btnP()} onClick={addMotorModel}>+ Adaugă</button>
        </div>
      </div>
  </div>;
}

function LogDiscutii({id,log,setLog,C,inp,btnP,gid,tday,fmtD}){
  const [open,setOpen]=React.useState(false);
  const [text,setText]=React.useState("");
  const entries=(log[id]||[]).slice().reverse();
  const addEntry=()=>{
    if(!text.trim()) return;
    const now=new Date();
    const ora=now.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
    setLog(p=>({...p,[id]:[...(p[id]||[]),{id:Date.now().toString(),text:text.trim(),data:tday(),ora}]}));
    setText("");
  };
  const delEntry=(eid)=>setLog(p=>({...p,[id]:(p[id]||[]).filter(e=>e.id!==eid)}));
  return <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:open?10:0}}>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,cursor:"pointer"}} onClick={()=>setOpen(!open)}>
        Discuții {entries.length>0&&<span style={{background:C.accentLight,color:C.accent,padding:"1px 6px",fontSize:10,marginLeft:4}}>{entries.length}</span>}
        <span style={{marginLeft:6,fontSize:10}}>{open?"▾":"▸"}</span>
      </div>
      {!open&&entries.length>0&&<span style={{fontSize:11,color:C.textMuted}}>{fmtD(entries[0].data)} — {entries[0].text.slice(0,40)}{entries[0].text.length>40?"...":""}</span>}
    </div>
    {open&&<div>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEntry()} placeholder="Notează ce s-a discutat..." style={{...inp,flex:1,padding:"6px 10px",fontSize:12}}/>
        <button onClick={addEntry} style={{...btnP(),fontSize:11,padding:"6px 14px"}}>+ Adaugă</button>
      </div>
      {entries.length===0&&<div style={{fontSize:12,color:C.textMuted,textAlign:"center",padding:"0.5rem"}}>Nicio discuție notată.</div>}
      {entries.map(e=><div key={e.id} style={{display:"flex",gap:8,padding:"8px 10px",background:C.bg,marginBottom:4,alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:12,color:C.text}}>{e.text}</div>
          <div style={{fontSize:10,color:C.textMuted,marginTop:2}}>{fmtD(e.data)} · {e.ora}</div>
        </div>
        <button onClick={()=>delEntry(e.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>)}
    </div>}
  </div>;
}

function AddBiletForm({furnizori,onAdd,onAddFurnizor}){
  const [open,setOpen]=React.useState(false);
  const [numar,setNumar]=React.useState("");
  const [furnizor,setFurnizor]=React.useState(furnizori[0]||"");
  const [furnizorNou,setFurnizorNou]=React.useState("");
  const [valoare,setValoare]=React.useState("");
  const [scadenta,setScadenta]=React.useState("");
  const [addingFurnizor,setAddingFurnizor]=React.useState(false);
  const C2={bg:"#F2EFE9",surface:"#FAF8F4",border:"#E0D8CC",text:"#2A2118",textMuted:"#A8998A",accent:"#A0845C"};
  const confirmFurnizorNou=()=>{if(furnizorNou.trim()){const f=furnizorNou.trim();setFurnizor(f);onAddFurnizor(f);setAddingFurnizor(false);setFurnizorNou("");}};
  if(!open) return <button onClick={()=>setOpen(true)} style={{width:"100%",padding:"11px",fontSize:12,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer",fontWeight:500,marginBottom:16}}>+ Bilet la ordin nou</button>;
  return <div style={{background:C2.surface,border:`1px solid ${C2.border}`,padding:"16px",marginBottom:16}}>
    <div style={{fontSize:11,color:C2.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:12}}>Bilet la ordin nou</div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Nr. bilet</div>
        <input value={numar} onChange={e=>setNumar(e.target.value)} placeholder="ex: 001" style={{width:90,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/></div>
      <div style={{flex:2,minWidth:140}}>
        <div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Furnizor</div>
        {addingFurnizor?<div style={{display:"flex",gap:6}}>
          <input autoFocus value={furnizorNou} onChange={e=>setFurnizorNou(e.target.value)} onKeyDown={e=>e.key==="Enter"&&confirmFurnizorNou()} placeholder="Nume furnizor nou" style={{flex:1,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/>
          <button onClick={confirmFurnizorNou} style={{padding:"6px 10px",border:"none",background:C2.accent,color:"#fff",cursor:"pointer",fontSize:12}}>OK</button>
          <button onClick={()=>{setAddingFurnizor(false);setFurnizorNou("");}} style={{padding:"6px 10px",border:`1px solid ${C2.border}`,background:"transparent",cursor:"pointer",fontSize:12}}>✕</button>
        </div>:<div style={{display:"flex",gap:6}}>
          <select value={furnizor} onChange={e=>setFurnizor(e.target.value)} style={{flex:1,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 8px",background:"#fff",outline:"none"}}>
            {furnizori.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
          <button onClick={()=>setAddingFurnizor(true)} style={{padding:"6px 10px",border:`1px solid ${C2.border}`,background:"transparent",cursor:"pointer",fontSize:11,color:C2.textMuted,whiteSpace:"nowrap"}}>+ nou</button>
        </div>}
      </div>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Valoare (RON)</div>
        <input type="number" value={valoare} onChange={e=>setValoare(e.target.value)} placeholder="0" style={{width:110,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/></div>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Scadență</div>
        <input type="date" value={scadenta} onChange={e=>setScadenta(e.target.value)} style={{fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:"#fff"}}/></div>
    </div>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
      <button onClick={()=>setOpen(false)} style={{padding:"7px 16px",border:`1px solid ${C2.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C2.textMuted}}>Anulează</button>
      <button onClick={()=>{if(valoare&&scadenta){onAdd({numar,furnizor,valoare:Number(valoare),scadenta});setNumar("");setValoare("");setScadenta("");setOpen(false);}}} style={{padding:"7px 20px",border:"none",background:C2.accent,color:"#fff",cursor:"pointer",fontSize:12,fontWeight:500}}>Salvează</button>
    </div>
  </div>;
}

function CashFlowTab({trezorerie,setTrezorerie,bilete,setBilete,furnizoriLista,setFurnizoriLista,C,card,inp,btnP,btnS,row,fmtD,tday,gid,daysTo}){
  const [sectiune,setSectiune]=React.useState("registru");
  const [showForm,setShowForm]=React.useState(null); // null | {data, tip}
  const [formData,setFormData]=React.useState({descriere:"",suma:""});
  const [editId,setEditId]=React.useState(null);
  const [editData,setEditData]=React.useState({descriere:"",suma:"",data:""});
  const [showAddRec,setShowAddRec]=React.useState(false);
  const [newRec,setNewRec]=React.useState({denumire:"",suma:"",ziua:"15"});

  const updT=(f,v)=>setTrezorerie(t=>({...t,[f]:v}));
  const inreg=trezorerie.inregistrari||[];
  const recurente=trezorerie.recurente||[];
  const soldInit=Number(trezorerie.soldInitial||0);

  const adaugaInreg=(data,tip)=>{
    if(!formData.suma) return;
    updT("inregistrari",[...inreg,{id:gid(),descriere:formData.descriere,suma:Number(formData.suma),data,tip}]);
    setFormData({descriere:"",suma:""});setShowForm(null);
  };
  const stergeInreg=(id)=>updT("inregistrari",inreg.filter(x=>x.id!==id));
  const salveazaEdit=(id)=>{
    updT("inregistrari",inreg.map(x=>x.id!==id?x:{...x,descriere:editData.descriere,suma:Number(editData.suma),data:editData.data||x.data}));
    setEditId(null);
  };
  const adaugaRec=()=>{
    if(!newRec.denumire||!newRec.suma) return;
    updT("recurente",[...recurente,{id:gid(),...newRec,suma:Number(newRec.suma)}]);
    setNewRec({denumire:"",suma:"",ziua:"15"});setShowAddRec(false);
  };

  // Construieste zilele
  const getZile=()=>{
    const zile=[];
    let sold=soldInit;
    for(let i=-3;i<90;i++){
      const d=new Date();d.setDate(d.getDate()+i);
      const ds=dateToKey(d);
      const zi=d.getDate();
      const soldZiStart=sold;
      const incasariZi=inreg.filter(x=>x.data===ds&&x.tip==="incasare");
      const platiZi=inreg.filter(x=>x.data===ds&&x.tip==="plata");
      const bileteZi=bilete.filter(b=>!b.achitat&&b.scadenta===ds);
      const recZi=recurente.filter(r=>parseInt(r.ziua)===zi);
      const totalIn=incasariZi.reduce((s,x)=>s+x.suma,0);
      const totalOut=platiZi.reduce((s,x)=>s+x.suma,0)+bileteZi.reduce((s,b)=>s+Number(b.valoare||0),0)+recZi.reduce((s,r)=>s+r.suma,0);
      sold=sold+totalIn-totalOut;
      zile.push({data:ds,soldStart:soldZiStart,soldEnd:sold,totalIn,totalOut,incasariZi,platiZi,bileteZi,recZi,
        label:d.toLocaleDateString("ro-RO",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}),
        isAzi:ds===tday(),isTrecut:ds<tday()});
    }
    return zile;
  };
  const zile=getZile();
  const soldAzi=zile.find(z=>z.isAzi)?.soldEnd||soldInit;
  const primaZiNeg=zile.find(z=>z.soldEnd<0&&!z.isTrecut);
  const inpS={...inp,padding:"6px 10px",fontSize:13};

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:12}}>Cash Flow · Registru zilnic</div>

    {primaZiNeg&&<div style={{padding:"10px 14px",background:C.dangerLight,border:`1px solid #C9BCA6`,marginBottom:10,fontSize:13,color:C.danger,fontWeight:500}}>
      ● Sold negativ previzionat pe {primaZiNeg.label}: {primaZiNeg.soldEnd.toLocaleString("ro-RO")} RON
    </div>}
    {bilete.filter(b=>!b.achitat&&b.scadenta&&daysTo(b.scadenta)<=7&&daysTo(b.scadenta)>=0).map(b=>(
      <div key={b.id} style={{padding:"8px 14px",background:C.warnLight,border:`1px solid #C9BCA6`,marginBottom:6,fontSize:12,color:C.warn}}>
        ⏰ Bilet #{b.numar} · {b.furnizor} · {Number(b.valoare).toLocaleString("ro-RO")} RON — scadent {fmtD(b.scadenta)}
      </div>
    ))}

    {/* Sold initial + sold azi */}
    <div style={{...card,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Sold inițial</div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input type="number" value={trezorerie.soldInitial||0} onChange={e=>updT("soldInitial",Number(e.target.value))} style={{...inpS,width:130}}/>
            <span style={{fontSize:12,color:C.textMuted}}>RON</span>
          </div>
        </div>
        <div style={{flex:1}}/>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Sold azi</div>
          <div style={{fontSize:26,fontWeight:700,color:soldAzi<0?C.danger:C.accent}}>{soldAzi.toLocaleString("ro-RO")} RON</div>
        </div>
      </div>
    </div>

    {/* Sectiuni */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {[["registru","Registru"],["bilete","Bilete la ordin"],["recurente","Recurente"]].map(([id,l])=>
        <button key={id} onClick={()=>setSectiune(id)} style={{padding:"7px 14px",border:`1px solid ${sectiune===id?C.accent:C.border}`,background:sectiune===id?C.accentLight:"transparent",color:sectiune===id?C.accent:C.textSub,cursor:"pointer",fontSize:12,fontWeight:sectiune===id?500:400}}>{l}</button>
      )}
    </div>

    {/* REGISTRU ZILNIC */}
    {sectiune==="registru"&&<div>
      {zile.filter(z=>!z.isTrecut||z.totalIn>0||z.totalOut>0||z.isAzi).map(z=>(
        <div key={z.data} style={{...card,marginBottom:10,opacity:z.isTrecut&&!z.isAzi?0.7:1,border:z.isAzi?`2px solid ${C.accent}`:`1px solid ${C.border}`}}>

          {/* Header zi */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:z.isAzi?C.accent:C.text}}>{z.label}</div>
              <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>Sold la început de zi: <strong style={{color:z.soldStart<0?C.danger:C.textSub}}>{z.soldStart.toLocaleString("ro-RO")} RON</strong></div>
            </div>
            {z.isAzi&&<span style={{fontSize:10,background:C.accent,color:"#fff",padding:"3px 8px",fontWeight:600}}>AZI</span>}
          </div>

          {/* ÎNCASĂRI */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:"#3A6A3A",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,marginBottom:6}}>↓ Încasări</div>
            {z.incasariZi.map(m=><div key={m.id} style={{marginBottom:4}}>
              {editId===m.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:"#F2F8F2",flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Descriere" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>salveazaEdit(m.id)} style={{...btnP("#3A6A3A"),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",gap:8,borderBottom:"1px dashed #C0DCC0"}}>
                  <span style={{flex:1,fontSize:13,color:"#2A4A2A"}}>{m.descriere||"—"}</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#2A6A2A",minWidth:140,textAlign:"right"}}>+{m.suma.toLocaleString("ro-RO")} RON</span>
                  <button onClick={()=>{setEditId(m.id);setEditData({descriere:m.descriere,suma:m.suma,data:m.data});}} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,width:16}}>✎</button>
                  <button onClick={()=>stergeInreg(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.danger,fontSize:14,width:16}}>×</button>
                </div>
              }
            </div>)}
            {/* Buton adauga incasare */}
            {showForm?.data===z.data&&showForm?.tip==="incasare"?
              <div style={{display:"flex",gap:6,alignItems:"center",padding:"8px 10px",background:"#F2F8F2",marginTop:4}}>
                <input autoFocus value={formData.descriere} onChange={e=>setFormData(x=>({...x,descriere:e.target.value}))} placeholder="Client / descriere" style={{...inpS,flex:2}}/>
                <input type="number" value={formData.suma} onChange={e=>setFormData(x=>({...x,suma:e.target.value}))} placeholder="Sumă" style={{...inpS,width:100}}/>
                <button onClick={()=>{adaugaInreg(z.data,"incasare");setShowForm(null);}} style={{...btnP("#3A6A3A"),fontSize:11,padding:"5px 12px"}}>✓</button>
                <button onClick={()=>setShowForm(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
              </div>:
              <button onClick={()=>{setShowForm({data:z.data,tip:"incasare"});setFormData({descriere:"",suma:"",});}} style={{fontSize:11,color:"#2A2118",border:"none",padding:"4px 12px",background:"#5C6B65",cursor:"pointer",marginTop:4}}>+ adaugă încasare</button>
            }
            {z.totalIn>0&&<div style={{textAlign:"right",fontSize:12,fontWeight:700,color:"#2A6A2A",marginTop:6,paddingTop:6,borderTop:"1px solid #D0E8D0"}}>Total încasări: +{z.totalIn.toLocaleString("ro-RO")} RON</div>}
          </div>

          {/* PLĂȚI */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.danger,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700,marginBottom:6}}>↑ Plăți</div>
            {z.platiZi.map(m=><div key={m.id} style={{marginBottom:4}}>
              {editId===m.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:C.dangerLight,flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Descriere" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>salveazaEdit(m.id)} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",gap:8,borderBottom:"1px dashed #DDB8B8"}}>
                  <span style={{flex:1,fontSize:13,color:"#4A2A2A"}}>{m.descriere||"—"}</span>
                  <span style={{fontSize:14,fontWeight:700,color:C.danger,minWidth:140,textAlign:"right"}}>-{m.suma.toLocaleString("ro-RO")} RON</span>
                  <button onClick={()=>{setEditId(m.id);setEditData({descriere:m.descriere,suma:m.suma,data:m.data});}} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,width:16}}>✎</button>
                  <button onClick={()=>stergeInreg(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.danger,fontSize:14,width:16}}>×</button>
                </div>
              }
            </div>)}
            {/* Bilete scadente */}
            {z.bileteZi.map(b=><div key={b.id} style={{marginBottom:4}}>
              {editId===b.id?
                <div style={{display:"flex",gap:6,alignItems:"center",padding:"6px 10px",background:C.dangerLight,flexWrap:"wrap"}}>
                  <input value={editData.descriere} onChange={e=>setEditData(x=>({...x,descriere:e.target.value}))} placeholder="Furnizor" style={{...inpS,flex:2,minWidth:100}}/>
                  <input type="number" value={editData.suma} onChange={e=>setEditData(x=>({...x,suma:e.target.value}))} style={{...inpS,width:90}}/>
                  <input type="date" value={editData.data} onChange={e=>setEditData(x=>({...x,data:e.target.value}))} style={{...inpS,width:130}}/>
                  <button onClick={()=>{setBilete(p=>p.map(x=>x.id!==b.id?x:{...x,furnizor:editData.descriere,valoare:Number(editData.suma),scadenta:editData.data}));setEditId(null);}} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓</button>
                  <button onClick={()=>setEditId(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>✕</button>
                </div>:
                <div style={{display:"flex",alignItems:"center",padding:"7px 10px",background:"#FBF5F5",gap:8}}>
                  <span style={{flex:1,fontSize:13,color:"#4A2A2A"}}>Bilet #{b.numar} · {b.furnizor}</span>
                  <span style={{fontSize:14,fontWeight:700,color:C.danger,minWidth:140,textAlign:"right"}}>-{Number(b.valoare).toLocaleString("ro-RO")} RON</span>
                  <button onClick={()=>{setEditId(b.id);setEditData({descriere:b.furnizor,suma:b.valoare,data:b.scadenta});}} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:12,width:16}}>✎</button>
                  <div style={{width:16}}/>
                </div>
              }
            </div>)}
            {/* Recurente */}
            {z.recZi.map(r=><div key={r.id} style={{display:"flex",alignItems:"center",padding:"7px 10px",background:"#FBF5F5",gap:8,marginBottom:4}}>
              <span style={{flex:1,fontSize:13,color:"#4A2A2A"}}>{r.denumire}</span>
              <span style={{fontSize:14,fontWeight:700,color:C.danger,minWidth:140,textAlign:"right"}}>-{Number(r.suma).toLocaleString("ro-RO")} RON</span>
              <div style={{width:32}}/>
            </div>)}
            {/* Buton adauga plata */}
            {showForm?.data===z.data&&showForm?.tip==="plata"?
              <div style={{padding:"8px 10px",background:C.dangerLight,marginTop:4}}>
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
                  {formData.addingFurnizor?
                    <>
                      <input autoFocus value={formData.furnizorNou||""} onChange={e=>setFormData(x=>({...x,furnizorNou:e.target.value}))} placeholder="Furnizor nou" style={{...inpS,flex:2}}/>
                      <button onClick={()=>{if((formData.furnizorNou||"").trim()){const f=formData.furnizorNou.trim();setFurnizoriLista(p=>[...p.includes(f)?p:[...p,f]]);setFormData(x=>({...x,descriere:f,addingFurnizor:false,furnizorNou:""}));}}} style={{...btnP(C.danger),fontSize:11,padding:"5px 10px"}}>OK</button>
                      <button onClick={()=>setFormData(x=>({...x,addingFurnizor:false}))} style={{...btnS,fontSize:11,padding:"5px 8px"}}>✕</button>
                    </>:
                    <>
                      <select value={formData.descriere} onChange={e=>setFormData(x=>({...x,descriere:e.target.value}))} style={{...inpS,flex:2,minWidth:120}}>
                        <option value="">— alege furnizor —</option>
                        {furnizoriLista.map(f=><option key={f} value={f}>{f}</option>)}
                      </select>
                      <button onClick={()=>setFormData(x=>({...x,addingFurnizor:true}))} style={{fontSize:11,padding:"5px 10px",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",color:C.textSub,whiteSpace:"nowrap"}}>+ nou</button>
                    </>
                  }
                  <input type="number" value={formData.suma} onChange={e=>setFormData(x=>({...x,suma:e.target.value}))} placeholder="Sumă" style={{...inpS,width:100}}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{adaugaInreg(z.data,"plata");setShowForm(null);}} style={{...btnP(C.danger),fontSize:11,padding:"5px 12px"}}>✓ Salvează</button>
                  <button onClick={()=>setShowForm(null)} style={{...btnS,fontSize:11,padding:"5px 10px"}}>Anulează</button>
                </div>
              </div>:
              <button onClick={()=>{setShowForm({data:z.data,tip:"plata"});setFormData({descriere:"",suma:"",addingFurnizor:false});}} style={{fontSize:11,color:"#2A2118",border:"none",padding:"4px 12px",background:"#5C6B65",cursor:"pointer",marginTop:4}}>+ adaugă plată</button>
            }
            {z.totalOut>0&&<div style={{textAlign:"right",fontSize:12,fontWeight:700,color:C.danger,marginTop:6,paddingTop:6,borderTop:"1px solid #DED2BE"}}>Total plăți: -{z.totalOut.toLocaleString("ro-RO")} RON</div>}
          </div>

          {/* SOLD FINAL ZI */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:z.soldEnd<0?C.dangerLight:C.accentLight,marginTop:4}}>
            <div style={{fontSize:12,color:C.textSub}}>
              {z.soldStart.toLocaleString("ro-RO")} RON
              {z.totalIn>0&&<span style={{color:"#3A6A3A"}}> + {z.totalIn.toLocaleString("ro-RO")}</span>}
              {z.totalOut>0&&<span style={{color:C.danger}}> − {z.totalOut.toLocaleString("ro-RO")}</span>}
            </div>
            <div style={{fontSize:16,fontWeight:700,color:z.soldEnd<0?C.danger:C.accent}}>= {z.soldEnd.toLocaleString("ro-RO")} RON</div>
          </div>
        </div>
      ))}
    </div>}

    {/* BILETE LA ORDIN */}
    {sectiune==="bilete"&&<div>
      <AddBiletForm furnizori={furnizoriLista} onAddFurnizor={(f)=>setFurnizoriLista(p=>[...p,f])} onAdd={(b)=>setBilete(p=>[{id:gid(),...b,achitat:false},...p])}/>
      {bilete.length>0&&<div style={{display:"flex",gap:10,marginBottom:12}}>
        <div style={{flex:1,...card,padding:"12px 16px",marginBottom:0}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Neachitat</div>
          <div style={{fontSize:18,fontWeight:700,color:C.danger}}>{bilete.filter(b=>!b.achitat).reduce((s,b)=>s+Number(b.valoare||0),0).toLocaleString("ro-RO")} RON</div>
        </div>
        <div style={{flex:1,...card,padding:"12px 16px",marginBottom:0}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>Achitat</div>
          <div style={{fontSize:18,fontWeight:700,color:C.accent}}>{bilete.filter(b=>b.achitat).reduce((s,b)=>s+Number(b.valoare||0),0).toLocaleString("ro-RO")} RON</div>
        </div>
      </div>}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"70px 1fr 110px 100px 90px 40px",padding:"8px 14px",background:C.bg,borderBottom:`1px solid ${C.border}`}}>
          {["NR.","FURNIZOR","VALOARE","SCADENȚĂ","STATUS",""].map(h=><div key={h} style={{fontSize:9,fontWeight:600,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</div>)}
        </div>
        {bilete.length===0&&<div style={{padding:"2rem",textAlign:"center",fontSize:13,color:C.textMuted}}>Niciun bilet la ordin.</div>}
        {bilete.map(b=>{
          const ov=!b.achitat&&b.scadenta&&b.scadenta<tday();
          const soon=!b.achitat&&b.scadenta&&daysTo(b.scadenta)<=7&&daysTo(b.scadenta)>=0;
          return <div key={b.id} style={{display:"grid",gridTemplateColumns:"70px 1fr 110px 100px 90px 40px",padding:"10px 14px",borderBottom:`1px solid ${C.bg}`,alignItems:"center",opacity:b.achitat?0.55:1}}>
            <div style={{fontSize:12,color:C.textSub}}>#{b.numar}</div>
            <div style={{fontSize:13,color:C.text,fontWeight:500}}>{b.furnizor}</div>
            <div style={{fontSize:13,fontWeight:600,color:ov?C.danger:C.text}}>{Number(b.valoare||0).toLocaleString("ro-RO")} RON</div>
            <div style={{fontSize:12,color:ov?C.danger:soon?C.warn:C.textSub,fontWeight:ov||soon?600:400}}>{fmtD(b.scadenta)}</div>
            <button onClick={()=>setBilete(p=>p.map(x=>x.id===b.id?{...x,achitat:!x.achitat}:x))}
              style={{fontSize:10,padding:"3px 8px",border:"none",cursor:"pointer",fontWeight:500,background:b.achitat?C.accentLight:C.dangerLight,color:b.achitat?C.accent:C.danger}}>
              {b.achitat?"✓ Achitat":"Neachitat"}
            </button>
            <button onClick={()=>setBilete(p=>p.filter(x=>x.id!==b.id))} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:16}}>×</button>
          </div>;
        })}
      </div>
    </div>}

    {/* PLATI RECURENTE */}
    {sectiune==="recurente"&&<div>
      <div style={{marginBottom:12}}>
        <button onClick={()=>setShowAddRec(!showAddRec)} style={{...btnP(),fontSize:11}}>+ Plată recurentă nouă</button>
      </div>
      {showAddRec&&<div style={{...card,marginBottom:12}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <input placeholder="ex: Salarii, Chirie..." value={newRec.denumire} onChange={e=>setNewRec(x=>({...x,denumire:e.target.value}))} style={{...inpS,flex:2,minWidth:150}}/>
          <input type="number" placeholder="Sumă RON" value={newRec.suma} onChange={e=>setNewRec(x=>({...x,suma:e.target.value}))} style={{...inpS,width:120}}/>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:12,color:C.textMuted}}>Ziua</span>
            <input type="number" min="1" max="31" value={newRec.ziua} onChange={e=>setNewRec(x=>({...x,ziua:e.target.value}))} style={{...inpS,width:60}}/>
            <span style={{fontSize:12,color:C.textMuted}}>a lunii</span>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={adaugaRec} style={{...btnP(),fontSize:11}}>Salvează</button>
          <button onClick={()=>setShowAddRec(false)} style={{...btnS,fontSize:11}}>Anulează</button>
        </div>
      </div>}
      {recurente.length===0&&<div style={{textAlign:"center",padding:"2rem",fontSize:13,color:C.textMuted}}>Nicio plată recurentă.</div>}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {recurente.map(r=><div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${C.bg}`,flexWrap:"wrap"}}>
          <div style={{flex:2,minWidth:120}}>
            <input value={r.denumire} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,denumire:e.target.value}))} style={{width:"100%",fontSize:13,fontWeight:500,color:C.text,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",background:C.surface}}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:11,color:C.textMuted}}>Ziua</span>
            <input type="number" min="1" max="31" value={r.ziua} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,ziua:e.target.value}))} style={{width:50,fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",textAlign:"center",background:C.surface}}/>
            <span style={{fontSize:11,color:C.textMuted}}>/ lună</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <input type="number" value={r.suma} onChange={e=>updT("recurente",recurente.map(x=>x.id!==r.id?x:{...x,suma:Number(e.target.value)||0}))} style={{width:100,fontSize:13,fontWeight:600,color:C.danger,border:`1px solid ${C.border}`,padding:"4px 8px",outline:"none",textAlign:"right",background:C.surface}}/>
            <span style={{fontSize:12,color:C.textMuted}}>RON</span>
          </div>
          <button onClick={()=>updT("recurente",recurente.filter(x=>x.id!==r.id))} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:16}}>×</button>
        </div>)}
        {recurente.length>0&&<div style={{padding:"10px 16px",background:C.bg,fontSize:12,fontWeight:600,color:C.danger,textAlign:"right"}}>
          Total lunar: {recurente.reduce((s,r)=>s+r.suma,0).toLocaleString("ro-RO")} RON
        </div>}
      </div>
    </div>}
  </div>;
}


function AddFacturaForm({motoare, onAdd}){
  const [open,setOpen]=React.useState(false);
  const [furnizor,setFurnizor]=React.useState("");
  const [factura,setFactura]=React.useState("");
  const [data,setData]=React.useState(tday());
  const [pozitii,setPozitii]=React.useState([{id:"p1",model:motoare[0]?.model||"",qty:1}]);
  const C2={bg:"#F2EFE9",surface:"#FAF8F4",border:"#E0D8CC",text:"#2A2118",textMuted:"#A8998A"};
  const addPoz=()=>setPozitii(p=>[...p,{id:Date.now().toString(),model:motoare[0]?.model||"",qty:1}]);
  const updPoz=(id,f,v)=>setPozitii(p=>p.map(pz=>pz.id!==id?pz:{...pz,[f]:f==="qty"?parseInt(v)||1:v}));
  const delPoz=(id)=>setPozitii(p=>p.filter(pz=>pz.id!==id));
  const handleSave=()=>{
    if(pozitii.length===0) return;
    onAdd({furnizor:furnizor||"Furnizor necunoscut",factura,data,pozitii:[...pozitii]});
    setFurnizor("");setFactura("");setData(tday());
    setPozitii([{id:"p1",model:motoare[0]?.model||"",qty:1}]);
    setOpen(false);
  };
  if(!open) return <button onClick={()=>setOpen(true)} style={{width:"100%",padding:"11px",fontSize:12,color:"#2A2118",border:"none",background:"#5C6B65",cursor:"pointer",fontWeight:500,marginBottom:16}}>+ Înregistrează intrare nouă (factură)</button>;
  return <div style={{background:"#F2F8F2",border:"1.5px solid #90C090",padding:"16px",marginBottom:16}}>
    <div style={{fontSize:11,color:"#3A6A3A",textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:12}}>Intrare nouă · Factură</div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
      <div style={{flex:2,minWidth:120}}><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Furnizor *</div>
        <input value={furnizor} onChange={e=>setFurnizor(e.target.value)} placeholder="ex: Coulisse" style={{width:"100%",fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
      <div style={{flex:2,minWidth:120}}><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Nr. factură</div>
        <input value={factura} onChange={e=>setFactura(e.target.value)} placeholder="ex: F2024-001" style={{width:"100%",fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
      <div><div style={{fontSize:10,color:C2.textMuted,marginBottom:3}}>Data</div>
        <input type="date" value={data} onChange={e=>setData(e.target.value)} style={{fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 10px",outline:"none",background:C2.surface}}/></div>
    </div>
    <div style={{fontSize:10,color:C2.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:8}}>Poziții</div>
    {pozitii.map((pz,i)=><div key={pz.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
      <select value={pz.model} onChange={e=>updPoz(pz.id,"model",e.target.value)} style={{fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 8px",background:C2.surface,outline:"none",flex:1}}>
        {motoare.map(m=><option key={m.model} value={m.model}>{m.model}</option>)}
      </select>
      <input type="number" min="1" value={pz.qty} onChange={e=>updPoz(pz.id,"qty",e.target.value)} style={{width:70,fontSize:13,border:`1px solid ${C2.border}`,padding:"6px 8px",outline:"none",textAlign:"center"}}/>
      <span style={{fontSize:12,color:C2.textMuted}}>buc.</span>

function EnergieCard({energie,setEnergie,C,card,tday}){
  const azi=tday();
  const eAzi=energie[azi]||{};
  const completat=!!(eAzi.nivel&&eAzi.mod&&eAzi.contact!==undefined);
  const [open,setOpen]=useState(!completat);
  const updEnergie=(field,val)=>setEnergie(p=>({...p,[azi]:{...(p[azi]||{}),[field]:val}}));
  const culoareNivel=eAzi.nivel?C.accent:C.textMuted;
  const emojiNivel="·";
  return <div style={{...card,marginBottom:12,padding:"14px 18px",border:completat?`1px solid ${C.border}`:`1.5px solid ${C.accent}`}}>
    <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",userSelect:"none"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:16}}>{emojiNivel}</span>
        <div>
          <div style={{fontSize:11,fontWeight:600,color:completat?culoareNivel:C.accent,textTransform:"uppercase",letterSpacing:"0.08em"}}>
            {completat?"Stare zilnică":"Cum ești azi?"}
          </div>
          {completat&&<div style={{fontSize:11,color:C.textMuted,marginTop:1}}>
            {{"1":"Energie scăzută","2":"Energie medie","3":"Energie ridicată"}[eAzi.nivel]}
            {" · "}{eAzi.mod==="blocuri"?"Blocuri mari":"Task-uri mici"}
            {" · "}{eAzi.contact?"Deschisă spre contact":"Fără contact extern"}
          </div>}
        </div>
      </div>
      <span style={{fontSize:11,color:C.textMuted}}>{open?"▾":"▸"}</span>
    </div>
    {open&&<div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Energie</div>
        <div style={{display:"flex",gap:8}}>
          {[["1","Scăzută"],["2","Medie"],["3","Ridicată"]].map(([v,l])=>
            <button key={v} onClick={()=>updEnergie("nivel",v)}
              style={{flex:1,padding:"8px 6px",border:`1.5px solid ${eAzi.nivel===v?C.accent:C.border}`,background:eAzi.nivel===v?C.accentLight:"transparent",color:eAzi.nivel===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.nivel===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Focalizare posibilă</div>
        <div style={{display:"flex",gap:8}}>
          {[["blocuri","Blocuri mari de timp"],["mici","Task-uri mici / rapide"]].map(([v,l])=>
            <button key={v} onClick={()=>updEnergie("mod",v)}
              style={{flex:1,padding:"8px 10px",border:`1.5px solid ${eAzi.mod===v?C.accent:C.border}`,background:eAzi.mod===v?C.accentLight:"transparent",color:eAzi.mod===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.mod===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      <div style={{marginBottom:4}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Contact extern</div>
        <div style={{display:"flex",gap:8}}>
          {[[true,"Da, sunt deschisă"],[false,"Nu azi"]].map(([v,l])=>
            <button key={String(v)} onClick={()=>updEnergie("contact",v)}
              style={{flex:1,padding:"8px 10px",border:`1.5px solid ${eAzi.contact===v?C.accent:C.border}`,background:eAzi.contact===v?C.accentLight:"transparent",color:eAzi.contact===v?C.accent:C.textMuted,cursor:"pointer",fontSize:12,fontWeight:eAzi.contact===v?600:400,transition:"all .15s"}}>
              {l}
            </button>
          )}
        </div>
      </div>
      {completat&&<button onClick={()=>setOpen(false)} style={{marginTop:12,width:"100%",padding:"7px",border:"none",background:C.accent,color:"#fff",cursor:"pointer",fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase"}}>✓ Salvat</button>}
    </div>}
  </div>;
}

        const ZILE_SCURT=["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
        const daysInM=(y,m)=>new Date(y,m+1,0).getDate();

              const offset=(first.getDay()+6)%7;
              const total=daysInM(calGridMonth.y,calGridMonth.m);
              const cells=[];
              for(let i=0;i<offset;i++) cells.push(<div key={`e${i}`}/>);
              for(let day=1;day<=total;day++){
                const key=keyFor(calGridMonth.y,calGridMonth.m,day);
                const isToday=key===todayKey;
                const dow=new Date(calGridMonth.y,calGridMonth.m,day).getDay();
                const isWeekend=dow===0||dow===6;
                const items=byDay[key]||[];
                let bg=items.length?"#5C6B65":C.bg, textCol=items.length?"rgba(255,255,255,0.75)":C.textMuted;
