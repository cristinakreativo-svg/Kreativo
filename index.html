function ListaTaiereRulouri({clients,C}){
  const rows=[];
  (clients||[]).forEach(client=>{
    (client.configuratiiRulou||[]).forEach(cfg=>{
      if(cfg.produs) return; // deja realizat — nu apare la tăiere
      const material = cfg.input.fabricManual ? (cfg.input.materialName||"material custom") : cfg.input.fabric;
      rows.push({
        material, latime: cfg.result.fabricW, inaltime: cfg.result.fabricH,
        gabaritL: cfg.input.width, gabaritH: cfg.input.height,
        sistem: RULOU_SYSTEM_LABELS[cfg.input.system]||cfg.input.system,
        cantitate: cfg.qty||1, client: client.name, camera: cfg.camera||"—",
        clientId: client.id, cfgId: cfg.id
      });
    });
    (client.configuratiiPanou||[]).forEach(cfg=>{
      if(cfg.produs) return; // deja realizat — nu apare la tăiere
      if(cfg.coulisse===false) return; // făcut la croitorie, din alt material — nu apare la tăiere
      const material = cfg.input.material || "material Coulisse (nespecificat)";
      rows.push({
        material, latime: cfg.result.panelWidth, inaltime: cfg.result.fabricCutLen,
        gabaritL: cfg.input.width, gabaritH: cfg.input.height,
        sistem: `Panou · ${cfg.input.system} · ${cfg.result.panels} buc./sistem`,
        cantitate: cfg.qty||1, client: client.name, camera: cfg.camera||"—",
        clientId: client.id, cfgId: cfg.id
      });
    });
  });
  const grupuri={};
  rows.forEach(r=>{ (grupuri[r.material]=grupuri[r.material]||[]).push(r); });
  const materiale=Object.keys(grupuri).sort((a,b)=>a.localeCompare(b,"ro"));
  const totalBuc=rows.reduce((s,r)=>s+Number(r.cantitate||1),0);

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>📐 Listă tăiere — rulouri și panouri nerealizate încă</div>
    <div style={{fontSize:12,color:C.textMuted,marginBottom:16}}>{rows.length} bucăți de tăiat ({totalBuc} buc. total) · {materiale.length} materiale diferite · grupate ca să tai tot dintr-un material deodată</div>
    {materiale.length===0&&<div style={{textAlign:"center",padding:"2rem",fontSize:13,color:C.textMuted}}>Nimic de tăiat — toate rulourile salvate sunt deja marcate „produs".</div>}
    {materiale.map(mat=>{
      const items=grupuri[mat].sort((a,b)=>a.client.localeCompare(b.client,"ro"));
      const subtotalBuc=items.reduce((s,r)=>s+Number(r.cantitate||1),0);
      return <div key={mat} style={{border:`1px solid ${C.border}`,marginBottom:14,background:C.surface}}>
        <div style={{padding:"10px 14px",background:C.accentLight,borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:600,color:C.text}}>{mat}</span>
          <span style={{fontSize:11,color:C.textMuted}}>{items.length} bucăți · {subtotalBuc} buc. total</span>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Lățime stofă</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Înălțime stofă</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Gabarit rulou</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Sistem</th>
              <th style={{textAlign:"right",padding:"6px 14px"}}>Buc.</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Client</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Cameră</th>
            </tr>
          </thead>
          <tbody>
            {items.map((r,i)=><tr key={r.cfgId+i} style={{fontSize:13,background:i%2===0?C.bg:C.surface}}>
              <td style={{padding:"7px 14px",fontWeight:600,color:C.text}}>{r.latime} mm</td>
              <td style={{padding:"7px 14px",fontWeight:600,color:C.text}}>{r.inaltime} mm</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.gabaritL}×{r.gabaritH} mm</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.sistem}</td>
              <td style={{padding:"7px 14px",textAlign:"right",fontWeight:600,color:C.text}}>{r.cantitate}</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.client}</td>
              <td style={{padding:"7px 14px",color:C.textMuted}}>{r.camera}</td>
            </tr>)}
          </tbody>
        </table>
      </div>;
    })}
  </div>;
}

function ListaTaiereProfile({clients,C}){
  const rows=[];
  (clients||[]).forEach(client=>{
    (client.configuratiiSina||[]).forEach(cfg=>{
      if(cfg.produs) return;
      rows.push({categorie:"Șină Coulisse", tip:`Șină Coulisse ${cfg.input.colourKey||"?"}`, lungime:cfg.result.rail, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
        detalii:`${cfg.input.railSegments||1} segment(e)`, cantitate:cfg.input.quantity||1,
        client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-r"});
    });
    (client.configuratiiRoman||[]).forEach(cfg=>{
      if(cfg.produs) return;
      rows.push({categorie:"Stor roman", tip:"Șină stor roman", lungime:cfg.result.headrail, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
        detalii:cfg.input.mechKey, cantitate:1, client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-rh"});
      rows.push({categorie:"Stor roman", tip:"Tub/tijă stor roman", lungime:cfg.result.tiltrod1,
        gabaritL:cfg.input.width, gabaritH:cfg.input.height, detalii:cfg.result.tiltrod2?(cfg.input.mechKey+" · bucata 1 din 2 (tub tăiat în 2)"):cfg.input.mechKey, cantitate:1,
        client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-rt1"});
      if(cfg.result.tiltrod2) rows.push({categorie:"Stor roman", tip:"Tub/tijă stor roman", lungime:cfg.result.tiltrod2,
        gabaritL:cfg.input.width, gabaritH:cfg.input.height, detalii:cfg.input.mechKey+" · bucata 2 din 2 (tub tăiat în 2)", cantitate:1,
        client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-rt2"});
    });
    (client.configuratiiRulou||[]).forEach(cfg=>{
      if(cfg.produs) return;
      rows.push({categorie:"Rulou", tip:"Tub rulou", lungime:cfg.result.tubeL, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
        detalii:cfg.input.tube, cantitate:cfg.qty||1, client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-tu"});
      if(cfg.input.btbManual && cfg.input.btb){
        rows.push({categorie:"Bottombar (contragreutate manuală)", tip:`Bottombar ${cfg.input.btbManualColor||"culoare nespecificată"} — ${cfg.input.btb}`,
          lungime:cfg.result.btbL, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
          detalii:"rulou", cantitate:cfg.qty||1, client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-btb"});
      }
    });
    (client.configuratiiPanou||[]).forEach(cfg=>{
      if(cfg.produs) return; // șina/profilul e mereu Coulisse, indiferent de bifa material — dar dacă e produs, nu mai apare
      const segm=cfg.input.segments||1;
      const trackInfo=PN_TRACK_INFO[cfg.input.tracks];
      rows.push({categorie:"Panou", tip:`Șină panou ${cfg.input.tracks} canale (${trackInfo?trackInfo.headrailArt:"?"})`, lungime:cfg.result.cutHeadrail, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
        detalii:`${cfg.input.system} · ${segm} segment(e) · ${cfg.result.panels} panouri`, cantitate:(cfg.qty||1)*segm,
        client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-ph"});
      rows.push({categorie:"Panou", tip:"Profil PVC panou", lungime:cfg.result.cutPVC, gabaritL:cfg.input.width, gabaritH:cfg.input.height,
        detalii:`${cfg.input.tracks} canale · ${cfg.result.panels} panouri`, cantitate:(cfg.qty||1)*cfg.result.panels,
        client:client.name, camera:cfg.camera||"—", clientId:client.id, cfgId:cfg.id+"-ppvc"});
    });
  });
  const CATEGORII=["Șină Coulisse","Stor roman","Rulou","Bottombar (contragreutate manuală)","Panou"];
  const grupuri={};
  rows.forEach(r=>{ (grupuri[r.tip]=grupuri[r.tip]||{categorie:r.categorie,items:[]}).items.push(r); });
  const tipuri=Object.keys(grupuri).sort((a,b)=>{
    const ca=CATEGORII.indexOf(grupuri[a].categorie), cb=CATEGORII.indexOf(grupuri[b].categorie);
    if(ca!==cb) return ca-cb;
    return a.localeCompare(b,"ro");
  });
  const totalBuc=rows.reduce((s,r)=>s+Number(r.cantitate||1),0);

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>📏 Listă tăiere profile — șine, tuburi, tije nerealizate încă</div>
    <div style={{fontSize:12,color:C.textMuted,marginBottom:16}}>{rows.length} bucăți de tăiat ({totalBuc} buc. total) · {tipuri.length} tipuri de profil · grupate pe categorie (șină/roman/rulou/panou) și apoi pe tip</div>
    {tipuri.length===0&&<div style={{textAlign:"center",padding:"2rem",fontSize:13,color:C.textMuted}}>Nimic de tăiat — toate profilele salvate sunt deja marcate „produs".</div>}
    {tipuri.map((tip,ti)=>{
      const items=grupuri[tip].items.sort((a,b)=>a.client.localeCompare(b.client,"ro"));
      const subtotalBuc=items.reduce((s,r)=>s+Number(r.cantitate||1),0);
      const showCatHeader = ti===0 || grupuri[tipuri[ti-1]].categorie!==grupuri[tip].categorie;
      return <React.Fragment key={tip}>
        {showCatHeader&&<div style={{fontSize:14,fontWeight:700,color:C.accent,marginTop:ti===0?0:20,marginBottom:8,borderBottom:`2px solid ${C.accent}`,paddingBottom:4}}>{grupuri[tip].categorie}</div>}
        <div style={{border:`1px solid ${C.border}`,marginBottom:14,background:C.surface}}>
        <div style={{padding:"10px 14px",background:C.accentLight,borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,fontWeight:600,color:C.text}}>{tip}</span>
          <span style={{fontSize:11,color:C.textMuted}}>{items.length} bucăți · {subtotalBuc} buc. total</span>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Lungime tăiere</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Gabarit</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Detalii</th>
              <th style={{textAlign:"right",padding:"6px 14px"}}>Buc.</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Client</th>
              <th style={{textAlign:"left",padding:"6px 14px"}}>Cameră</th>
            </tr>
          </thead>
          <tbody>
            {items.map((r,i)=><tr key={r.cfgId+i} style={{fontSize:13,background:i%2===0?C.bg:C.surface}}>
              <td style={{padding:"7px 14px",fontWeight:600,color:C.text}}>{r.lungime} mm</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.gabaritL}×{r.gabaritH} mm</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.detalii}</td>
              <td style={{padding:"7px 14px",textAlign:"right",fontWeight:600,color:C.text}}>{r.cantitate}</td>
              <td style={{padding:"7px 14px",color:C.textSub}}>{r.client}</td>
              <td style={{padding:"7px 14px",color:C.textMuted}}>{r.camera}</td>
            </tr>)}
          </tbody>
        </table>
        </div>
      </React.Fragment>;
    })}
  </div>;
}

function TabConfiguratorRulou({C,clients,setClients,savedMateriale,setSavedMateriale,camereLista,setCamereLista}){
  const [width,setWidth]=React.useState(1000);
  const [height,setHeight]=React.useState(1500);
  const [installHeight,setInstallHeight]=React.useState("");
  const [size,setSize]=React.useState("M");
  const [system,setSystem]=React.useState("10");
  const [control,setControl]=React.useState("A");
  const [options,setOptions]=React.useState([]);
  const [mech,setMech]=React.useState("");
  const [tube,setTube]=React.useState("");
  const [chainType,setChainType]=React.useState("");
  const [csdType,setCsdType]=React.useState("");
  const [pullType,setPullType]=React.useState("");
  const [accessories,setAccessories]=React.useState([]);
  const [side,setSide]=React.useState("Left");
  const [color,setColor]=React.useState("");
  const [fabricKey,setFabricKey]=React.useState(RULOU_DATA.fabrics[4].name);
  const [fabricManual,setFabricManual]=React.useState(false);
  const [fabricThickness,setFabricThickness]=React.useState(0.45);
  const [fabricWeight,setFabricWeight]=React.useState(350);
  const [materialName,setMaterialName]=React.useState("");
  const [btb,setBtb]=React.useState("");
  const [btbManual,setBtbManual]=React.useState(false);
  const [btbManualName,setBtbManualName]=React.useState("");
  const [btbManualColor,setBtbManualColor]=React.useState("");
  const [qty,setQty]=React.useState(1);
  const [clientId,setClientId]=React.useState("");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const systems = rulouSystemsForSize(size);
  React.useEffect(()=>{ if(!systems.includes(system)) setSystem(systems[0]||""); },[size]);
  const controls = rulouControlsForSize(size, system);
  React.useEffect(()=>{ if(!controls.includes(control)) setControl(controls[0]||""); },[size,system]);

  const availOptions = rulouOptionsAvailable(size,control,system);
  const availMechOpts = rulouMechOptionsAvailable(size,control,system);
  const availMech = rulouMechMotorsAvailable(size,control,system);
  const availTubes = rulouTubesAvailable(size,control,system, mech);
  const availColors = rulouColorsAvailable(size,control,system, options);

  React.useEffect(()=>{ setOptions(p=>p.filter(o=>availOptions.includes(o))); },[size,control,system]);
  React.useEffect(()=>{ if(control==="A" && !availMech.includes(mech)) setMech(availMech[0]||""); },[size,control,system]);
  React.useEffect(()=>{ if(control==="B" && !availMech.includes(mech)) setMech(availMech[0]||""); },[size,control,system]);
  React.useEffect(()=>{ if(control==="I") setMech(""); },[control]);
  React.useEffect(()=>{ if(!availTubes.includes(tube)) setTube(availTubes[0]||""); },[size,control,system,mech]);
  React.useEffect(()=>{ if(!availColors.includes(color)) setColor(availColors[0]||""); },[size,control,system,options.join(",")]);

  const chainOptions = availMechOpts.filter(o=>/ballchain \(roll\)|Endless.*ballchain/i.test(o));
  const csdOptions = availMechOpts.filter(o=>/^(CSD-|SafetyClip|Ballchain breakaway)/i.test(o));
  const pullOptions = availMechOpts.filter(o=>/Pull (cord|chain|wand) Twinpull/i.test(o));
  const otherAccessories = availMechOpts.filter(o=>!chainOptions.includes(o)&&!csdOptions.includes(o)&&!pullOptions.includes(o));
  React.useEffect(()=>{ if(control==="A" && !chainOptions.includes(chainType)) setChainType(chainOptions[0]||""); },[size,control,system]);
  React.useEffect(()=>{ if(control==="A" && !csdOptions.includes(csdType)) setCsdType(csdOptions[0]||""); },[size,control,system]);
  React.useEffect(()=>{ if(control==="I" && !pullOptions.includes(pullType)) setPullType(pullOptions[0]||""); },[size,control,system]);
  React.useEffect(()=>{ setAccessories(p=>p.filter(a=>otherAccessories.includes(a))); },[size,control,system]);

  const toggleOption=(opt)=>setOptions(p=>{
    if(p.includes(opt)) return p.filter(o=>o!==opt);
    if(p.length>=5) return p;
    return [...p,opt];
  });
  const toggleAccessory=(a)=>setAccessories(p=>p.includes(a)?p.filter(x=>x!==a):[...p,a]);

  let mechOptions=[];
  if(control==="A"){ mechOptions=[chainType,csdType,...accessories].filter(Boolean); }
  else if(control==="I"){ mechOptions=[pullType,...accessories].filter(Boolean); }
  else { mechOptions=[...accessories]; }

  const btbCandidatesInput = {width:Number(width),height:Number(height),installHeight:installHeight?Number(installHeight):null,
    size,control,system,options,color,mech,tube,mechOptions,side,btb:undefined,
    fabric:fabricKey,fabricManual,fabricThickness,fabricWeight,materialName:fabricManual?materialName:""};
  let codeSoFar="";
  try{ codeSoFar = rulouBuildCode(btbCandidatesInput); }catch(e){}
  const availBtb = codeSoFar ? rulouBottombarsAvailable(codeSoFar) : [];
  React.useEffect(()=>{ if(!availBtb.includes(btb)) setBtb(availBtb[0]||""); },[size,control,system,options.join(","),mechOptions.join(",")]);

  const inp = {...btbCandidatesInput, btb: btbManual ? btbManualName.trim() : btb, btbManual, btbManualColor: btbManual?btbManualColor.trim():""};
  let result=null, parts=[], calcError=null;
  try{
    if(size&&control&&system&&color&&tube&&btb&&(control!=="A"||(chainType&&csdType))&&Number(width)>0&&Number(height)>0){
      result = rulouCalc(inp);
      parts = rulouPartsList(inp, result, Number(qty)||1);
      if(btbManual && (!btbManualName.trim() || !btbManualColor.trim())){
        result.errs = [...(result.errs||[]), "Completează denumirea ȘI culoarea bottombar-ului manual — obligatoriu."];
      }
    }
  }catch(e){ calcError = "Verifică valorile introduse: "+e.message; }

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};
  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=buildRulouPrintHtml;
  const printParts=()=>{ if(!result) return; printHtmlDoc(buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:inp,qty,result,parts})); };
  const printSaved=(cfg)=>printHtmlDoc(buildPrintHtml(cfg));

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(result.errs&&result.errs.length>0){ alert("Nu poți salva — lipsesc opțiuni obligatorii sau valorile depășesc limitele sistemului:\n\n"+result.errs.join("\n")+"\n\nAlege ce lipsește și încearcă din nou."); return; }
    if(result.warns&&result.warns.length>0 && !window.confirm("Atenție:\n\n"+result.warns.join("\n")+"\n\nSigur vrei să salvezi oricum?")) return;
    if(!camera.trim() && !window.confirm("Nu ai completat Cameră (destinație). Salvezi oricum?\n\nApasă Anulează ca să o completezi întâi.")) return;
    if(camera.trim() && setCamereLista && !(camereLista||[]).some(cm=>cm.toLowerCase()===camera.trim().toLowerCase())){
      setCamereLista(p=>[...p,camera.trim()]);
    }
    if(fabricManual&&materialName.trim()){
      const upd=rulouUpsertMaterial(savedMateriale,{name:materialName,thickness:Number(fabricThickness),weight:Number(fabricWeight)});
      setSavedMateriale(upd);
    }
    const cfg={id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      qty:Number(qty)||1, input:inp, result, parts};
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiRulou:[...(c.configuratiiRulou||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator Rulou (Absolute Roller Blind)</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input list="camere-dl" value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
        <datalist id="camere-dl">{(camereLista||[]).map(cm=><option key={cm} value={cm}/>)}</datalist>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime montaj (mm)</label><input type="number" value={installHeight} onChange={e=>setInstallHeight(e.target.value)} placeholder="opțional" style={selStyle}/></div>
      <div><label style={lblStyle}>Mărime sistem</label>
        <select value={size} onChange={e=>setSize(e.target.value)} style={selStyle}>
          {rulouSizes().map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Sistem</label>
        <select value={system} onChange={e=>setSystem(e.target.value)} style={selStyle}>
          {systems.map(s=><option key={s} value={s}>{RULOU_SYSTEM_LABELS[s]||s}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Control</label>
        <select value={control} onChange={e=>setControl(e.target.value)} style={selStyle}>
          {controls.map(c=><option key={c} value={c}>{RULOU_CTRL_LABELS[c]||c}</option>)}
        </select>
      </div>
      {(control==="A"||control==="B")&&availMech.length>0&&<div><label style={lblStyle}>{control==="A"?"Mecanism":"Motor"}</label>
        <select value={mech} onChange={e=>setMech(e.target.value)} style={selStyle}>
          {availMech.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>}
      <div><label style={lblStyle}>Tub</label>
        <select value={tube} onChange={e=>setTube(e.target.value)} style={selStyle}>
          {availTubes.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare</label>
        <select value={color} onChange={e=>setColor(e.target.value)} style={selStyle}>
          {availColors.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Parte comandă</label>
        <select value={side} onChange={e=>setSide(e.target.value)} style={selStyle}>
          <option value="Left">Stânga</option>
          <option value="Right">Dreapta</option>
        </select>
      </div>
      <div><label style={lblStyle}>Cantitate</label><input type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)} style={selStyle}/></div>
    </div>

    {control==="A"&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lanț acționare</label>
        <select value={chainType} onChange={e=>setChainType(e.target.value)} style={selStyle}>
          {chainOptions.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Dispozitiv siguranță (CSD)</label>
        <select value={csdType} onChange={e=>setCsdType(e.target.value)} style={selStyle}>
          {csdOptions.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    </div>}
    {control==="I"&&pullOptions.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Tip acționare TwinPull</label>
        <select value={pullType} onChange={e=>setPullType(e.target.value)} style={selStyle}>
          {pullOptions.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    </div>}

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Țesătură</label>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button type="button" onClick={()=>setFabricManual(false)} style={{flex:1,fontSize:12,fontWeight:600,padding:"9px 8px",border:`1px solid ${!fabricManual?C.accent:C.border}`,background:!fabricManual?C.accentLight:C.surface,color:!fabricManual?C.accent:C.textSub,cursor:"pointer"}}>Din lista Coulisse</button>
        <button type="button" onClick={()=>setFabricManual(true)} style={{flex:1,fontSize:12,fontWeight:600,padding:"9px 8px",border:`1px solid ${fabricManual?C.accent:C.border}`,background:fabricManual?C.accentLight:C.surface,color:fabricManual?C.accent:C.textSub,cursor:"pointer"}}>✏️ Material propriu (manual)</button>
      </div>
      {!fabricManual&&<select value={fabricKey} onChange={e=>setFabricKey(e.target.value)} style={selStyle}>
        {RULOU_DATA.fabrics.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
      </select>}
      {fabricManual&&<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
          <div>
            <input list="rulou-materiale-dl" value={materialName} onChange={e=>{
              const v=e.target.value; setMaterialName(v);
              const m=savedMateriale.find(x=>x.name.toLowerCase()===v.trim().toLowerCase());
              if(m){ setFabricThickness(m.thickness); setFabricWeight(m.weight); }
            }} placeholder="Denumire material (ex: Blackout gri 320gr)" style={selStyle} autoFocus/>
            <datalist id="rulou-materiale-dl">{savedMateriale.map(m=><option key={m.name} value={m.name}/>)}</datalist>
          </div>
          <div><input type="number" step="0.01" value={fabricThickness} onChange={e=>setFabricThickness(e.target.value)} placeholder="grosime (mm)" style={selStyle}/></div>
          <div><input type="number" value={fabricWeight} onChange={e=>setFabricWeight(e.target.value)} placeholder="greutate (g/m²)" style={selStyle}/></div>
        </div>
        <div style={{marginTop:8}}>
          <button onClick={()=>{
            if(!materialName.trim()) return;
            const upd=rulouUpsertMaterial(savedMateriale,{name:materialName,thickness:Number(fabricThickness),weight:Number(fabricWeight)});
            setSavedMateriale(upd);
          }} disabled={!materialName.trim()} style={{fontSize:11,fontWeight:600,padding:"5px 12px",background:materialName.trim()?"#5C6B65":C.border,color:"#fff",border:"none",cursor:materialName.trim()?"pointer":"default"}}>💾 Salvează materialul (rămâne pentru altă dată)</button>
          {savedMateriale.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
            {savedMateriale.map(m=>
              <span key={m.name} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:C.textSub,background:C.bg,padding:"4px 4px 4px 10px"}}>
                <span style={{cursor:"pointer"}} onClick={()=>{setMaterialName(m.name);setFabricThickness(m.thickness);setFabricWeight(m.weight);}}>{m.name}</span>
                <button onClick={()=>{const upd=rulouDeleteMaterial(savedMateriale,m.name);setSavedMateriale(upd);}} title="Șterge materialul din memorie" style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,padding:"0 4px",lineHeight:1}}>×</button>
              </span>
            )}
          </div>}
        </div>
      </>}
    </div>

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Opțiuni (max 5) — bracket, profile, cabluri, oprire etc.</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {availOptions.map(opt=>
          <label key={opt} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer",opacity:(!options.includes(opt)&&options.length>=5)?0.4:1}}>
            <input type="checkbox" checked={options.includes(opt)} disabled={!options.includes(opt)&&options.length>=5} onChange={()=>toggleOption(opt)}/>
            {opt}
          </label>
        )}
      </div>
    </div>

    {otherAccessories.length>0&&<div style={{marginBottom:16}}>
      <label style={lblStyle}>Accesorii suplimentare</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {otherAccessories.map(a=>
          <label key={a} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer"}}>
            <input type="checkbox" checked={accessories.includes(a)} onChange={()=>toggleAccessory(a)}/>
            {a}
          </label>
        )}
      </div>
    </div>}

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Bottombar (contragreutate)</label>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button type="button" onClick={()=>setBtbManual(false)} style={{flex:1,fontSize:12,fontWeight:600,padding:"9px 8px",border:`1px solid ${!btbManual?C.accent:C.border}`,background:!btbManual?C.accentLight:C.surface,color:!btbManual?C.accent:C.textSub,cursor:"pointer"}}>Din lista Coulisse</button>
        <button type="button" onClick={()=>setBtbManual(true)} style={{flex:1,fontSize:12,fontWeight:600,padding:"9px 8px",border:`1px solid ${btbManual?C.accent:C.border}`,background:btbManual?C.accentLight:C.surface,color:btbManual?C.accent:C.textSub,cursor:"pointer"}}>✏️ Manual (nume + culoare)</button>
      </div>
      {!btbManual&&<select value={btb} onChange={e=>setBtb(e.target.value)} style={selStyle}>
        {availBtb.map(b=><option key={b} value={b}>{b}</option>)}
      </select>}
      {btbManual&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <input value={btbManualName} onChange={e=>setBtbManualName(e.target.value)} placeholder="Denumire bottombar" style={selStyle}/>
        <input value={btbManualColor} onChange={e=>setBtbManualColor(e.target.value)} placeholder="Culoare (ex: alb, negru, gri antracit)" style={selStyle}/>
      </div>}
    </div>

    {calcError&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{calcError}</div>}
    {result&&result.errs&&result.errs.length>0&&<div style={{background:"#5C2A2A",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>⛔ Lipsesc opțiuni obligatorii — nu poți salva:</div>
      {result.errs.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}
    </div>}
    {result&&result.warns.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>⚠ Atenție:</div>
      {result.warns.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}
    </div>}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>
      <div style={{padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol</div>
        <div style={{fontSize:14,fontWeight:600,color:C.text,wordBreak:"break-all"}}>{result.code}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[...(inp.materialName?[["Material",inp.materialName]]:[]),["Tub tăiat",result.tubeL+" mm"],["Lățime stofă",result.fabricW+" mm"],["Înălțime stofă",result.fabricH+" mm"],
          ["Bottombar",result.btbL+" mm"],["Diametru rulou",result.rolDiam+" mm"],["Cuplu",result.torque.toFixed(2)+" Nm"],
          ["Forță acționare",result.force.toFixed(2)+" kg"],
          ...(result.lprofile?[["Profil casetă (bază)",result.lprofile+" mm"]]:[]),
          ...(result.frontprofile?[["Profil casetă (față)",result.frontprofile+" mm"]]:[]),

function ComenziDan({client,ci,setClients,C,sb,tday,fmtD,field,folder,accept,buttonLabel,onlyImages}){
  const [uploading,setUploading]=React.useState(false);
  const inputRef=React.useRef(null);
  const fisiere=client[field]||[];
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const path=`${folder}/${client.id}/${Date.now()}_${file.name}`;
      const {error}=await sb.storage.from("oferte-clienti").upload(path,file);
      if(error){ alert("Eroare la încărcare: "+error.message); setUploading(false); return; }
      const {data}=sb.storage.from("oferte-clienti").getPublicUrl(path);
      setClients(p=>p.map((c,i)=>i!==ci?c:{...c,[field]:[...(c[field]||[]),{nume:file.name,url:data.publicUrl,path,data:tday()}]}));
    }catch(err){ alert("Eroare: "+err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value="";
  };
  const handleDelete=async(f)=>{
    if(!window.confirm(`Ștergi fișierul "${f.nume}"?`)) return;
    try{ await sb.storage.from("oferte-clienti").remove([f.path]); }catch{}
    setClients(p=>p.map((c,i)=>i!==ci?c:{...c,[field]:(c[field]||[]).filter(x=>x.path!==f.path)}));
  };
  return <div>
    {fisiere.map((f,i)=>{
      const ext=(f.nume.split(".").pop()||"").toLowerCase();
      const isImg=["jpg","jpeg","png","gif","webp","heic"].includes(ext);
      const office=["xlsx","xls","doc","docx","csv"].includes(ext);
      const openUrl=office?`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(f.url)}`:f.url;
      return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:C.bg,marginBottom:4}}>
        {isImg&&<img src={f.url} alt="" style={{width:36,height:36,objectFit:"cover",flexShrink:0}}/>}
        <a href={openUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:C.accent,flex:1,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isImg?"":<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-1px",marginRight:5}}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>}{f.nume}</a>
        <span style={{fontSize:10,color:C.textMuted,flexShrink:0}}>{fmtD(f.data)}</span>
        <button onClick={()=>handleDelete(f)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>;
    })}
    <input ref={inputRef} type="file" accept={accept} style={{display:"none"}} onChange={handleUpload}/>
    <button onClick={()=>inputRef.current?.click()} disabled={uploading} style={{fontSize:12,color:"#2A2118",border:"none",padding:"7px 12px",background:"#5C6B65",cursor:uploading?"default":"pointer",width:"100%"}}>{uploading?"Se încarcă...":buttonLabel}</button>
  </div>;
}

function TabDan({clients,setClients,sb,tday,fmtD,C,blocate,onAddBlocat,onDelBlocat,rulouMateriale,setRulouMateriale,camereLista,setCamereLista,contractCounter,setContractCounter,pvCounter,setPvCounter}){
  const [openId,setOpenId]=React.useState(null);
  const [danShowFin,setDanShowFin]=React.useState(false);
  const [contactOpen,setContactOpen]=React.useState({});
  const [clientDetailTab,setClientDetailTab]=React.useState({});
  const [calMonth,setCalMonth]=React.useState(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};});
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const ZILE_SCURT=["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const todayKey=tday();
  const danClients=clients.filter(c=>c.alocatDan && (danShowFin ? c.stadiu==="finalizat" : c.stadiu!=="finalizat")).sort((a,b)=>a.name.localeCompare(b.name,"ro"));
  const client=clients.find(c=>c.id===openId);
  const ci=client?clients.indexOf(client):-1;

  const montajeByDay={};
  danClients.forEach(c=>{if(c.dataMontaj) (montajeByDay[c.dataMontaj]=montajeByDay[c.dataMontaj]||[]).push({name:c.name,ora:c.oraMontaj||""});});

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10,fontWeight:600}}>Programare montaje</div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:10}}>
      <button onClick={()=>setCalMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[calMonth.m]} {calMonth.y}</div>
      <button onClick={()=>setCalMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
      {ZILE_SCURT.map(z=><div key={z} style={{textAlign:"center",fontSize:10,color:C.textMuted,fontWeight:600}}>{z}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:20}}>
      {(()=>{
        const first=new Date(calMonth.y,calMonth.m,1);
        const offset=(first.getDay()+6)%7;
        const total=daysInM(calMonth.y,calMonth.m);
        const cells=[];
        for(let i=0;i<offset;i++) cells.push(<div key={`e${i}`}/>);
        for(let day=1;day<=total;day++){
          const key=keyFor(calMonth.y,calMonth.m,day);
          const isToday=key===todayKey;
          const nume=montajeByDay[key]||[];
          const dow=new Date(calMonth.y,calMonth.m,day).getDay();
          const isWeekend=dow===0||dow===6;
          const blocat=(blocate||[]).find(z=>key>=z.dataStart&&key<=(z.dataEnd||z.dataStart));
          let bg=nume.length?"#5C6B65":C.bg, textCol=nume.length?"rgba(255,255,255,0.75)":C.textMuted;
          if(isWeekend){bg="#DDD6C8";textCol="#A89E8C";}
          if(blocat){bg="#B8A88F";textCol="#fff";}
          cells.push(<div key={key} style={{minHeight:56,padding:"4px 5px",background:bg,border:isToday?`1.5px solid ${C.text}`:`1px solid ${C.border}`,overflow:"hidden"}}>
            <div style={{fontSize:11,fontWeight:isToday?700:400,color:textCol,marginBottom:2}}>{day}</div>
            {blocat?<div style={{fontSize:9,color:"#fff",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{blocat.motiv||"Blocat"}</div>:
             nume.map((n,i)=><div key={i} style={{fontSize:10,color:"rgba(255,255,255,0.95)",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n.ora?`${n.ora} `:""}{n.name}</div>)}
          </div>);

        return cells;

    </div>

        <span style={{fontSize:12,fontWeight:500,color:C.text,wordBreak:"break-word"}}>{c.name}</span>

        <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{client.name}</div>
