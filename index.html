function excelOdd(x){
  const c = Math.ceil(Math.abs(x));
  const odd = (c%2===0) ? c+1 : c;
  return x<0 ? -odd : odd;
}

// Excel SEARCH-style wildcard match: ? = any 1 char, * = any sequence, case-insensitive substring
function wildcardMatch(pattern, text){
  if(pattern==="" || pattern==null) return true; // empty pattern = always matches (like Excel SEARCH(""))
  if(pattern==="@") return true; // "@" used in sheet as "any / no constraint"
  const esc = pattern.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\?/g,".").replace(/\*/g,".*");
  return new RegExp(esc, "i").test(text);
}

function getPartsList(articleCode, calcResult, numberOfSystems){
  const mult = numberOfSystems||1;
  return PARTS.map(p=>{
    const used = p.used.some(pat=>wildcardMatch(pat, articleCode));
    if(!used) return null;
    const excluded = p.excl.some(pat=>wildcardMatch(pat, articleCode));
    if(excluded) return null;
    const colourOk = !p.colourCode || wildcardMatch(p.colourCode, articleCode);
    if(!colourOk) return null;
    const qty = p.qty(calcResult)*mult;
    if(!qty || qty<=0) return null;
    return {code:p.code, desc:p.desc, colour:p.colour, qty: Math.round(qty*100)/100};
  }).filter(Boolean);
}

function rulouPat2Test(pat){
  // Excel SEARCH-style: ? = 1 char, * = any, case-insensitive substring; empty = always match
  return (text)=>wildcardMatch(pat, text);
}
function rulouSrch(pat, text){ return wildcardMatch(pat, text); }

function rulouName2Code(name){
  for(const [code,disp] of Object.entries(RULOU_DATA.tb4codes)){
    if(disp===name) return code;
  }
  return null;
}
const RULOU_NAME2CODE = (()=>{ const m={}; for(const [code,disp] of Object.entries(RULOU_DATA.tb4codes)){ if(disp && disp!=="@" && !(disp in m)) m[disp]=code; } return m; })();

function rulouColorCode(name){
  const c = RULOU_DATA.colorCodes.find(x=>x.name===name);
  return c?c.code:null;
}
function rulouMargin3(w, arr){
  const m = RULOU_DATA.margins;
  if(w < m.w1) return arr[0];
  if(w <= m.w2) return arr[1];
  return arr[2];
}
function rulouPad(n){ return String(Math.round(n)); }
function rulouWtok(w){ let k=Math.round(w), s="W"; if(k<100) s+="0"; if(k<1000) s+="0"; return s+k+"-"; }
function rulouHtok(h){ let k=Math.round(h), s="H"; if(k<1000) s+="0"; return s+k+"-"; }
function rulouMHtok(mh){ if(!mh) return "MH9999-"; let k=Math.round(mh), s="MH"; if(k<1000) s+="0"; return s+k+"-"; }

function rulouMotorByName(name){
  const code = RULOU_NAME2CODE[name];
  if(!code) return null;
  return RULOU_DATA.motorDeductions.find(m=>code.startsWith(m.code)||m.code.startsWith(code)) || null;
}
function rulouFabricProps(inp){
  if(inp.fabricManual) return {thickness:Number(inp.fabricThickness), weight:Number(inp.fabricWeight)};
  const f = RULOU_DATA.fabrics.find(x=>x.name===inp.fabric);
  return f ? {thickness:f.thickness, weight:f.weight} : {thickness:0.45, weight:350};
}
function rulouBtbInfo(name){ return RULOU_DATA.bottombars.find(b=>b.name===name) || null; }

function rulouBuildCode(inp){
  const cfg = `RC-${inp.size}${inp.control}${inp.system}`;
  let parts = [cfg, "-", rulouWtok(inp.width), rulouHtok(inp.height), rulouMHtok(inp.installHeight)];
  const cc = rulouColorCode(inp.color);
  parts.push((cc||"")+"-");
  parts.push(inp.side==="Left"?"QL-":(inp.side==="Right"?"QR-":""));
  const optCodes = [];
  for(const o of (inp.options||[])){ const c = RULOU_NAME2CODE[o]; if(c) optCodes.push(c+"-"); }
  parts = parts.concat(optCodes);
  const optJoin = optCodes.join("");
  const explicitPin = /BST|HBP|ABP|FBP/.test(optJoin);
  let autoPin = "";
  if(!explicitPin && !/RC-(SC|MC|MH|LC)/.test(cfg)){
    const hbp = /RC-LB1/.test(cfg) || /RC-LB3/.test(cfg) || (cfg.includes("RC-LB70") && !cfg.includes("RC-LB70M"));
    autoPin = hbp ? "HBP-" : "FBP-";
  }
  parts.push(autoPin);
  if(inp.mech){ const mc = RULOU_NAME2CODE[inp.mech]; if(mc) parts.push(mc+"-"); }
  if(inp.tube){ const tc = RULOU_NAME2CODE[inp.tube]; if(tc) parts.push(tc+"-"); }
  for(const mo of (inp.mechOptions||[])){ const c = RULOU_NAME2CODE[mo]; if(c) parts.push(c+"-"); }
  let fabcode = null;
  if(inp.fabricManual) fabcode = "FABMN-";
  else { const f = RULOU_DATA.fabrics.find(x=>x.name===inp.fabric); if(f) fabcode = f.code; }
  if(fabcode) parts.push(fabcode);
  if(inp.btb){ const b = RULOU_DATA.bottombars.find(x=>x.name===inp.btb); if(b) parts.push(b.code); }
  return parts.join("");
}

function rulouRollTable(inp, tubeDia, thickness, weight, btbWperM, isDR){
  const W=inp.width, H=inp.height, minW=RULOU_DATA.margins.minWindings;
  const rows=[]; let Kprev=null, L=null, L0=null;
  let i=0; 
  for(let idx=0; idx<112; idx++){
    const J = tubeDia + thickness*2*(i+minW);
    let K, Lc;
    if(idx===0){ K = J*Math.PI; Lc = K*minW; L0 = Lc; }
    else { K = (Math.abs(i-Math.round(i))<1e-9) ? J*Math.PI : Kprev; Lc = 0.5*Kprev + L; }
    const M = (Lc - L0) * (isDR?0.5:1);
    const N = Math.max(0, H-M);
    const P = (J/2/1000)*9.81*((btbWperM/1000*W/1000) + ((W/1000*N/1000)*weight/1000));
    rows.push({i,J,K,L:Lc,M,N,P});
    Kprev=K; L=Lc; i+=0.5;
  }
  let d22=0;
  for(let k=0;k<rows.length;k++){ if(rows[k].M<=H) d22=k; }
  d22 = Math.min(d22+1, rows.length-1);
  const diam = rows[d22].J * (isDR?RULOU_DATA.doubleRollerDiamFactor:1);
  const fabricLen = rows[d22].L;
  const withFabric = rows.filter(r=>r.N>0);
  const torque = withFabric.length ? Math.max(...withFabric.map(r=>r.P)) : 0;
  const halfTurns = withFabric.length;
  const npos = rows.map((r,k)=>r.N>0?k:-1).filter(k=>k>=0);
  const T = [];
  for(let rank=1; rank<=npos.length; rank++){ T.push(rows[npos[npos.length-rank]].P); }
  return {diam, fabricLen, torque, halfTurns, T, rows};
}

function rulouCalc(inp){
  const W=Number(inp.width), H=Number(inp.height), MH=Number(inp.installHeight||0);
  const cfg = `RC-${inp.size}${inp.control}${inp.system}`;
  const code = rulouBuildCode(inp);
  const ded = RULOU_DATA.tabel66[cfg];
  if(!ded) throw new Error("Configurație necunoscută: "+cfg);

  function dval(x){
    if(x && typeof x==="object" && x.f){
      const f=x.f;
      if(f.includes("$E$198")){ const m=rulouMotorByName(inp.mech); return m?m.thickMech:0; }
      if(f.includes("$E$140")){ return code.includes("BST") ? 8.9 : 3.5; }
      return 0;
    }
    if(x==="@"||x==null) return 0;
    return Number(x);
  }
  const endcapM=dval(ded.endcapMech), mechD=dval(ded.mech), contraD=dval(ded.contra), endcapC=dval(ded.endcapContra);
  const abpExtra = code.includes("ABP") ? RULOU_DATA.pins.ABP.extraCut : 0;
  const tubeCutMech = endcapM+mechD, tubeCutContra = contraD+endcapC+abpExtra;
  const tubeL = Math.round(W - tubeCutMech - tubeCutContra - 1);

  const y20 = rulouMargin3(W, RULOU_DATA.margins.tubeFabric)/2;
  const stdM = tubeCutMech+y20, stdC = tubeCutContra+y20;
  const numOrZero = (v)=> (v==="@"||v==null||typeof v==="object") ? 0 : Number(v);
  const iv = numOrZero(ded.minWidth), jv = numOrZero(ded.j);
  const bloM = code.includes("BLO") ? iv/2 : 0;
  const proM = code.includes("PRO") ? jv/2 : 0;
  const fabricW = W - Math.max(stdM,bloM,proM) - Math.max(stdC,bloM,proM) - 1.5;

  const {thickness, weight} = rulouFabricProps(inp);
  const bt = rulouBtbInfo(inp.btb);
  const isDR = code.includes("DR") && (inp.options||[]).includes("Double Roller fabric");
  const btbW = (bt?bt.weight:1) * (isDR?0.5:1);
  const tm = /RTU-(\d+)/.exec(inp.tube);
  const tubeDia = tm ? Number(tm[1]) : 0;
  const roll = rulouRollTable(inp, tubeDia, thickness, weight, btbW, isDR);
  const fabricH = roll.fabricLen;

  let btbL;
  if(bt && bt.code==="BTB02") btbL = W - Number(bt.cutoff);
  else if(bt && bt.cutoff==="x") btbL = 0;
  else { const z45 = (bt?Number(bt.cutoff):0) - rulouMargin3(W, RULOU_DATA.margins.fabricBtb); btbL = fabricW - z45; }

  const lp=ded.lprofile, cov=ded.cover, mnt=ded.mounting;
  let lpv=null;
  if(lp && typeof lp==="object") lpv = endcapC+endcapM;
  else if(lp!=="@" && lp!=null) lpv = Number(lp);
  const lprofile = lpv!=null ? (W-lpv) : 0;
  let cv=null;
  if(typeof cov==="number") cv=cov;
  else if(cov && typeof cov==="object"){
    const f=cov.f; const base = lpv!=null?lpv:0;
    if(f.includes("Kolom9]]+10")) cv = base+10;
    else if(f.includes("Kolom9]]+20")) cv = base+20;
    else if(f.includes("Kolom9]]")) cv = base;
  }
  const frontprofile = cv!=null ? (W-cv) : 0;
  const mv = (mnt==="@"||mnt==null||typeof mnt==="object") ? null : Number(mnt);
  const mountingprofile = mv!=null ? (W-mv) : 0;

  let sideprofile=0, screws=0, bottomprofile=0, sidecable=0;
  if(code.includes("PR") && /PRO[1-4]/.test(code)){
    let dsum=0;
    for(const rd of RULOU_DATA.sideProfileDeductions){
      const target = rd.cfgMatch ? cfg : code;
      if(wildcardMatch(rd.pat, target)) dsum += rd.d;
    }
    sideprofile = H - dsum - RULOU_DATA.sideProfileBottomEndcap;
    screws = sideprofile>0 ? (Math.ceil((sideprofile-200)/600)+1)*2 : 0;
    if(/PRO[34]/.test(code)) bottomprofile = W - RULOU_DATA.bottomGuideDeduct;
  }
  if(code.includes("BL") && /BLO[12]|BLA[12]/.test(code)) sidecable = H + RULOU_DATA.sideCableExtra;

  let chain=0;
  if(MH){
    let tot=0;
    for(const [tok,delta] of Object.entries(RULOU_DATA.chainRules.known)){ if(code.includes(tok)) tot += (MH+delta); }
    chain = tot*2;
  } else {
    let tot=0;
    for(const [tok,ru] of Object.entries(RULOU_DATA.chainRules.unknown)){
      if(code.includes(tok)) tot += (ru==="twoThirdsH" ? (2/3*H) : ru);
    }
    chain = tot*2;
  }
  chain = Math.round(chain);

  let clips=0;
  if(!/RC-..10/.test(cfg) && !/L.7/.test(cfg)) clips = Math.ceil((W-100)/RULOU_DATA.clipsMaxDist)+1;
  const midsupport = Math.max(0, Math.ceil((W-1999)/RULOU_DATA.damperMaxDist));
  const vibration = Math.ceil((W-1500)/RULOU_DATA.damperMaxDist)+1;

  // springassist
  const spa = code.includes("SPA");
  let spaPre=null, spaTorque=null;
  if(spa && roll.T.length){
    const k = RULOU_DATA.springAssist.k, T=roll.T, H2=roll.halfTurns;
    const maxT = Math.max(...T);
    let p=0;
    for(let kk=0; kk<roll.rows.length; kk++){ if((0.5*kk)*k <= maxT) p = kk+1; }
    const shift = p/2 - H2/2;
    const v = shift * RULOU_DATA.springAssist.preFactor;
    spaPre = v>=0 ? Math.floor(v+0.5) : -Math.floor(-v+0.5);
    const bh=[]; for(let kk=0; kk<Math.min(H2,T.length); kk++){ bh.push(T[kk] - ((0.5*kk)+spaPre)*k); }
    spaTorque = bh.length ? Math.max(...bh) : 0;
  }
  const effTorque = (spa && spaTorque!=null) ? spaTorque : roll.torque;
  let force=0;
  for(const ff of RULOU_DATA.forceFactors){ if(wildcardMatch(ff.pat, code)) force += effTorque*ff.f; }

  const cfgd = RULOU_DATA.configs[cfg];
  const warns=[]; const errs=[];
  const maxRoll = numOrZero(ded.maxRoll) || null;
  if(maxRoll && roll.diam>maxRoll) warns.push(`Diametrul ruloului (${roll.diam.toFixed(1)}mm) depășește maximul sistemului (${maxRoll}mm) — alege alt sistem/țesătură.`);
  const tp = RULOU_DATA.tubePhysics.find(t=>t.name===inp.tube);
  let defl=null;
  if(tp){
    const q = (btbW/100000) + ((weight/100000000)*H) + (tp.weight/100000);
    defl = 5*q*Math.pow(W,4) / (384*tp.I*tp.E);
    if(defl > RULOU_DATA.margins.maxDeflection) warns.push(`Tubul ${inp.tube} se încovoaie ${defl.toFixed(1)}mm (max ${RULOU_DATA.margins.maxDeflection}mm) — alege un tub mai mare.`);
  }
  let minTW=200;
  for(const ru of RULOU_DATA.minTubeWidthRules){
    if(ru.pat==="other") continue;
    if(wildcardMatch(ru.pat, code)){
      if(ru.w==="motor"){ const m=rulouMotorByName(inp.mech); minTW = m ? (m.insertDepth+RULOU_DATA.motorMinTubeExtra) : 0; }
      else minTW = ru.w;
      break;
    }
  }
  if(minTW && tubeL<=minTW) errs.push(`Lățime prea mică: tubul (${tubeL}mm) trebuie să fie > ${minTW}mm pentru mecanismul ales.`);
  if(cfgd && cfgd.maxW && W>cfgd.maxW) errs.push(`Lățimea depășește maximul sistemului (${cfgd.maxW}mm).`);
  if(cfgd && cfgd.maxH && H>cfgd.maxH) errs.push(`Înălțimea depășește maximul sistemului (${cfgd.maxH}mm).`);
  if(code.includes("SPA") && (W<500 || H>3500)) errs.push("Springassist: lățime min. 500mm, înălțime max. 3500mm.");
  if(H/W>3) warns.push("Raport H:L peste 3:1 — verifică stabilitatea.");
  if(roll.halfTurns/2 > 18*(isDR?2:1)) errs.push("Numărul de rotații depășește limita mecanismului (18).");

  const isChainCfg = /RC-.?A/.test(cfg);
  if(isChainCfg && !/CH(P|M|EP|EM|K)/.test(code)) errs.push("Alege un lanț de acționare (Plastic/Metal ballchain) — obligatoriu, fără el ruloul nu poate fi acționat.");
  if(isChainCfg && !code.includes("CSD")) errs.push("Alege un dispozitiv de siguranță copii (CSD) — obligatoriu.");
  const needsBracket = inp.system==="10" || inp.system==="11" || String(inp.system).startsWith("7");
  const hasJ = (inp.options||[]).some(o=>{ const c=RULOU_NAME2CODE[o]; return c && c.startsWith("J"); });
  if(needsBracket && !hasJ) errs.push("Alege un bracket (opțiunile J) — obligatoriu pentru acest sistem.");

  const dayNight = RULOU_DATA.dayNightPatterns.some(p=>wildcardMatch(p, code));
  let bstX=null;
  if(code.includes("BST")) bstX = code.includes("BU38") ? RULOU_DATA.bstX.BU38 : RULOU_DATA.bstX.other;

  return {code, cfg, spaPre, bstX,
    tubeL, fabricW:Math.round(fabricW*10)/10, fabricH:Math.round(fabricH*10)/10, btbL:Math.round(btbL*10)/10,
    lprofile:Math.round(lprofile*10)/10, frontprofile:Math.round(frontprofile*10)/10, mountingprofile:Math.round(mountingprofile*10)/10,
    sideprofile:Math.round(sideprofile*10)/10, bottomprofile:Math.round(bottomprofile*10)/10, sidecable:Math.round(sidecable*10)/10,
    screws, chain, clips, midsupport, vibration,
    rolDiam:Math.round(roll.diam*10)/10, torque:roll.torque, effTorque, force,
    defl, warns, errs, dayNight, isDR};
}

function rulouPartsList(inp, res, qty){
  qty = qty||1;
  const code = res.code, dn = res.dayNight;
  const RULOU_INFO_ONLY = new Set(["Fabric - Height","Fabric - M2","Fabric - Width"]); // rânduri informative Excel, nu sunt componente de comandat
  const out = [];
  for(const p of RULOU_DATA.parts){
    if(RULOU_INFO_ONLY.has(p.a)) continue;
    const okUsed = p.uAny || p.u.some(u=>wildcardMatch(u, code));
    if(!okUsed) continue;
    if(p.x.some(x=>wildcardMatch(x, code))) continue;
    const okCol = p.cAny || p.c.some(c=>wildcardMatch(c, code));
    if(!okCol) continue;
    const mult = (dn && RULOU_DATA.multiplier.DN[p.m]!=null) ? RULOU_DATA.multiplier.DN[p.m] : 1;
    let base = p.q;
    if(p.qf){
      const f = p.qf;
      const map = {
        "=BottombarWidth/conv_partslist": res.btbL/1000,
        "=(BottombarWidth-30)/conv_partslist": (res.btbL-30)/1000,
        "=LprofileWidth/conv_partslist": res.lprofile/1000,
        "=LprofileWidth/1000*DecImperialConversion": res.lprofile/1000,
        "=FrontprofileWidth/conv_partslist": res.frontprofile/1000,
        "=MountingProfileLength/conv_partslist": res.mountingprofile/1000,
        "=TubeLength/conv_partslist": res.tubeL/1000,
        "=TubeLengthLeft/conv_partslist": res.tubeL/1000,
        "=SideprofileHeight/conv_partslist*2": res.sideprofile/1000*2,
        "=SideprofileHeight/conv_partslist*4": res.sideprofile/1000*4,
        "=SideprofileHeight/conv_partslist": res.sideprofile/1000,
        "=Bottomprofilewidth/conv_partslist": res.bottomprofile/1000,
        "=Bottomprofilewidth/conv_partslist*2": res.bottomprofile/1000*2,
        "=SideCableHeight/conv_partslist*2": res.sidecable/1000*2,
        "=SideCableHeight/conv_partslist": res.sidecable/1000,
        "=ChainLength/conv_partslist": res.chain/1000,
        "=FabricHeight/conv_partslist": res.fabricH/1000,
        "=FabricWidth/conv_partslist": res.fabricW/1000,
        "=(FabricHeight*FabricWidth)/(conv_partslist^2)": res.fabricH*res.fabricW/1e6,
        "=ClipsQuantity": res.clips,
        "=midsupportQuantity": res.midsupport,
        "=VibrationQuantity": res.vibration,
        "=Calculations!X68": res.screws,
      };
      if(f in map) base = map[f];
      else if(f==="=IF(CHK.TWINPULL,2,1)") base = code.includes("RC-MI")?2:1;
      else if(f.startsWith('=IF(IFERROR(SEARCH("RC-M?5"')) base = /RC-M.5/.test(code)?2:1;
      else base = 0;
    }
    if(!base) continue;
    const q = base*mult*qty;
    if(!q) continue;
    out.push({article:p.a, desc:p.d, qty: Math.round(q*10000)/10000});
  }
  return out;
}

    if(row[size]===1 && ["10","11","30","30-pull","31","31-pull","50","51","70","70M","71"].includes(sys)) out.push(sys);

const RULOU_SYSTEM_LABELS = {"10":"10 - Bracket","11":"11 - Bracket + profile","30":"30 - Cass. round",
  "30-pull":"30 - Motorised Cass. round","31":"31 - Cass. square","31-pull":"31 - Motorised Cass. Square",
  "50":"50 - DayNight Vertical","51":"51 - DayNight univ.","70":"70 - Facia","70M":"70M - Facia 4\"","71":"71 - Facia Day/Night"};
function rulouControlsForSize(size, system){
  const tab = RULOU_DATA.controlsBySizeSystem[size];
  if(!tab) return [];
  const out=[];
  for(const [ctrl,row] of Object.entries(tab)){
    if(["A","B","I"].includes(ctrl) && row[system]===1) out.push(ctrl);
  }
  return out;
}
const RULOU_CTRL_LABELS = {A:"Lanț", B:"Motorizat", I:"TwinPull"};
function rulouCfgKey(size,control,system){ return `RC-${size}${control}${system}`; }
function rulouCfgFlags(size,control,system){
  const c = RULOU_DATA.configs[rulouCfgKey(size,control,system)];
  return c ? c.fl : {};
}
function rulouOptionsAvailable(size,control,system){
  const fl = rulouCfgFlags(size,control,system);
  return RULOU_DATA.optionsFieldCodes.filter(c=>fl[c]===1).map(c=>RULOU_DATA.tb4codes[c]);
}
const RULOU_MECHOPT_EXCLUDE_PREFIX = ["CM","K1","K2","K3","QCMTD","QMCMTD","MCMTD","CMTD","DR"];
function rulouMechOptionsAvailable(size,control,system){
  const fl = rulouCfgFlags(size,control,system);
  const codes = Object.keys(fl).filter(c=>fl[c]===1 && !RULOU_MECHOPT_EXCLUDE_PREFIX.some(p=>c.startsWith(p)));
  const known = new Set(["CHEM","CHEP","CHM","CHP","CSD08","CSD11","CSD18","CSD23","CSD24","CSD27","SPA",
    "PUL1","PUL2","PUL3","PUL4","PUL5","PUL6","PUL7","PUL8","PWR7","RM2"]);
  return codes.filter(c=>known.has(c)).map(c=>RULOU_DATA.tb4codes[c]);
}
function rulouMechMotorsAvailable(size,control,system){
  const fl = rulouCfgFlags(size,control,system);
  if(control==="I") return [];
  return RULOU_DATA.controls9.filter(c=>{
    if(control==="A") return /^Mechanism/.test(c.name);
    return !/^Mechanism/.test(c.name);
  }).filter(c=>{
    const code = RULOU_NAME2CODE[c.name];
    return code && fl[code]===1;
  }).map(c=>c.name);
}
function rulouTubesAvailable(size,control,system, mechName){
  const fl = rulouCfgFlags(size,control,system);
  let tubes = RULOU_DATA.tubes7.filter(t=>{
    const key = "BU"+t.name.replace("RTU-","")+((t.name==="RTU-38")?"T":"");
    return fl[key]===1;
  }).map(t=>t.name);
  if(mechName){
    const mc = RULOU_DATA.controls9.find(c=>c.name===mechName);
    if(mc) tubes = tubes.filter(tn=>mc.tubeCompat[tn]===1 || mc.tubeCompat[tn+"-2G"]===1);
  }
  return tubes;
}
function rulouColorsAvailable(size,control,system, options){
  const cfg = RULOU_DATA.configs[rulouCfgKey(size,control,system)];
  if(!cfg) return [];
  let grp = cfg.cg1;
  const optCodes = (options||[]).map(o=>RULOU_NAME2CODE[o]);
  if(optCodes.includes("J4") || optCodes.includes("J6")) grp = cfg.cg2 || grp;
  else if(optCodes.includes("J7")) grp = 5;
  else if(optCodes.some(c=>c && c.startsWith("PRO"))) grp = 1;
  return (RULOU_DATA.colorGroups[grp]||[]);
}
function rulouBottombarsAvailable(codeSoFar){
  return RULOU_DATA.bottombars.filter(b=>{
    const used = b.usedIn.some(u=>wildcardMatch(u, codeSoFar));
    if(!used) return false;
    const excl = b.excludeIn.some(x=>wildcardMatch(x, codeSoFar));
    return !excl;
  }).map(b=>b.name);
}

// ---------- persistent custom materials (manual fabric) — introduse manual, rămân salvate (sincronizate în Supabase, ca restul aplicației) ----------
function rulouUpsertMaterial(list, mat){
  const name = (mat.name||"").trim();
  if(!name) return list;
  const i = list.findIndex(m=>m.name.toLowerCase()===name.toLowerCase());
  const entry = {name, thickness:mat.thickness, weight:mat.weight};
  if(i>=0){ const copy=list.slice(); copy[i]=entry; return copy; }
  return [...list, entry];
}
function rulouDeleteMaterial(list, name){
  return list.filter(m=>m.name.toLowerCase()!==(name||"").toLowerCase());
}

function romanValidate(input){
  const {width, height, mechKey} = input;
  const mech = RS_MECH[mechKey];
  const errors=[], warnings=[];
  if(mech && width<mech.minWidth){
    errors.push(`Lățimea (${width}mm) e sub minimul pentru ${mechKey} (${mech.minWidth}mm).`);
  }
  if(width>3600){
    errors.push(`Lățimea (${width}mm) depășește maximul admis (3600mm).`);
  }
  if(height>3500){
    errors.push(`Înălțimea (${height}mm) depășește maximul admis (3500mm).`);
  }
  return {errors, warnings};
}

function romanCalc(input){
  const {width,height,installHeight,mechKey,fabricKey,controlSide,cordsSpools,options} = input;
  const mech = RS_MECH[mechKey];
  const isMotor = mechKey==="RSC-B10 motorised";
  const isTwin = mechKey==="RSC-I10 twin pull";
  const optCodesRaw = (options||[]).map(o=>rsMechOptCode(mechKey,o)).filter(Boolean);
  const optCodes = (isMotor && !optCodesRaw.includes("CM07")) ? ["CM07",...optCodesRaw] : optCodesRaw;

  const tubelength = width - mech.tubeDed;
  const profilelength = width - mech.profileDed;
  const btbrailLength = width - mech.midrailDed;

  const battShort = isMotor && optCodes.includes("PWR7");
  const overhang = isMotor ? (battShort?160:20) : mech.spoolOverhang;
  const maxDistSpools=500;
  const spoolsRaw = Math.ceil((width-2*overhang)/maxDistSpools);
  const spoolsAuto = spoolsRaw<=1 ? 2 : spoolsRaw;
  const numberSpools = (cordsSpools==="Auto"||!cordsSpools) ? spoolsAuto : Number(cordsSpools);

  const maxDistClips=800, overhangClips=100;
  const clipsRaw = Math.ceil((width-2*overhangClips)/maxDistClips);
  const numberClips = clipsRaw===1?2:clipsRaw+1;

  let tiltrod1, tiltrod2=null;
  if(isMotor){
    if(battShort){
      const j33 = width<750?180:230;
      const j32 = profilelength - j33 - (2*overhang) - 80;
      tiltrod1 = j32; tiltrod2 = j33;
    } else {
      tiltrod1 = spoolsAuto%2===0 ? tubelength/2 : (tubelength/2)-(0.5*maxDistSpools);
      tiltrod2 = tubelength - tiltrod1;
    }
  } else {
    tiltrod1 = tubelength;
  }

  // lungime lanț adăugată de anumite dispozitive de siguranță (CSD04/06/07/11) — formulă exactă din Excel
  let chainlen = 0;
  if(installHeight){
    for(const t of ["CSD07","CSD04","CSD06"]) if(optCodes.includes(t)) chainlen += (installHeight-1500);
    for(const t of ["CSD11","K3"]) if(optCodes.includes(t)) chainlen += (2/3*height);
  } else {
    for(const t of ["CSD07","CSD04","CSD06"]) if(optCodes.includes(t)) chainlen += 1000;
    for(const t of ["CSD11","K3"]) if(optCodes.includes(t)) chainlen += (2/3*height);
  }

  const widthCode="W"+(width<1000?"0":"")+width+"-";
  const heightCode="H"+(height<1000?"0":"")+height+"-";
  const mhCode="MH"+(installHeight?(installHeight<1000?"0":""):"9999")+(installHeight||"")+"-";
  const controlCode=isMotor?"":(RS_CONTROL_SIDE[controlSide]||"");
  const fabricCode=RS_FABRICS[fabricKey];
  const optSeg = optCodes.map(c=>c+"-").join("");

  const articleCode = mech.code+"-"+widthCode+heightCode+mhCode+optSeg+"SPL"+numberSpools+"-"+(controlCode?controlCode+"-":"")+fabricCode;

  return {articleCode, headrail:Math.round(profilelength), tiltrod1:Math.round(tiltrod1), tiltrod2:tiltrod2?Math.round(tiltrod2):null,
    bottombar:Math.round(btbrailLength), spools:numberSpools, clips:numberClips, chainlen, isMotor, isTwin, optCodes, mech};
}

function getRomanPartsList(articleCode, calcResult){
  return PARTS_ROMAN.map(p=>{
    const used = p.used.some(pat=>wildcardMatch(pat, articleCode));
    if(!used) return null;
    const excluded = p.excl.some(pat=>wildcardMatch(pat, articleCode));
    if(excluded) return null;
    const qty = p.qty(calcResult);
    if(!qty || qty<=0) return null;
    return {code:p.code, desc:p.desc, colour:p.colour, qty: Math.round(qty*100)/100};
  }).filter(Boolean);
}

function validateCoulisseInput(input){
  const {width, railSegments, packKey} = input;
  const pack = PACK_SIDES[packKey];
  const rs = Number(railSegments);
  const errors=[], warnings=[];
  if(width<400){
    errors.push(`Lățimea (${width}mm) e sub minimul admis de sistem (400mm).`);
  }
  if(width>10000){
    errors.push(`Lățimea (${width}mm) depășește maximul admis de sistem (10000mm).`);
  }
  if(input.height>5000){
    errors.push(`Înălțimea (${input.height}mm) depășește maximul admis de sistem (5000mm).`);
  }
  if(width>5800 && rs===1){
    errors.push(`Lățimea (${width}mm) depășește lungimea maximă a unei șine dintr-o bucată (5800mm). Alege minim 2 segmente de șină.`);
  }
  const uzuraNecentralaMultiSeg = rs>=2 && pack && !pack.center;
  const uzuraCentrala3Seg = pack && pack.center && rs===3;
  if(uzuraNecentralaMultiSeg){
    warnings.push(`Cu șină în ${rs} segmente și împachetare ${packKey} (nu centrală), căruciorul principal trece peste îmbinarea șinei — risc de uzură/blocare. Se recomandă "Center opening" pentru șine îmbinate.`);
  } else if(uzuraCentrala3Seg){
    warnings.push(`Chiar și cu deschidere centrală, la 3 segmente de șină un cărucior tot traversează o îmbinare — risc de uzură/blocare. Recomandat maxim 2 segmente.`);
  }
  return {errors, warnings};
}

function coulisseCalc(input){
  const {width, height, motorKey, gliderKey, packKey, colourKey, railSegments, options} = input;
  const motor = MOTORS[motorKey];
  const glider = GLIDER_TYPES[gliderKey];
  const pack = PACK_SIDES[packKey];
  const colourCode = COLOURS[colourKey];
  const motorized = motor.prefix.startsWith("CC-B");
  const center = pack.center;

  const railOffset = motor.railOffset;
  const rail = width - railOffset;
  const belt = motorized ? (width*2 + motor.beltOffset) : 0;

  let glidersRaw;
  if(glider.type==="pleat"){
    const spacing = 1000/(glider.perMeter-1);
    glidersRaw = center ? Math.ceil(width/spacing/2) : Math.ceil(width/spacing);
  } else {
    glidersRaw = center ? excelOdd(width/glider.spacing/2) : excelOdd(width/glider.spacing);
  }
  const gliders = glidersRaw;
  const hooks = center ? gliders+1 : (glider.type==="pleat" ? gliders+2 : gliders+1);

  const D53 = 500;
  const brackets = railSegments===2
    ? Math.ceil((((width-(motor.firstBracket*2))/D53)+1)/2)*2
    : Math.ceil((width-(motor.firstBracket*2))/D53)+1;

  const stackwidth = motor.endcapW + 43 + gliders*glider.pitch;

  const configCode = motor.prefix + glider.digit + pack.digit;
  const widthCode = "W"+(width<1000?"0":"")+width+"-";
  const heightCode = "H"+(height<1000?"0":"")+height+"-";
  const railSegCode = railSegments===2?"SGM2-":(railSegments===3?"SGM3-":"");
  const optCodes = (options||[]).map(o=>OPTIONS[o].code+"-").join("");
  const glidersCode = "RNR"+gliders+"-";
  const bracketsCode = "CLP"+brackets;

  const articleCode = configCode+"-"+motor.codeAdd+widthCode+heightCode+glider.code+"-"+colourCode+"-"+railSegCode+pack.code+"-"+optCodes+glidersCode+bracketsCode;

  return {articleCode, rail, belt, gliders, hooks, brackets, stackwidth, motorized, center};
}


function tagTask(task) {
  const t=(typeof task==="object"?task.title:task).toLowerCase();
  if(t.includes("montaj")||t.includes("programeaza")) return {label:"Montaj",bg:"#EEF2EE",color:"#3D5C3D"};
  if(t.includes("factur")||t.includes("avans")) return {label:"Factură",bg:"#F2EEF0",color:"#5C3D50"};
  if(t.includes("ofert")) return {label:"Ofertă",bg:"#EEF0F2",color:"#3D4A5C"};
  if(t.includes("masur")) return {label:"Măsurători",bg:"#F2EEEE",color:"#5C3D3D"};
  if(t.includes("livrat")||t.includes("livrare")) return {label:"Livrare",bg:"#EEF2EE",color:"#3D5040"};
  if(t.includes("telefon")||t.includes("asteapt")) return {label:"Așteptare",bg:"#F2F2EE",color:"#505050"};

}

// ---------- consum centralizat de componente per client (contabilitate) ----------
// Cantitățile din fiecare cfg.parts sunt DEJA înmulțite cu "Cantitate" la momentul calculului
// (getPartsList pentru șină primește numberOfSystems; rulouPartsList primește qty) —
// aici doar însumăm ce e deja salvat, fără să înmulțim din nou cu nimic.
function consolidateClientParts(client){
  const map=new Map();
  const add=(code,qty)=>{
    if(!code||!qty) return;
    map.set(code,(map.get(code)||0)+qty);
  };
  (client.configuratiiSina||[]).forEach(cfg=>(cfg.parts||[]).forEach(p=>add(p.code,p.qty)));
  (client.configuratiiRoman||[]).forEach(cfg=>(cfg.parts||[]).forEach(p=>add(p.code,p.qty)));
  (client.configuratiiRulou||[]).forEach(cfg=>(cfg.parts||[]).forEach(p=>add(p.article,p.qty)));
  return Array.from(map.entries())
    .map(([cod,cantitate])=>({cod,cantitate:Math.round(cantitate*10000)/10000}))
    .sort((a,b)=>a.cod.localeCompare(b.cod));
}
function exportClientPartsXLSX(client){
  const rows=consolidateClientParts(client);
  if(!rows.length){ alert("Nu există nicio configurație salvată (șină/stor roman/rulou) pentru acest client."); return; }
  if(typeof XLSX==="undefined"){ alert("Modulul Excel nu s-a încărcat (verifică conexiunea la internet) — încearcă din nou."); return; }
  const data=[["Cod","Cantitate"], ...rows.map(r=>[r.cod, r.cantitate])];
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws["!cols"]=[{wch:20},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Consum");
  XLSX.writeFile(wb, `Consum_${(client.name||"client").replace(/[^a-zA-Z0-9]+/g,"_")}_${tday()}.xlsx`);
}

function nxtRecur(r) {
  const now=new Date();
  const lastDone=r.lastDone||"";
  const dayOccurrence=(y,m,day)=>{
    let d=new Date(y,m,day);
    if(d.getMonth()!==((m%12)+12)%12) d=new Date(y,m+1,0); // depășire lună -> ultima zi a lunii
    return d;
  };
  if(r.type==="lunar_zi"){
    const day=parseInt(r.day);
    let y=now.getFullYear(), m=now.getMonth();
    let d=dayOccurrence(y,m,day), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; if(m>11){m=0;y+=1;} d=dayOccurrence(y,m,day); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="lunar_inceput"){
    let y=now.getFullYear(), m=now.getMonth();
    let d=new Date(y,m,1), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; if(m>11){m=0;y+=1;} d=new Date(y,m,1); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="lunar_sfarsit"){
    let y=now.getFullYear(), m=now.getMonth();
    let d=new Date(y,m+1,0), ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ m+=1; d=new Date(y,m+1,0); ds=dateToKey(d); }
    return ds;
  }
  if(r.type==="saptamanal"){
    const dm={"Luni":1,"Marți":2,"Miercuri":3,"Joi":4,"Vineri":5,"Sâmbătă":6,"Duminică":0};
    const target=dm[r.day]??1;
    let d=new Date(now); d.setDate(d.getDate()+((target-d.getDay()+7)%7));
    let ds=dateToKey(d);
    while(lastDone && lastDone>=ds){ d.setDate(d.getDate()+7); ds=dateToKey(d); }
    return ds;
  }
  return tmrw();
}

  if(t.includes("campanie")||t.includes("ads"))s+=15;

  return s;
}

function TudorDocumente({t,ti_,setTudor,C,sb,tday,fmtD}){
  const [uploading,setUploading]=React.useState(false);
  const inputRef=React.useRef(null);
  const fisiere=t.fisiere||[];
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const path=`tudor/${t.id}/${Date.now()}_${file.name}`;
      const {error}=await sb.storage.from("oferte-clienti").upload(path,file);
      if(error){ alert("Eroare la încărcare: "+error.message); setUploading(false); return; }
      const {data}=sb.storage.from("oferte-clienti").getPublicUrl(path);
      setTudor(p=>p.map((x,i)=>i!==ti_?x:{...x,fisiere:[...(x.fisiere||[]),{nume:file.name,url:data.publicUrl,path,data:tday()}]}));
    }catch(err){ alert("Eroare: "+err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value="";
  };
  const handleDelete=async(f)=>{
    if(!window.confirm(`Ștergi fișierul "${f.nume}"?`)) return;
    try{ await sb.storage.from("oferte-clienti").remove([f.path]); }catch{}
    setTudor(p=>p.map((x,i)=>i!==ti_?x:{...x,fisiere:(x.fisiere||[]).filter(y=>y.path!==f.path)}));

    <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>
      Documente {fisiere.length>0&&<span style={{background:C.accentLight,color:C.accent,padding:"1px 6px",fontSize:10,marginLeft:4}}>{fisiere.length}</span>}
    </div>
    {fisiere.map((f,i)=>{
      const ext=(f.nume.split(".").pop()||"").toLowerCase();
      const office=["xlsx","xls","doc","docx","ppt","pptx","csv"].includes(ext);
      const openUrl=office?`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(f.url)}`:f.url;

    {sorted.length>0&&<div>
      {sorted.map(z=><div key={z.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:C.bg,marginBottom:4}}>
        <span style={{fontSize:12,fontWeight:600,color:C.text,minWidth:150}}>{fmtD(z.dataStart)}{z.dataEnd&&z.dataEnd!==z.dataStart?` → ${fmtD(z.dataEnd)}`:""}</span>
        <span style={{fontSize:12,color:C.textSub,flex:1}}>{z.motiv||"—"}</span>
        <button onClick={()=>onDel(z.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14}}>×</button>
      </div>)}
    </div>}
  </div>;
}

function TabNico({clients,setClients,sb,tday,fmtD,C,blocate,onAddBlocat,onDelBlocat}){
  const [openId,setOpenId]=React.useState(null);
  const [calMonth,setCalMonth]=React.useState(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};});
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const ZILE_SCURT=["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const todayKey=tday();

  const nicoClients=clients.filter(c=>c.alocatNico).sort((a,b)=>a.name.localeCompare(b.name,"ro"));
  const client=clients.find(c=>c.id===openId);
  const ci=client?clients.indexOf(client):-1;

  const productieByDay={};
  nicoClients.forEach(c=>{
    const start=c.prodStart||"", end=c.prodEnd||start;
    if(!start||!end) return;
    let d=new Date(start);
    const endD=new Date(end);
    while(d<=endD){
      const key=d.toISOString().slice(0,10);
      (productieByDay[key]=productieByDay[key]||[]).push(c.name);
      d.setDate(d.getDate()+1);
    }
  });

  const addConsum=()=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:[...(c.consumuri||[]),{produs:"",cod:"",cantitate:""}]}));
  const updConsum=(idx,field,val)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).map((r,i)=>i!==idx?r:{...r,[field]:val})}));
  const delConsum=(idx)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).filter((_,i)=>i!==idx)}));
  const printConsum=()=>{
    if(!client) return;
    const rows=(client.consumuri||[]).map(r=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${r.produs||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cod||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cantitate||""}</td></tr>`).join("");
    const html=`<html><head><title>Consum ${client.name}</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Consum materiale — ${client.name}</h2>
      <table style="border-collapse:collapse;width:100%;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Produs</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
    printHtmlDoc(html);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10,fontWeight:600}}>Alocare producție</div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:10}}>
      <button onClick={()=>setCalMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[calMonth.m]} {calMonth.y}</div>
      <button onClick={()=>setCalMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
      {ZILE_SCURT.map(z=><div key={z} style={{textAlign:"center",fontSize:10,color:C.textMuted,fontWeight:600}}>{z}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:20}}>
      {(()=>{
        const first=new Date(calMonth.y,calMonth.m,1);
        const offset=(first.getDay()+6)%7;
        const total=daysInM(calMonth.y,calMonth.m);
        const cells=[];
        for(let i=0;i<offset;i++) cells.push(<div key={`e${i}`}/>);
        for(let day=1;day<=total;day++){
          const key=keyFor(calMonth.y,calMonth.m,day);
          const isToday=key===todayKey;
          const nume=productieByDay[key]||[];
          const dow=new Date(calMonth.y,calMonth.m,day).getDay();
          const isWeekend=dow===0||dow===6;
          const blocat=(blocate||[]).find(z=>key>=z.dataStart&&key<=(z.dataEnd||z.dataStart));
          let bg=nume.length?"#5C6B65":C.bg, textCol=nume.length?"rgba(255,255,255,0.75)":C.textMuted;
          if(isWeekend){bg="#DDD6C8";textCol="#A89E8C";}
          if(blocat){bg="#B8A88F";textCol="#fff";}
          cells.push(<div key={key} style={{minHeight:56,padding:"4px 5px",background:bg,border:isToday?`1.5px solid ${C.text}`:`1px solid ${C.border}`,overflow:"hidden"}}>
            <div style={{fontSize:11,fontWeight:isToday?700:400,color:textCol,marginBottom:2}}>{day}</div>
            {blocat?<div style={{fontSize:9,color:"#fff",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{blocat.motiv||"Blocat"}</div>:
             nume.map((n,i)=><div key={i} style={{fontSize:10,color:"rgba(255,255,255,0.95)",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n}</div>)}
          </div>);
        }
        return cells;
      })()}
    </div>

    <BlocareZi blocate={blocate} onAdd={onAddBlocat} onDel={onDelBlocat} C={C} fmtD={fmtD}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(105px,1fr))",gap:6,marginBottom:16,marginTop:20}}>
      {nicoClients.map((c,fi)=><div key={c.id} onClick={()=>setOpenId(c.id===openId?null:c.id)} style={{display:"flex",alignItems:"center",justifyContent:"center",aspectRatio:"1 / 1",padding:8,cursor:"pointer",userSelect:"none",textAlign:"center",background:CC[fi%CC.length],border:openId===c.id?"2px solid #2A2118":"1px solid transparent"}}>
        <span style={{fontSize:12,fontWeight:500,color:C.text,wordBreak:"break-word"}}>{c.name}</span>
      </div>)}
      {nicoClients.length===0&&<div style={{fontSize:13,color:C.textMuted,gridColumn:"1/-1",padding:"20px 0"}}>Niciun client alocat încă. Bifează "Alocă la Nico" din fișa clientului, în tab-ul Clienți.</div>}
    </div>
    {client&&<div style={{border:`1px solid ${C.border}`,background:C.surface}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{client.name}</div>
        <button onClick={()=>setOpenId(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.textSub,fontSize:15}}>×</button>
      </div>
      <div style={{padding:"12px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"10px 14px",background:C.bg,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.textMuted}}>Producție:</span>
          <input type="date" value={client.prodStart||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodStart:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
          <span style={{fontSize:12,color:C.textMuted}}>→</span>
          <input type="date" value={client.prodEnd||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodEnd:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Comenzi croitorie</div>
          <ComenziNico client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Poze și măsurători (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danPoze" folder="dan-poze" accept="image/*,.pdf" buttonLabel="+ fă poză / adaugă măsurătoare"/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Șină / sisteme de produs (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danComenzi" folder="dan-comenzi" accept=".pdf,.doc,.docx,.xlsx,.xls,.csv,image/*" buttonLabel="+ adaugă comandă"/>
        </div>

        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Consum materiale</div>
          {(client.consumuri||[]).map((r,idx)=><div key={idx} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
            <input value={r.produs} onChange={e=>updConsum(idx,"produs",e.target.value)} placeholder="Produs" style={{flex:2,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cod} onChange={e=>updConsum(idx,"cod",e.target.value)} placeholder="Cod" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cantitate} onChange={e=>updConsum(idx,"cantitate",e.target.value)} placeholder="Cantitate" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <button onClick={()=>delConsum(idx)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,flexShrink:0}}>×</button>
          </div>)}
          <button onClick={addConsum} style={{fontSize:12,color:"#2A2118",border:"none",padding:"6px 12px",background:"#5C6B65",cursor:"pointer",width:"100%",marginBottom:10}}>+ adaugă consum</button>
          {(client.consumuri||[]).length>0&&<button onClick={printConsum} style={{width:"100%",fontSize:12,fontWeight:600,padding:"8px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează consum</button>}
        </div>
      </div>
    </div>}
  </div>;
}

function TabConfigurator({C,clients,setClients,clientIdFixat,camereLista,setCamereLista}){
  const [width,setWidth]=React.useState(2000);
  const [height,setHeight]=React.useState(2500);
  const [motorKey,setMotorKey]=React.useState("CM-57");
  const [gliderKey,setGliderKey]=React.useState("Pleat");
  const [packKey,setPackKey]=React.useState("Right");
  const [colourKey,setColourKey]=React.useState("White");
  const [railSegments,setRailSegments]=React.useState(1);
  const [quantity,setQuantity]=React.useState(1);
  const [options,setOptions]=React.useState([]);
  const [clientId,setClientId]=React.useState(clientIdFixat||"");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const toggleOption=(opt)=>setOptions(p=>p.includes(opt)?p.filter(o=>o!==opt):[...p,opt]);

  let result=null, parts=[], error=null;
  try{
    result=coulisseCalc({width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),options});
    parts=getPartsList(result.articleCode,result,Number(quantity)||1);
  }catch(e){ error="Verifică valorile introduse."; }
  const {errors:validErrors,warnings:validWarnings}=validateCoulisseInput({width:Number(width),height:Number(height),railSegments:Number(railSegments),packKey});

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};

  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=(cfg)=>{
    const rows=cfg.parts.map((p,i)=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${i+1}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.code}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}${p.colour?" ("+p.colour+")":""}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
    return `<html><head><title>Comandă Coulisse</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Configurator Coulisse SmartCurtain</h2>
      ${cfg.clientName?`<p><b>Client:</b> ${cfg.clientName}</p><p><b>Destinație (cameră):</b> ${cfg.camera||"—"}</p>`:""}
      ${cfg.observatii?`<p style="background:#5C6B65;color:#fff;padding:10px 14px;"><b>Observație:</b> ${cfg.observatii}</p>`:""}
      <div style="border:1px solid #999;padding:10px 14px;margin:12px 0;background:#f4f2ee;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#555;font-weight:700;margin-bottom:8px;">Date introduse (nu sunt calcule ale sistemului)</div>
        <div style="line-height:1.9;">
          Lățime: ${cfg.input.width}mm<br/>Înălțime: ${cfg.input.height}mm<br/>Motor: ${cfg.input.motorKey}<br/>Glisor: ${cfg.input.gliderKey}<br/>Împachetare: ${cfg.input.packKey}<br/>Culoare: ${cfg.input.colourKey}<br/>Segmente șină: ${cfg.input.railSegments}<br/>Cantitate: ${cfg.input.quantity}
        </div>
      </div>
      <p><b>Rezultat calcul:</b> Șină de tăiat: ${cfg.result.rail}mm · Curea: ${cfg.result.belt}mm · Glisoare/buc: ${cfg.result.gliders} · Cârlige/buc: ${cfg.result.hooks} · Console/buc: ${cfg.result.brackets} · Stackwidth: ${Math.round(cfg.result.stackwidth)}mm</p>
      <table style="border-collapse:collapse;width:100%;margin-top:14px;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">#</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
  };

  const printParts=()=>{
    if(!result) return;
    const html=buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:{width,height,motorKey,gliderKey,packKey,colourKey,railSegments,quantity},result,parts});
    printHtmlDoc(html);
  };

  const printSaved=(cfg)=>{
    const html=buildPrintHtml(cfg);
    printHtmlDoc(html);
  };

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(validErrors.length>0){ alert("Nu poți salva — sunt erori de validare care trebuie corectate întâi:\n\n"+validErrors.join("\n")); return; }
    if(validWarnings.length>0 && !window.confirm("Atenție:\n\n"+validWarnings.join("\n")+"\n\nSigur vrei să salvezi oricum?")) return;
    if(!camera.trim() && !window.confirm("Nu ai completat Cameră (destinație). Salvezi oricum?\n\nApasă Anulează ca să o completezi întâi.")) return;
    if(camera.trim() && setCamereLista && !(camereLista||[]).some(cm=>cm.toLowerCase()===camera.trim().toLowerCase())){
      setCamereLista(p=>[...p,camera.trim()]);
    }
    const cfg={
      id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      input:{width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),quantity:Number(quantity)||1,options},
      result, parts
    };
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiSina:[...(c.configuratiiSina||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator șină Coulisse SmartCurtain</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle} disabled={!!clientIdFixat}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input list="camere-dl" value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
        <datalist id="camere-dl">{(camereLista||[]).map(cm=><option key={cm} value={cm}/>)}</datalist>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Motor</label>
        <select value={motorKey} onChange={e=>setMotorKey(e.target.value)} style={selStyle}>
          {Object.keys(MOTORS).map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Tip glisor</label>
        <select value={gliderKey} onChange={e=>setGliderKey(e.target.value)} style={selStyle}>
          {Object.keys(GLIDER_TYPES).map(g=><option key={g} value={g}>{g}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Parte împachetare</label>
        <select value={packKey} onChange={e=>setPackKey(e.target.value)} style={selStyle}>
          {Object.keys(PACK_SIDES).map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare</label>
        <select value={colourKey} onChange={e=>setColourKey(e.target.value)} style={selStyle}>
          {Object.keys(COLOURS).map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Segmente șină</label>
        <select value={railSegments} onChange={e=>setRailSegments(e.target.value)} style={selStyle}>
          <option value={1}>1 (o bucată)</option>
          <option value={2}>2 (o îmbinare)</option>
          <option value={3}>3 (două îmbinări)</option>
        </select>
      </div>
      <div><label style={lblStyle}>Cantitate (buc. identice)</label><input type="number" min="1" value={quantity} onChange={e=>setQuantity(e.target.value)} style={selStyle}/></div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Opțiuni suplimentare</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {Object.keys(OPTIONS).map(opt=>
          <label key={opt} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer"}}>
            <input type="checkbox" checked={options.includes(opt)} onChange={()=>toggleOption(opt)}/>
            {opt}
          </label>
        )}
      </div>
    </div>

    {error&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{error}</div>}

    {validErrors.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>⚠ Configurație imposibilă:</div>
      {validErrors.map((e,i)=><div key={i} style={{marginBottom:4}}>{e}</div>)}
    </div>}
    {validErrors.length===0&&validWarnings.length>0&&<div style={{background:"#B8A88F",color:"#2A2118",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>Atenție:</div>
      {validWarnings.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}
    </div>}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>
      <div style={{padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol {Number(quantity)>1?`(× ${quantity} buc.)`:""}</div>

        <ConfigSalvataRow key={cfg.id} cfg={cfg} clientId={clientObj.id} setClients={setClients} C={C} onPrint={()=>printSaved({...cfg,clientName:clientObj.name})}/>
      )}
    </div>}
  </div>;
}
