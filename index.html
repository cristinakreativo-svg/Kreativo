      return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:C.bg,marginBottom:4}}>
        <a href={openUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:C.accent,flex:1,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-1px",marginRight:5}}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>{f.nume}</a>
        <span style={{fontSize:10,color:C.textMuted,flexShrink:0}}>{fmtD(f.data)}</span>
        <button onClick={()=>handleDelete(f)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>;
    })}
    <input ref={inputRef} type="file" accept=".pdf,image/*,.xlsx,.xls,.csv,.doc,.docx" style={{display:"none"}} onChange={handleUpload}/>
    <button onClick={()=>inputRef.current?.click()} disabled={uploading} style={{fontSize:12,color:"#2A2118",border:"none",padding:"7px 12px",background:"#5C6B65",cursor:uploading?"default":"pointer",marginTop:4,width:"100%"}}>{uploading?"Se încarcă...":"+ adaugă document (PDF, Excel, Word, imagine)"}</button>
  </div>;
}

function ComenziNico({client,ci,setClients,C,sb,tday,fmtD}){
  const [uploading,setUploading]=React.useState(false);
  const inputRef=React.useRef(null);
  const comenzi=client.comenziNico||[];
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const path=`comenzi-nico/${client.id}/${Date.now()}_${file.name}`;
      const {error}=await sb.storage.from("oferte-clienti").upload(path,file);
      if(error){ alert("Eroare la încărcare: "+error.message); setUploading(false); return; }
      const {data}=sb.storage.from("oferte-clienti").getPublicUrl(path);
      setClients(p=>p.map((c,i)=>i!==ci?c:{...c,comenziNico:[...(c.comenziNico||[]),{nume:file.name,url:data.publicUrl,path,data:tday()}]}));
    }catch(err){ alert("Eroare: "+err.message); }
    setUploading(false);
    if(inputRef.current) inputRef.current.value="";
  };
  const handleDelete=async(f)=>{
    if(!window.confirm(`Ștergi fișierul "${f.nume}"?`)) return;
    try{ await sb.storage.from("oferte-clienti").remove([f.path]); }catch{}
    setClients(p=>p.map((c,i)=>i!==ci?c:{...c,comenziNico:(c.comenziNico||[]).filter(x=>x.path!==f.path)}));
  };
  return <div>
    {comenzi.map((f,i)=>{
      const ext=(f.nume.split(".").pop()||"").toLowerCase();
      const office=["xlsx","xls","csv"].includes(ext);
      const openUrl=office?`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(f.url)}`:f.url;
      return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",background:C.bg,marginBottom:4}}>
        <a href={openUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:C.accent,flex:1,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{display:"inline-block",verticalAlign:"-1px",marginRight:5}}><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>{f.nume}</a>
        <span style={{fontSize:10,color:C.textMuted,flexShrink:0}}>{fmtD(f.data)}</span>
        <button onClick={()=>handleDelete(f)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:13,flexShrink:0}}>×</button>
      </div>;
    })}
    <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={handleUpload}/>
    <button onClick={()=>inputRef.current?.click()} disabled={uploading} style={{fontSize:12,color:"#2A2118",border:"none",padding:"7px 12px",background:"#5C6B65",cursor:uploading?"default":"pointer",width:"100%"}}>{uploading?"Se încarcă...":"+ adaugă comandă (Excel)"}</button>
  </div>;
}

function BlocareZi({blocate,onAdd,onDel,C,fmtD}){
  const [start,setStart]=React.useState("");
  const [end,setEnd]=React.useState("");
  const [motiv,setMotiv]=React.useState("");
  const sorted=(blocate||[]).slice().sort((a,b)=>a.dataStart<b.dataStart?-1:1);
  return <div style={{marginTop:20}}>
    <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Blocare perioadă</div>
    <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
      <input type="date" value={start} onChange={e=>{setStart(e.target.value);if(!end||end<e.target.value)setEnd(e.target.value);}} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
      <span style={{fontSize:12,color:C.textMuted}}>→</span>
      <input type="date" value={end} onChange={e=>setEnd(e.target.value)} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
      <input value={motiv} onChange={e=>setMotiv(e.target.value)} placeholder="Motiv (ex: concediu)" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 10px",background:C.surface,outline:"none",minWidth:120}}/>
      <button onClick={()=>{if(!start) return; onAdd(start,end||start,motiv); setStart(""); setEnd(""); setMotiv("");}} style={{fontSize:12,color:"#2A2118",background:"#5C6B65",border:"none",padding:"6px 14px",cursor:"pointer"}}>Blochează perioada</button>
    </div>
    {sorted.length>0&&<div>
      {sorted.map(z=><div key={z.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:C.bg,marginBottom:4}}>
        <span style={{fontSize:12,fontWeight:600,color:C.text,minWidth:150}}>{fmtD(z.dataStart)}{z.dataEnd&&z.dataEnd!==z.dataStart?` → ${fmtD(z.dataEnd)}`:""}</span>
        <span style={{fontSize:12,color:C.textSub,flex:1}}>{z.motiv||"—"}</span>
        <button onClick={()=>onDel(z.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14}}>×</button>
      </div>)}
    </div>}
  </div>;
}

function TabNico({clients,setClients,sb,tday,fmtD,C,blocate,onAddBlocat,onDelBlocat}){
  const [openId,setOpenId]=React.useState(null);
  const [calMonth,setCalMonth]=React.useState(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};});
  const LUNI=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
  const ZILE_SCURT=["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
  const daysInM=(y,m)=>new Date(y,m+1,0).getDate();
  const keyFor=(y,m,day)=>`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const todayKey=tday();

  const nicoClients=clients.filter(c=>c.alocatNico).sort((a,b)=>a.name.localeCompare(b.name,"ro"));
  const client=clients.find(c=>c.id===openId);
  const ci=client?clients.indexOf(client):-1;

  const productieByDay={};
  nicoClients.forEach(c=>{
    const start=c.prodStart||"", end=c.prodEnd||start;
    if(!start||!end) return;
    let d=new Date(start);
    const endD=new Date(end);
    while(d<=endD){
      const key=d.toISOString().slice(0,10);
      (productieByDay[key]=productieByDay[key]||[]).push(c.name);
      d.setDate(d.getDate()+1);
    }
  });

  const addConsum=()=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:[...(c.consumuri||[]),{produs:"",cod:"",cantitate:""}]}));
  const updConsum=(idx,field,val)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).map((r,i)=>i!==idx?r:{...r,[field]:val})}));
  const delConsum=(idx)=>setClients(p=>p.map(c=>c.id!==openId?c:{...c,consumuri:(c.consumuri||[]).filter((_,i)=>i!==idx)}));
  const printConsum=()=>{
    if(!client) return;
    const rows=(client.consumuri||[]).map(r=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;">${r.produs||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cod||""}</td><td style="padding:6px 10px;border:1px solid #ccc;">${r.cantitate||""}</td></tr>`).join("");
    const html=`<html><head><title>Consum ${client.name}</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Consum materiale — ${client.name}</h2>
      <table style="border-collapse:collapse;width:100%;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Produs</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
    printHtmlDoc(html);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10,fontWeight:600}}>Alocare producție</div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:10}}>
      <button onClick={()=>setCalMonth(p=>{const m=p.m-1;return m<0?{y:p.y-1,m:11}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>‹</button>
      <div style={{fontSize:13,fontWeight:600,color:C.text}}>{LUNI[calMonth.m]} {calMonth.y}</div>
      <button onClick={()=>setCalMonth(p=>{const m=p.m+1;return m>11?{y:p.y+1,m:0}:{y:p.y,m};})} style={{background:"none",border:`1px solid ${C.border}`,cursor:"pointer",padding:"4px 10px",fontSize:13,color:C.textSub}}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
      {ZILE_SCURT.map(z=><div key={z} style={{textAlign:"center",fontSize:10,color:C.textMuted,fontWeight:600}}>{z}</div>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:20}}>
      {(()=>{
        const first=new Date(calMonth.y,calMonth.m,1);
        const offset=(first.getDay()+6)%7;
        const total=daysInM(calMonth.y,calMonth.m);
        const cells=[];
        for(let i=0;i<offset;i++) cells.push(<div key={`e${i}`}/>);
        for(let day=1;day<=total;day++){
          const key=keyFor(calMonth.y,calMonth.m,day);
          const isToday=key===todayKey;
          const nume=productieByDay[key]||[];
          const dow=new Date(calMonth.y,calMonth.m,day).getDay();
          const isWeekend=dow===0||dow===6;
          const blocat=(blocate||[]).find(z=>key>=z.dataStart&&key<=(z.dataEnd||z.dataStart));
          let bg=nume.length?"#5C6B65":C.bg, textCol=nume.length?"rgba(255,255,255,0.75)":C.textMuted;
          if(isWeekend){bg="#DDD6C8";textCol="#A89E8C";}
          if(blocat){bg="#B8A88F";textCol="#fff";}
          cells.push(<div key={key} style={{minHeight:56,padding:"4px 5px",background:bg,border:isToday?`1.5px solid ${C.text}`:`1px solid ${C.border}`,overflow:"hidden"}}>
            <div style={{fontSize:11,fontWeight:isToday?700:400,color:textCol,marginBottom:2}}>{day}</div>
            {blocat?<div style={{fontSize:9,color:"#fff",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{blocat.motiv||"Blocat"}</div>:
             nume.map((n,i)=><div key={i} style={{fontSize:10,color:"rgba(255,255,255,0.95)",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n}</div>)}
          </div>);
        }
        return cells;
      })()}
    </div>

    <BlocareZi blocate={blocate} onAdd={onAddBlocat} onDel={onDelBlocat} C={C} fmtD={fmtD}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(105px,1fr))",gap:6,marginBottom:16,marginTop:20}}>
      {nicoClients.map((c,fi)=><div key={c.id} onClick={()=>setOpenId(c.id===openId?null:c.id)} style={{display:"flex",alignItems:"center",justifyContent:"center",aspectRatio:"1 / 1",padding:8,cursor:"pointer",userSelect:"none",textAlign:"center",background:CC[fi%CC.length],border:openId===c.id?"2px solid #2A2118":"1px solid transparent"}}>
        <span style={{fontSize:12,fontWeight:500,color:C.text,wordBreak:"break-word"}}>{c.name}</span>
      </div>)}
      {nicoClients.length===0&&<div style={{fontSize:13,color:C.textMuted,gridColumn:"1/-1",padding:"20px 0"}}>Niciun client alocat încă. Bifează "Alocă la Nico" din fișa clientului, în tab-ul Clienți.</div>}
    </div>
    {client&&<div style={{border:`1px solid ${C.border}`,background:C.surface}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{client.name}</div>
        <button onClick={()=>setOpenId(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.textSub,fontSize:15}}>×</button>
      </div>
      <div style={{padding:"12px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"10px 14px",background:C.bg,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.textMuted}}>Producție:</span>
          <input type="date" value={client.prodStart||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodStart:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
          <span style={{fontSize:12,color:C.textMuted}}>→</span>
          <input type="date" value={client.prodEnd||""} onChange={e=>setClients(p=>p.map((c,i)=>i!==ci?c:{...c,prodEnd:e.target.value}))} style={{fontSize:12,border:`1px solid ${C.border}`,padding:"4px 6px",outline:"none",background:C.surface}}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Comenzi croitorie</div>
          <ComenziNico client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD}/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Poze și măsurători (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danPoze" folder="dan-poze" accept="image/*,.pdf" buttonLabel="+ fă poză / adaugă măsurătoare"/>
        </div>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Șină / sisteme de produs (de la Dan)</div>
          <ComenziDan client={client} ci={ci} setClients={setClients} C={C} sb={sb} tday={tday} fmtD={fmtD} field="danComenzi" folder="dan-comenzi" accept=".pdf,.doc,.docx,.xlsx,.xls,.csv,image/*" buttonLabel="+ adaugă comandă"/>
        </div>

        <div>
          <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:8}}>Consum materiale</div>
          {(client.consumuri||[]).map((r,idx)=><div key={idx} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
            <input value={r.produs} onChange={e=>updConsum(idx,"produs",e.target.value)} placeholder="Produs" style={{flex:2,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cod} onChange={e=>updConsum(idx,"cod",e.target.value)} placeholder="Cod" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <input value={r.cantitate} onChange={e=>updConsum(idx,"cantitate",e.target.value)} placeholder="Cantitate" style={{flex:1,fontSize:12,border:`1px solid ${C.border}`,padding:"6px 8px",background:C.surface,outline:"none"}}/>
            <button onClick={()=>delConsum(idx)} style={{background:"none",border:"none",cursor:"pointer",color:C.textMuted,fontSize:14,flexShrink:0}}>×</button>
          </div>)}
          <button onClick={addConsum} style={{fontSize:12,color:"#2A2118",border:"none",padding:"6px 12px",background:"#5C6B65",cursor:"pointer",width:"100%",marginBottom:10}}>+ adaugă consum</button>
          {(client.consumuri||[]).length>0&&<button onClick={printConsum} style={{width:"100%",fontSize:12,fontWeight:600,padding:"8px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează consum</button>}
        </div>
      </div>
    </div>}
  </div>;
}

function TabConfigurator({C,clients,setClients,clientIdFixat,camereLista,setCamereLista}){
  const [width,setWidth]=React.useState(2000);
  const [height,setHeight]=React.useState(2500);
  const [motorKey,setMotorKey]=React.useState("CM-57");
  const [gliderKey,setGliderKey]=React.useState("Pleat");
  const [packKey,setPackKey]=React.useState("Right");
  const [colourKey,setColourKey]=React.useState("");
  const [railSegments,setRailSegments]=React.useState(1);
  const [quantity,setQuantity]=React.useState(1);
  const [options,setOptions]=React.useState([]);
  const [clientId,setClientId]=React.useState(clientIdFixat||"");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const toggleOption=(opt)=>setOptions(p=>p.includes(opt)?p.filter(o=>o!==opt):[...p,opt]);

  let result=null, parts=[], error=null;
  try{
    if(!colourKey) throw new Error("Alege o culoare.");
    result=coulisseCalc({width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),options});
    parts=getPartsList(result.articleCode,result,Number(quantity)||1);
  }catch(e){ error=colourKey?"Verifică valorile introduse.":null; }
  const {errors:validErrors,warnings:validWarnings}=validateCoulisseInput({width:Number(width),height:Number(height),railSegments:Number(railSegments),packKey,colourKey});

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};

  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=(cfg)=>{
    const rows=cfg.parts.map((p,i)=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${i+1}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.code}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}${p.colour?" ("+p.colour+")":""}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
    return `<html><head><title>Comandă Coulisse</title></head><body style="font-family:sans-serif;padding:20px;">
      <h2>Configurator Coulisse SmartCurtain</h2>
      ${cfg.clientName?`<p><b>Client:</b> ${cfg.clientName}</p><p><b>Destinație (cameră):</b> ${cfg.camera||"—"}</p>`:""}

        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#555;font-weight:700;margin-bottom:8px;">Date introduse (nu sunt calcule ale sistemului)</div>
        <div style="line-height:1.9;">
          Lățime: ${cfg.input.width}mm<br/>Înălțime: ${cfg.input.height}mm<br/>Motor: ${cfg.input.motorKey}<br/>Glisor: ${cfg.input.gliderKey}<br/>Împachetare: ${cfg.input.packKey}<br/>Culoare: ${cfg.input.colourKey}<br/>Segmente șină: ${cfg.input.railSegments}<br/>Cantitate: ${cfg.input.quantity}
        </div>
      </div>
      <p><b>Rezultat calcul:</b> Șină de tăiat: ${cfg.result.rail}mm · Curea: ${cfg.result.belt}mm · Glisoare/buc: ${cfg.result.gliders} · Cârlige/buc: ${cfg.result.hooks} · Console/buc: ${cfg.result.brackets} · Stackwidth: ${Math.round(cfg.result.stackwidth)}mm</p>
      <table style="border-collapse:collapse;width:100%;margin-top:14px;">
        <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">#</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>
        ${rows}
      </table>
    </body></html>`;
  };

  const printParts=()=>{
    if(!result) return;
    const html=buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:{width,height,motorKey,gliderKey,packKey,colourKey,railSegments,quantity},result,parts});
    printHtmlDoc(html);
  };

  const printSaved=(cfg)=>{
    const html=buildPrintHtml(cfg);
    printHtmlDoc(html);
  };

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(validErrors.length>0){ alert("Nu poți salva — sunt erori de validare care trebuie corectate întâi:\n\n"+validErrors.join("\n")); return; }
    if(validWarnings.length>0 && !window.confirm("Atenție:\n\n"+validWarnings.join("\n")+"\n\nSigur vrei să salvezi oricum?")) return;
    if(!camera.trim() && !window.confirm("Nu ai completat Cameră (destinație). Salvezi oricum?\n\nApasă Anulează ca să o completezi întâi.")) return;
    if(camera.trim() && setCamereLista && !(camereLista||[]).some(cm=>cm.toLowerCase()===camera.trim().toLowerCase())){
      setCamereLista(p=>[...p,camera.trim()]);
    }
    const cfg={
      id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      input:{width:Number(width),height:Number(height),motorKey,gliderKey,packKey,colourKey,railSegments:Number(railSegments),quantity:Number(quantity)||1,options},
      result, parts
    };
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiSina:[...(c.configuratiiSina||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator șină Coulisse SmartCurtain</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle} disabled={!!clientIdFixat}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input list="camere-dl" value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
        <datalist id="camere-dl">{(camereLista||[]).map(cm=><option key={cm} value={cm}/>)}</datalist>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Motor</label>
        <select value={motorKey} onChange={e=>setMotorKey(e.target.value)} style={selStyle}>
          {Object.keys(MOTORS).map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Tip glisor</label>
        <select value={gliderKey} onChange={e=>setGliderKey(e.target.value)} style={selStyle}>
          {Object.keys(GLIDER_TYPES).map(g=><option key={g} value={g}>{g}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Parte împachetare</label>
        <select value={packKey} onChange={e=>setPackKey(e.target.value)} style={selStyle}>
          {Object.keys(PACK_SIDES).map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare (obligatoriu)</label>
        <select value={colourKey} onChange={e=>setColourKey(e.target.value)} style={selStyle}>
          <option value="">— alege culoare —</option>
          {Object.keys(COLOURS).map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Segmente șină</label>
        <select value={railSegments} onChange={e=>setRailSegments(e.target.value)} style={selStyle}>
          <option value={1}>1 (o bucată)</option>
          <option value={2}>2 (o îmbinare)</option>
          <option value={3}>3 (două îmbinări)</option>
        </select>
      </div>
      <div><label style={lblStyle}>Cantitate (buc. identice)</label><input type="number" min="1" value={quantity} onChange={e=>setQuantity(e.target.value)} style={selStyle}/></div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={lblStyle}>Opțiuni suplimentare</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {Object.keys(OPTIONS).map(opt=>
          <label key={opt} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:C.textSub,background:C.bg,padding:"5px 10px",cursor:"pointer"}}>
            <input type="checkbox" checked={options.includes(opt)} onChange={()=>toggleOption(opt)}/>
            {opt}
          </label>
        )}
      </div>
    </div>

    {error&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{error}</div>}

    {validErrors.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>⚠ Configurație imposibilă:</div>
      {validErrors.map((e,i)=><div key={i} style={{marginBottom:4}}>{e}</div>)}
    </div>}
    {validErrors.length===0&&validWarnings.length>0&&<div style={{background:"#B8A88F",color:"#2A2118",padding:"12px 16px",marginBottom:14,fontSize:13}}>
      <div style={{fontWeight:700,marginBottom:6}}>Atenție:</div>
      {validWarnings.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}
    </div>}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>
      <div style={{padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol {Number(quantity)>1?`(× ${quantity} buc.)`:""}</div>
        <div style={{fontSize:14,fontWeight:600,color:C.text,wordBreak:"break-all"}}>{result.articleCode}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[["Șină de tăiat",result.rail+" mm"],["Curea",result.belt+" mm"],["Glisoare / buc.",result.gliders],["Cârlige / buc.",result.hooks],["Console / buc.",result.brackets],["Stackwidth",Math.round(result.stackwidth)+" mm"]].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{v}</div>
          </div>
        )}
      </div>
    </div>}

    {result&&clients&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={salveazaLaClient} disabled={!clientId} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:clientId?"#5C6B65":C.border,color:"#2A2118",border:"none",cursor:clientId?"pointer":"default"}}>💾 Salvează configurația la client</button>
      {savedMsg&&<span style={{fontSize:12,color:C.accent,fontWeight:600}}>{savedMsg}</span>}
      {!clientId&&<span style={{fontSize:11,color:C.textMuted}}>Alege un client mai sus ca să poți salva.</span>}
    </div>}

    {result&&<div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <div style={{flex:1,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600}}>Listă piese de comandat ({parts.length})</div>
        <button onClick={printParts} style={{fontSize:12,fontWeight:600,padding:"6px 14px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
      </div>
      {parts.map((p,i)=><div key={p.code} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.bg,marginBottom:3}}>
        <span style={{fontSize:11,color:C.textMuted,minWidth:20,flexShrink:0}}>{i+1}.</span>
        <span style={{fontSize:12,fontWeight:600,color:C.accent,minWidth:100,flexShrink:0}}>{p.code}</span>
        <span style={{fontSize:12,color:C.text,flex:1}}>{p.desc}{p.colour&&` (${p.colour})`}</span>
        <span style={{fontSize:12,fontWeight:600,color:C.text,flexShrink:0}}>{p.qty}</span>
      </div>)}
    </div>}

    {clientObj&&(clientObj.configuratiiSina||[]).length>0&&<div>
      <div style={{height:1,background:C.border,margin:"8px 0 16px"}}/>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:10}}>Configurații salvate la {clientObj.name} ({(clientObj.configuratiiSina||[]).length})</div>
      {(clientObj.configuratiiSina||[]).map(cfg=>
        <ConfigSalvataRow key={cfg.id} cfg={cfg} clientId={clientObj.id} setClients={setClients} C={C} onPrint={()=>printSaved({...cfg,clientName:clientObj.name})}/>
      )}
    </div>}
  </div>;
}

  const toggleProdus=(e)=>{e.stopPropagation();setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiSina:(c.configuratiiSina||[]).map(x=>x.id!==cfg.id?x:{...x,produs:!x.produs})}));};
  const saveObs=()=>{ setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiSina:(c.configuratiiSina||[]).map(x=>x.id!==cfg.id?x:{...x,observatii:obsText.trim()})})); };
  const {errors:vErrors,warnings:vWarnings}=validateCoulisseInput(cfg.input);

        <span style={{fontSize:11,color:C.textMuted,marginLeft:8}}>{cfg.input.width}×{cfg.input.height}mm{cfg.input.quantity>1?` · ×${cfg.input.quantity} buc.`:""}</span>
        {vErrors.length>0&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#3A3128",padding:"2px 8px",marginLeft:8}}>⚠ imposibil</span>}
        {vErrors.length===0&&vWarnings.length>0&&<span style={{fontSize:10,fontWeight:700,color:"#2A2118",background:"#B8A88F",padding:"2px 8px",marginLeft:8}}>atenție</span>}
        {cfg.observatii&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#5C6B65",padding:"2px 8px",marginLeft:8}}>📝 observație</span>}
      </div>
      <span style={{fontSize:11,color:C.textMuted}}>{open?"▾":"▸"}</span>
    </div>
    {open&&<div style={{padding:"12px 14px"}}>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:4,color:C.textMuted}}>📝 Observație pentru Dan</div>
        <textarea value={obsText} onChange={e=>setObsText(e.target.value)} placeholder="adaugă o observație (ex: atenție la colțul din stânga)..." rows={2}
          style={{width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.bg,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>
        {obsText!==(cfg.observatii||"")&&<button onClick={saveObs} style={{marginTop:6,fontSize:11,fontWeight:600,padding:"5px 12px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>💾 Salvează observația</button>}
      </div>
      {vErrors.length>0&&<div style={{background:"#3A3128",color:"#fff",padding:"10px 14px",marginBottom:12,fontSize:12}}>
        <div style={{fontWeight:700,marginBottom:4}}>⚠ Configurație imposibilă:</div>
        {vErrors.map((e,i)=><div key={i}>{e}</div>)}
      </div>}
      {vErrors.length===0&&vWarnings.length>0&&<div style={{background:"#B8A88F",color:"#2A2118",padding:"10px 14px",marginBottom:12,fontSize:12}}>
        <div style={{fontWeight:700,marginBottom:4}}>Atenție:</div>
        {vWarnings.map((w,i)=><div key={i}>{w}</div>)}

      <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:10,wordBreak:"break-all",background:C.accentLight,padding:"8px 10px"}}>{cfg.result.articleCode}</div>

      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>Date introduse</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:0,marginBottom:14}}>

          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>{l}</div>

        <span style={{color:C.textMuted,minWidth:18}}>{i+1}.</span>
        <span style={{fontWeight:600,color:C.accent,minWidth:90}}>{p.code}</span>

}

function buildPanouPrintHtml(cfg){
  const rows=cfg.parts.map((p,i)=>`<tr><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${i+1}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.article}</td><td style="padding:6px 10px;border:1px solid #ccc;">${p.desc}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:right;">${p.qty}</td></tr>`).join("");
  return `<html><head><title>Comandă Panou</title></head><body style="font-family:sans-serif;padding:20px;">
    <h2>Configurator Panou (Panel Absolute)</h2>
    ${cfg.clientName?`<p><b>Client:</b> ${cfg.clientName}</p><p><b>Destinație (cameră):</b> ${cfg.camera||"—"}</p>`:""}
    ${cfg.observatii?`<p style="background:#5C6B65;color:#fff;padding:10px 14px;"><b>Observație:</b> ${cfg.observatii}</p>`:""}
    <div style="border:1px solid #999;padding:10px 14px;margin:12px 0;background:#f4f2ee;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#555;font-weight:700;margin-bottom:8px;">Date introduse (nu sunt calcule ale sistemului)</div>
      <div style="line-height:1.9;">
        Lățime: ${cfg.input.width}mm<br/>Înălțime: ${cfg.input.height}mm<br/>Sistem: ${cfg.input.system}<br/>Track-uri (canale): ${cfg.input.tracks}<br/>${cfg.input.numPanelsOverride?"Nr. panouri (manual): "+cfg.input.numPanelsOverride+"<br/>":""}${cfg.input.overlapCm?"Suprapunere: "+cfg.input.overlapCm+" cm<br/>":""}Montaj panou: ${cfg.input.mountPanel}<br/>Culoare: ${cfg.input.colour}${cfg.input.material?"<br/>Material: "+cfg.input.material:""}<br/>Cantitate: ${cfg.qty}
      </div>
    </div>
    <p><b>Rezultat calcul:</b> Nr. panouri: ${cfg.result.panels} · Lățime panou: ${cfg.result.panelWidth}mm · Șină tăiată: ${cfg.result.cutHeadrail}mm · Înălțime panou: ${cfg.result.panelHeight}mm · Tăiere material: ${cfg.result.fabricCutLen}mm</p>
    <table style="border-collapse:collapse;width:100%;margin-top:14px;">
      <tr><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">#</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Cod</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:left;">Descriere</th><th style="padding:6px 10px;border:1px solid #ccc;text-align:right;">Cantitate</th></tr>
      ${rows}
    </table>
  </body></html>`;
}

function TabConfiguratorPanou({C,clients,setClients,camereLista,setCamereLista}){
  const [width,setWidth]=React.useState(1500);
  const [height,setHeight]=React.useState(1500);
  const [installHeight,setInstallHeight]=React.useState(2000);
  const [system,setSystem]=React.useState("Cord (A10)");
  const [segments,setSegments]=React.useState(1);
  const [tracks,setTracks]=React.useState(2);
  const [controlSide,setControlSide]=React.useState("Left");
  const [packSide,setPackSide]=React.useState("Right");
  const [mountPanel,setMountPanel]=React.useState("Hold down strip");
  const [mountHeadrail,setMountHeadrail]=React.useState("Ceiling clip");
  const [colour,setColour]=React.useState("White");
  const [cordWeight,setCordWeight]=React.useState("Netedă (smooth)");
  const [material,setMaterial]=React.useState("");
  const [numPanelsOverride,setNumPanelsOverride]=React.useState("");
  const [overlapCm,setOverlapCm]=React.useState(4);
  const [qty,setQty]=React.useState(1);
  const [coulisse,setCoulisse]=React.useState(true);
  const [clientId,setClientId]=React.useState("");
  const [camera,setCamera]=React.useState("");
  const [observatii,setObservatii]=React.useState("");
  const [savedMsg,setSavedMsg]=React.useState("");

  const sys = PN_SYSTEMS[system];
  const isCordSystem = sys.code==="PTC-A10"||sys.code==="PTC-A12";
  const ctrlOptions = PN_CTRLSIDE_OPTIONS[sys.ctrlGrp];
  const packOptions = PN_PACKSIDE_OPTIONS[sys.packGrp];
  React.useEffect(()=>{ if(!ctrlOptions.includes(controlSide)) setControlSide(ctrlOptions[0]); },[system]);
  React.useEffect(()=>{ if(!packOptions.includes(packSide)) setPackSide(packOptions[0]); },[system]);

  let result=null, parts=[], error=null;
  try{
    result = pnBuildResult({width:Number(width),height:Number(height),installHeight:Number(installHeight),
      system,segments:Number(segments),tracks:Number(tracks),controlSide,packSide,mountPanel,mountHeadrail,colour,
      numPanels:numPanelsOverride?Number(numPanelsOverride):undefined, overlapCm:Number(overlapCm)});
    parts = pnPartsList({segments:Number(segments),cordWeight}, result, Number(qty)||1);
  }catch(e){ error="Verifică valorile introduse."; }

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};
  const clientObj=clients&&clients.find(c=>c.id===clientId);

  const buildPrintHtml=buildPanouPrintHtml;
  const printParts=()=>{ if(!result) return; printHtmlDoc(buildPrintHtml({clientName:clientObj&&clientObj.name,camera,input:{width,height,system,tracks,mountPanel,colour,material,numPanelsOverride:numPanelsOverride?Number(numPanelsOverride):null,overlapCm:Number(overlapCm)},qty,result,parts})); };
  const printSaved=(cfg)=>printHtmlDoc(buildPrintHtml(cfg));

  const salveazaLaClient=()=>{
    if(!clientId||!result) return;
    if(!camera.trim() && !window.confirm("Nu ai completat Cameră (destinație). Salvezi oricum?\n\nApasă Anulează ca să o completezi întâi.")) return;
    if(camera.trim() && setCamereLista && !(camereLista||[]).some(cm=>cm.toLowerCase()===camera.trim().toLowerCase())){
      setCamereLista(p=>[...p,camera.trim()]);
    }
    const cfg={id:gid(), camera:camera.trim(), observatii:observatii.trim(), dataCreat:tday(),
      qty:Number(qty)||1, coulisse,
      input:{width:Number(width),height:Number(height),installHeight:Number(installHeight),system,segments:Number(segments),
        tracks:Number(tracks),controlSide,packSide,mountPanel,mountHeadrail,colour,cordWeight,material:material.trim(),
        numPanelsOverride:numPanelsOverride?Number(numPanelsOverride):null, overlapCm:Number(overlapCm)},
      result, parts};
    setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiPanou:[...(c.configuratiiPanou||[]),cfg]}));
    setSavedMsg(`Salvat la ${clientObj?clientObj.name:"client"}${camera?" · "+camera:""} ✓`);
    setCamera(""); setObservatii("");
    setTimeout(()=>setSavedMsg(""),3000);
  };

  return <div>
    <div style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:14}}>Configurator Panou (Panel Absolute)</div>

    {clients&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Client</label>
        <select value={clientId} onChange={e=>setClientId(e.target.value)} style={selStyle}>
          <option value="">— alege client —</option>
          {clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"ro")).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Cameră</label>
        <input list="camere-dl" value={camera} onChange={e=>setCamera(e.target.value)} placeholder="ex: living, dormitor" style={selStyle}/>
        <datalist id="camere-dl">{(camereLista||[]).map(cm=><option key={cm} value={cm}/>)}</datalist>
      </div>
      <div style={{gridColumn:"1 / -1"}}><label style={lblStyle}>Observații pentru Dan</label>
        <textarea value={observatii} onChange={e=>setObservatii(e.target.value)} placeholder="ex: atenție la colțul din stânga, geamul e strâmb..." rows={2} style={{...selStyle,resize:"vertical",fontFamily:"inherit"}}/>
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
      <div><label style={lblStyle}>Lățime (mm)</label><input type="number" value={width} onChange={e=>setWidth(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime (mm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Înălțime montaj (mm)</label><input type="number" value={installHeight} onChange={e=>setInstallHeight(e.target.value)} style={selStyle}/></div>
      <div><label style={lblStyle}>Sistem</label>
        <select value={system} onChange={e=>setSystem(e.target.value)} style={selStyle}>
          {Object.keys(PN_SYSTEMS).map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Nr. segmente șină</label>
        <select value={segments} onChange={e=>setSegments(e.target.value)} style={selStyle}>
          {[1,2,3].map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Nr. canale (track-uri)</label>
        <select value={tracks} onChange={e=>setTracks(e.target.value)} style={selStyle}>
          {[2,3,4,5,6].map(n=><option key={n} value={n}>{n}</option>)}
        </select>
        <div style={{fontSize:11,color:C.textMuted,marginTop:4}}>→ implicit {PN_PANELS_BY_TRACKS[sys.panelGrp][Number(tracks)]} panouri (poți suprascrie mai jos)</div>
      </div>
      <div><label style={lblStyle}>Nr. panouri (opțional — suprascrie automat)</label>
        <input type="number" min="1" value={numPanelsOverride} onChange={e=>setNumPanelsOverride(e.target.value)} placeholder={String(PN_PANELS_BY_TRACKS[sys.panelGrp][Number(tracks)])} style={selStyle}/>
      </div>
      <div><label style={lblStyle}>Suprapunere totală per panou (cm)</label>
        <input type="number" step="0.5" value={overlapCm} onChange={e=>setOverlapCm(e.target.value)} style={selStyle}/>
        <div style={{fontSize:11,color:C.textMuted,marginTop:4}}>= {(Number(overlapCm)/2).toFixed(1)}cm pe fiecare parte (stânga + dreapta = {overlapCm}cm)</div>
      </div>
      <div><label style={lblStyle}>Parte comandă</label>
        <select value={controlSide} onChange={e=>setControlSide(e.target.value)} style={selStyle}>
          {ctrlOptions.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Parte împachetare</label>
        <select value={packSide} onChange={e=>setPackSide(e.target.value)} style={selStyle}>
          {packOptions.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Montaj panou</label>
        <select value={mountPanel} onChange={e=>setMountPanel(e.target.value)} style={selStyle}>
          {Object.keys(PN_MOUNTPANEL_CODE).map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Montaj șină</label>
        <select value={mountHeadrail} onChange={e=>setMountHeadrail(e.target.value)} style={selStyle}>
          {PN_MOUNTHEADRAIL.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>
      <div><label style={lblStyle}>Culoare</label>
        <select value={colour} onChange={e=>setColour(e.target.value)} style={selStyle}>
          {Object.keys(PN_COLOUR_CODE).map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      {isCordSystem&&<div><label style={lblStyle}>Greutate cordon</label>
        <select value={cordWeight} onChange={e=>setCordWeight(e.target.value)} style={selStyle}>
          {PN_CORDWEIGHT_OPTIONS.map(o=><option key={o.label} value={o.label}>{o.label}</option>)}
        </select>
      </div>}
      <div><label style={lblStyle}>Material (opțional, pt. lista de tăiere)</label><input value={material} onChange={e=>setMaterial(e.target.value)} placeholder="ex: material client X" style={selStyle}/></div>
      <div><label style={lblStyle}>Cantitate (nr. sisteme)</label><input type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)} style={selStyle}/></div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:C.bg,padding:"10px 14px"}}>
        <input type="checkbox" checked={coulisse} onChange={e=>setCoulisse(e.target.checked)}/>
        <span style={{fontSize:13,color:C.text}}>Material tăiat din stoc Coulisse (dacă e debifat — panou făcut la croitorie, nu apare pe lista de tăiere)</span>
      </label>
    </div>

    {error&&<div style={{fontSize:13,color:C.text,padding:"10px 0"}}>{error}</div>}

    {result&&<div style={{border:`1px solid ${C.border}`,background:C.surface,marginBottom:16}}>
      <div style={{padding:"13px 16px",background:C.accentLight,borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:4}}>Cod articol</div>
        <div style={{fontSize:14,fontWeight:600,color:C.text,wordBreak:"break-all"}}>{result.code}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[["Nr. panouri",result.panels],["Lățime panou",result.panelWidth+" mm"],["Șină tăiată",result.cutHeadrail+" mm"],
          ["Înălțime panou",result.panelHeight+" mm"],["Tăiere material",result.fabricCutLen+" mm"],
          ["Clipsuri",result.numClips],["Culisoare/panou",result.runnersPerPanel],
          ...(result.numConnectors?[["Cleme conectoare",result.numConnectors]]:[]),
          ...(isCordSystem?[["Lungime cordon",result.cordLen+" mm"]]:[])].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{v}</div>
          </div>
        )}
      </div>
    </div>}

    {result&&clients&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={salveazaLaClient} disabled={!clientId} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:clientId?"#5C6B65":C.border,color:"#2A2118",border:"none",cursor:clientId?"pointer":"default"}}>💾 Salvează configurația la client</button>
      {savedMsg&&<span style={{fontSize:12,color:C.accent,fontWeight:600}}>{savedMsg}</span>}
    </div>}

    {result&&<div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <div style={{flex:1,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600}}>Listă piese de comandat ({parts.length})</div>
        <button onClick={printParts} style={{fontSize:12,fontWeight:600,padding:"6px 14px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
      </div>
      {parts.map((p,i)=><div key={p.article+i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.bg,marginBottom:3}}>
        <span style={{fontSize:11,color:C.textMuted,minWidth:20,flexShrink:0}}>{i+1}.</span>
        <span style={{fontSize:12,fontWeight:600,color:C.accent,minWidth:100,flexShrink:0}}>{p.article}</span>
        <span style={{fontSize:12,color:C.text,flex:1}}>{p.desc}</span>
        <span style={{fontSize:12,fontWeight:600,color:C.text,flexShrink:0}}>{p.qty}</span>
      </div>)}
    </div>}

    {clientObj&&(clientObj.configuratiiPanou||[]).length>0&&<div>
      <div style={{height:1,background:C.border,margin:"8px 0 16px"}}/>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600,marginBottom:10}}>Panouri salvate la {clientObj.name} ({(clientObj.configuratiiPanou||[]).length})</div>
      {(clientObj.configuratiiPanou||[]).map(cfg=>
        <ConfigPanouSalvataRow key={cfg.id} cfg={cfg} clientId={clientObj.id} setClients={setClients} C={C} onPrint={()=>printSaved({...cfg,clientName:clientObj.name})}/>
      )}
    </div>}
  </div>;
}

function ConfigPanouSalvataRow({cfg,clientId,setClients,C,onPrint}){
  const [open,setOpen]=React.useState(false);
  const [obsText,setObsText]=React.useState(cfg.observatii||"");
  const delCfg=()=>setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiPanou:(c.configuratiiPanou||[]).filter(x=>x.id!==cfg.id)}));
  const toggleProdus=(e)=>{e.stopPropagation();setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiPanou:(c.configuratiiPanou||[]).map(x=>x.id!==cfg.id?x:{...x,produs:!x.produs})}));};
  const toggleCoulisse=(e)=>{e.stopPropagation();setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiPanou:(c.configuratiiPanou||[]).map(x=>x.id!==cfg.id?x:{...x,coulisse:!x.coulisse})}));};
  const saveObs=()=>{ setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiPanou:(c.configuratiiPanou||[]).map(x=>x.id!==cfg.id?x:{...x,observatii:obsText.trim()})})); };
  return <div style={{border:`1px solid ${C.border}`,marginBottom:6,background:C.surface}}>
    <div onClick={()=>setOpen(!open)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",background:C.bg}}>
      <input type="checkbox" checked={!!cfg.produs} onChange={toggleProdus} onClick={e=>e.stopPropagation()} title="Marchează ca produs" style={{cursor:"pointer",width:16,height:16,flexShrink:0}}/>
      <div style={{flex:1}}>
        <span style={{fontSize:13,fontWeight:600,color:cfg.produs?C.textMuted:C.text}}>{cfg.camera||"(fără cameră)"}</span>
        <span style={{fontSize:11,color:C.textMuted,marginLeft:8}}>{cfg.input.width}×{cfg.input.height}mm · {cfg.input.system}</span>
        {!cfg.coulisse&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#8A6D3B",padding:"2px 8px",marginLeft:8}}>croitorie</span>}
        {cfg.observatii&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#5C6B65",padding:"2px 8px",marginLeft:8}}>📝 observație</span>}
      </div>
      <span style={{fontSize:11,color:C.textMuted}}>{open?"▾":"▸"}</span>
    </div>
    {open&&<div style={{padding:"12px 14px"}}>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:C.bg,padding:"8px 12px",marginBottom:12}}>
        <input type="checkbox" checked={!!cfg.coulisse} onChange={toggleCoulisse}/>
        <span style={{fontSize:12,color:C.text}}>Material tăiat din stoc Coulisse (apare pe lista de tăiere)</span>
      </label>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:4,color:C.textMuted}}>📝 Observație pentru Dan</div>
        <textarea value={obsText} onChange={e=>setObsText(e.target.value)} placeholder="adaugă o observație..." rows={2}
          style={{width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.bg,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>
        {obsText!==(cfg.observatii||"")&&<button onClick={saveObs} style={{marginTop:6,fontSize:11,fontWeight:600,padding:"5px 12px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>💾 Salvează observația</button>}
      </div>
      <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:10,wordBreak:"break-all",background:C.accentLight,padding:"8px 10px"}}>{cfg.result.code}</div>

      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>Date introduse</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:0,marginBottom:14}}>
        {[["Lățime",cfg.input.width+" mm"],["Înălțime",cfg.input.height+" mm"],["Sistem",cfg.input.system],
          ["Track-uri (canale)",cfg.input.tracks],["Segmente",cfg.input.segments],["Montaj panou",cfg.input.mountPanel],
          ["Montaj șină",cfg.input.mountHeadrail],["Culoare",cfg.input.colour],
          ...(cfg.input.numPanelsOverride?[["Nr. panouri (manual)",cfg.input.numPanelsOverride]]:[]),
          ...(cfg.input.overlapCm?[["Suprapunere",cfg.input.overlapCm+" cm"]]:[]),
          ...(cfg.input.material?[["Material",cfg.input.material]]:[]),["Cantitate",cfg.qty+" buc."]].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>{l}</div>
            <div style={{fontSize:13,fontWeight:600,color:C.text}}>{v}</div>
          </div>
        )}
      </div>

      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>Rezultat calcul</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:0,marginBottom:14,background:C.bg,padding:"10px"}}>
        {[["Nr. panouri",cfg.result.panels],["Lățime panou",cfg.result.panelWidth+" mm"],["Șină tăiată",cfg.result.cutHeadrail+" mm"],["Înălțime panou",cfg.result.panelHeight+" mm"],["Tăiere material",cfg.result.fabricCutLen+" mm"]].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:9,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>{l}</div>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>{v}</div>
          </div>
        )}
      </div>
      {cfg.parts.map((p,i)=><div key={p.article+i} style={{display:"flex",gap:10,fontSize:12,padding:"5px 8px",color:C.textSub,background:C.bg,marginBottom:2}}>
        <span style={{color:C.textMuted,minWidth:18}}>{i+1}.</span>
        <span style={{fontWeight:600,color:C.accent,minWidth:90}}>{p.article}</span>
        <span style={{flex:1}}>{p.desc}</span>
        <span style={{fontWeight:600,color:C.text}}>{p.qty}</span>
      </div>)}
      <div style={{display:"flex",gap:10,marginTop:12}}>
        <button onClick={onPrint} style={{fontSize:12,fontWeight:600,padding:"6px 14px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
        <button onClick={delCfg} style={{fontSize:12,color:C.textMuted,border:"none",background:"transparent",cursor:"pointer"}}>șterge configurația</button>
      </div>
    </div>}
  </div>;
}

function ContractClientSection({client,ci,setClients,C,contractCounter,setContractCounter}){
  const [tip,setTip]=React.useState("PF");
  const [numeClient,setNumeClient]=React.useState("");
  const [loculMontaj,setLoculMontaj]=React.useState(client.adresa||"");
  const [valoare,setValoare]=React.useState("");
  const [tva,setTva]=React.useState("inclus");
  const [termenLivrare,setTermenLivrare]=React.useState("");
  const [tipZile,setTipZile]=React.useState("lucrătoare");
  const [avans,setAvans]=React.useState("");
  const [scadenta,setScadenta]=React.useState("cu 1 zi înainte de livrare");
  const [scadentaCustom,setScadentaCustom]=React.useState("");
  const [email,setEmail]=React.useState("");
  const [ciSeria,setCiSeria]=React.useState("");
  const [ciNumar,setCiNumar]=React.useState("");
  const [cui,setCui]=React.useState("");
  const [regCom,setRegCom]=React.useState("");
  const [iban,setIban]=React.useState("");
  const [reprezentant,setReprezentant]=React.useState("");
  const [garantieLuni,setGarantieLuni]=React.useState("24");

  React.useEffect(()=>{ if(!loculMontaj && client.adresa) setLoculMontaj(client.adresa); },[client.adresa]);

  const buildData=(numarContract,dataContractFmt)=>{
    const val=Number(valoare)||0, av=Number(avans)||0;
    return {
      numarContract, dataContractFmt,
      loculMontaj: loculMontaj.trim()||"—",
      valoare: valoare.trim(), tva, termenLivrare: termenLivrare.trim(), tipZile,
      telefon: client.telefon||"—", email: email.trim()||"—",
      numeClient: numeClient.trim(),
      avans: avans.trim()||"0", diferenta: String(Math.max(val-av,0)),
      scadenta: scadenta==="altă variantă"?(scadentaCustom.trim()||"altă variantă agreată cu Clientul"):scadenta,
      ciSeria: ciSeria.trim()||"—", ciNumar: ciNumar.trim()||"—",
      cui: cui.trim()||"—", regCom: regCom.trim()||"—", iban: iban.trim()||"—",
      reprezentant: reprezentant.trim()||"—", garantieLuni: garantieLuni.trim()||"24",
    };
  };

  const vizualizeaza=(html)=>{
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  };
  const printeaza=(html)=>{
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if(w){ w.addEventListener("load",()=>{ setTimeout(()=>w.print(),300); }); }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  };
  const descarca=(html, numarContract)=>{
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Contract_${numarContract.replace("/","-")}_${(numeClient||client.name).replace(/[^a-zA-Z0-9]+/g,"_")}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  };

  const genereaza=()=>{
    if(!numeClient.trim()){ alert("Completează numele clientului."); return; }
    if(!valoare.trim()){ alert("Completează valoarea contractului."); return; }
    if(!termenLivrare.trim()){ alert("Completează termenul de livrare (în zile)."); return; }
    const numarContract = `${contractCounter}/${new Date().getFullYear()}`;
    const dataContractFmt = fmtD(tday());
    const data = buildData(numarContract, dataContractFmt);
    const html = tip==="PF" ? buildContractPF(data) : buildContractPJ(data);
    const contract = {id:gid(), tip, numarContract, dataContract:tday(), numeClient:numeClient.trim(),
      valoare:valoare.trim(), tva, termenLivrare:termenLivrare.trim(), tipZile, loculMontaj:loculMontaj.trim(),
      avans:avans.trim(), scadenta:(scadenta==="altă variantă"?(scadentaCustom.trim()||"altă variantă agreată cu Clientul"):scadenta), email:email.trim(), ciSeria:ciSeria.trim(), ciNumar:ciNumar.trim(),
      cui:cui.trim(), regCom:regCom.trim(), iban:iban.trim(), reprezentant:reprezentant.trim(),
      garantieLuni:garantieLuni.trim(), dataCreat:tday()};
    setClients(p=>p.map((c,i)=>i!==ci?c:{...c,contracte:[...(c.contracte||[]),contract]}));
    setContractCounter(p=>p+1);
    vizualizeaza(html);
    setNumeClient(""); setValoare(""); setTermenLivrare(""); setAvans(""); setEmail("");
    setCiSeria(""); setCiNumar(""); setCui(""); setRegCom(""); setIban(""); setReprezentant(""); setScadentaCustom("");
  };

  const htmlFor=(contract)=>{
    const val=Number(contract.valoare)||0, av=Number(contract.avans)||0;
    const data = {
      numarContract: contract.numarContract, dataContractFmt: fmtD(contract.dataContract),
      loculMontaj: contract.loculMontaj||"—", valoare: contract.valoare, tva: contract.tva||"neinclus",
      termenLivrare: contract.termenLivrare, tipZile: contract.tipZile||"lucrătoare",
      telefon: client.telefon||"—", email: contract.email||"—", numeClient: contract.numeClient,
      avans: contract.avans||"0", diferenta: String(Math.max(val-av,0)), scadenta: contract.scadenta||"cu 1 zi înainte de livrare",
      ciSeria: contract.ciSeria||"—", ciNumar: contract.ciNumar||"—",
      cui: contract.cui||"—", regCom: contract.regCom||"—", iban: contract.iban||"—",

function extrageDateFacturaPDF(file){
  return new Promise((resolve,reject)=>{
    if(!window.pdfjsLib){ reject(new Error("Motorul de citire PDF nu s-a încărcat.")); return; }
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const data=new Uint8Array(ev.target.result);
        const doc=await pdfjsLib.getDocument({data}).promise;
        const page=await doc.getPage(1);
        const content=await page.getTextContent();
        const items=content.items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]})).filter(i=>i.str.trim());
        items.sort((a,b)=>b.y-a.y||a.x-b.x);
        const lines=[]; const TOL=3;
        for(const it of items){
          let line=lines.find(l=>Math.abs(l.y-it.y)<=TOL);
          if(!line){ line={y:it.y,items:[]}; lines.push(line); }
          line.items.push(it);
        }
        for(const line of lines) line.items.sort((a,b)=>a.x-b.x);
        const rows=lines.map(l=>l.items.map(i=>i.str.trim()).filter(Boolean));

        let serie="", dataFact="", produse=[];
        let inTable=false;
        for(const row of rows){
          if(!row.length) continue;
          if(row[0]==="Serie" && row[1]) serie=row[1];
          if(row[0] && row[0].startsWith("Data (ziua") && row[1]) dataFact=row[1];
          if(row.includes("crt.") || row.some(c=>c.includes("Denumirea produselor"))) { inTable=true; continue; }
          if(inTable){
            if(/^\d+$/.test(row[0])){
              const denumire=row[1]||"";
              const um=row[2]||"";
              const cant=row[3]||"";
              if(denumire && denumire.trim().toLowerCase()!=="avans") produse.push(um&&cant?`${denumire} (${cant} ${um})`:denumire);
            } else if(row[0] && row[0].toLowerCase().startsWith("acest document")){
              inTable=false;
            }
          }
        }
        let dataIso="";
        const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(dataFact);
        if(m) dataIso=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;

        resolve({serie, data:dataIso, denumire:produse.join(", ")});
      }catch(e){ reject(e); }
    };
    reader.onerror=()=>reject(new Error("Nu s-a putut citi fișierul."));
    reader.readAsArrayBuffer(file);
  });
}

function ProcesVerbalClientSection({client,ci,setClients,C,pvCounter,setPvCounter}){
  const [numeClient,setNumeClient]=React.useState(client.name||"");
  const [facturi,setFacturi]=React.useState([{serie:"",data:"",denumire:""}]);
  const [pdfLoadingIdx,setPdfLoadingIdx]=React.useState(null);

  const updFactura=(idx,field,val)=>setFacturi(p=>p.map((f,i)=>i!==idx?f:{...f,[field]:val}));
  const addFactura=()=>setFacturi(p=>[...p,{serie:"",data:"",denumire:""}]);
  const delFactura=(idx)=>setFacturi(p=>p.length<=1?p:p.filter((_,i)=>i!==idx));
  const incarcaPdf=async(idx,file)=>{
    if(!file) return;
    setPdfLoadingIdx(idx);
    try{
      const r=await extrageDateFacturaPDF(file);
      setFacturi(p=>p.map((f,i)=>i!==idx?f:{serie:r.serie||f.serie, data:r.data||f.data, denumire:r.denumire||f.denumire}));
      if(!r.serie && !r.denumire) alert("Nu am reușit să găsesc datele facturii în acest PDF — te rog verifică și completează manual câmpurile.");
    }catch(e){ alert("Nu am putut citi acest PDF. Completează manual câmpurile."); }
    setPdfLoadingIdx(null);
  };

  const rowsHtml=(list)=>list.filter(f=>f.serie.trim()||f.denumire.trim()).map(f=>
    `<tr><td style="padding:5px 8px 5px 0;font:400 1em/1.3 'Source Serif 4',Cambria,Georgia,serif;color:#2A2118;border-bottom:1px solid #E4DCCD">${f.serie||"—"}</td><td style="padding:5px 8px;border-bottom:1px solid #E4DCCD">${f.data?fmtD(f.data):"—"}</td><td style="padding:5px 0 5px 8px;border-bottom:1px solid #E4DCCD">${f.denumire||"—"}</td></tr>`
  ).join("");

  const vizualizeaza=(html)=>{
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    window.open(url,"_blank");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  const printeaza=(html)=>{
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(w){ w.addEventListener("load",()=>{ setTimeout(()=>w.print(),300); }); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  const descarca=(html,numar)=>{
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`ProcesVerbal_${numar.replace("/","-")}_${(numeClient||client.name).replace(/[^a-zA-Z0-9]+/g,"_")}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  };
  const htmlFor=(pv)=>buildProcesVerbal({numar:pv.numar, dataFmt:fmtD(pv.data), numeClient:pv.numeClient,
    facturiRows: rowsHtml(pv.facturi)});

  const genereaza=()=>{
    if(!numeClient.trim()){ alert("Completează numele cumpărătorului."); return; }
    const valid=facturi.filter(f=>f.serie.trim());
    if(!valid.length){ alert("Adaugă cel puțin o factură (serie)."); return; }
    const numar=`${pvCounter}/${new Date().getFullYear()}`;
    const pv={id:gid(), numar, data:tday(), numeClient:numeClient.trim(), facturi:valid};
    const html=htmlFor(pv);
    setClients(p=>p.map((c,i)=>i!==ci?c:{...c,proceseVerbale:[...(c.proceseVerbale||[]),pv]}));
    setPvCounter(p=>p+1);
    vizualizeaza(html);
    setFacturi([{serie:"",data:"",denumire:""}]);
  };

  const selStyle={width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"7px 10px",background:C.surface,outline:"none"};
  const lblStyle={fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:5,display:"block"};

  return <div>
    <div style={{marginBottom:12}}>
      <label style={lblStyle}>Nume cumpărător (ca pe factură)</label>
      <input value={numeClient} onChange={e=>setNumeClient(e.target.value)} style={selStyle}/>
    </div>
    <div style={{marginBottom:10}}>
      <label style={lblStyle}>Facturi</label>
      {facturi.map((f,idx)=>
        <div key={idx} style={{border:`1px solid ${C.border}`,padding:10,marginBottom:8,background:C.surface}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <label style={{fontSize:11,fontWeight:600,padding:"6px 12px",background:pdfLoadingIdx===idx?C.border:C.accent,color:pdfLoadingIdx===idx?C.text:"#fff",cursor:pdfLoadingIdx===idx?"default":"pointer",whiteSpace:"nowrap"}}>
              {pdfLoadingIdx===idx?"⏳ Se citește...":"📎 Încarcă PDF factură"}
              <input type="file" accept="application/pdf" disabled={pdfLoadingIdx===idx} onChange={e=>{incarcaPdf(idx,e.target.files[0]); e.target.value="";}} style={{display:"none"}}/>
            </label>
            <span style={{fontSize:11,color:C.textMuted,flex:1}}>completează automat seria, data și produsele — verifică înainte de generare</span>
            {facturi.length>1&&<button onClick={()=>delFactura(idx)} style={{fontSize:16,color:C.textMuted,border:"none",background:"transparent",cursor:"pointer"}}>×</button>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"120px 130px 1fr",gap:8}}>
            <input value={f.serie} onChange={e=>updFactura(idx,"serie",e.target.value)} placeholder="Serie factură" style={selStyle}/>
            <input type="date" value={f.data} onChange={e=>updFactura(idx,"data",e.target.value)} style={selStyle}/>
            <input value={f.denumire} onChange={e=>updFactura(idx,"denumire",e.target.value)} placeholder="ex: Draperii living, stor baie" style={selStyle}/>
          </div>
        </div>
      )}
      <button onClick={addFactura} style={{fontSize:11,fontWeight:600,padding:"6px 12px",background:C.bg,color:C.textSub,border:`1px solid ${C.border}`,cursor:"pointer"}}>+ adaugă altă factură</button>
    </div>
    <div style={{fontSize:11,color:C.textMuted,marginBottom:12}}>Nr. proces verbal următor: <b>{pvCounter}/{new Date().getFullYear()}</b> · secțiunea „Observații" rămâne liberă pe document, se completează de mână la fața locului.</div>
    <div style={{display:"flex",gap:8}}>
      <button onClick={genereaza} style={{fontSize:12,fontWeight:600,padding:"9px 18px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>📋 Generează și vizualizează</button>
    </div>

    {(client.proceseVerbale||[]).length>0&&<div style={{marginTop:16}}>
      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:8}}>Procese verbale generate</div>
      {(client.proceseVerbale||[]).slice().reverse().map(pv=>
        <div key={pv.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:C.bg,marginBottom:4,flexWrap:"wrap"}}>
          <span style={{fontSize:12,fontWeight:600,color:C.text,minWidth:80}}>{pv.numar}</span>
          <span style={{fontSize:12,color:C.textSub,flex:1}}>{pv.numeClient} · {pv.facturi.length} factură(i) · {fmtD(pv.data)}</span>
          <button onClick={()=>vizualizeaza(htmlFor(pv))} style={{fontSize:11,fontWeight:600,padding:"5px 10px",background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}>👁 Vizualizează</button>
          <button onClick={()=>printeaza(htmlFor(pv))} style={{fontSize:11,fontWeight:600,padding:"5px 10px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>🖨 Printează</button>
          <button onClick={()=>descarca(htmlFor(pv),pv.numar)} style={{fontSize:11,fontWeight:600,padding:"5px 10px",background:C.border,color:C.text,border:"none",cursor:"pointer"}}>⬇ Descarcă</button>
        </div>
      )}
    </div>}
  </div>;
}

        <div style={{fontSize:14,fontWeight:600,color:C.text,wordBreak:"break-all"}}>{result.articleCode}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:0,padding:"14px 16px"}}>
        {[["Șină",result.headrail+" mm"],result.tiltrod2?["Tub/tijă 1",result.tiltrod1+" mm"]:["Tub/tijă",result.tiltrod1+" mm"],...(result.tiltrod2?[["Tub/tijă 2",result.tiltrod2+" mm"]]:[]),["Bară de jos",result.bottombar+" mm"],["Bobine",result.spools],["Console",result.clips]].map(([l,v])=>
          <div key={l} style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{v}</div>

    </div>}

    {result&&clients&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={salveazaLaClient} disabled={!clientId} style={{fontSize:12,fontWeight:600,padding:"8px 16px",background:clientId?"#5C6B65":C.border,color:"#2A2118",border:"none",cursor:clientId?"pointer":"default"}}>💾 Salvează configurația la client</button>

    {result&&<div style={{marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
        <div style={{flex:1,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:600}}>Listă piese de comandat ({parts.length})</div>

      {parts.map((p,i)=><div key={p.code} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.bg,marginBottom:3}}>
        <span style={{fontSize:11,color:C.textMuted,minWidth:20,flexShrink:0}}>{i+1}.</span>
        <span style={{fontSize:12,fontWeight:600,color:C.accent,minWidth:100,flexShrink:0}}>{p.code}</span>
        <span style={{fontSize:12,color:C.text,flex:1}}>{p.desc}{p.colour&&` (${p.colour})`}</span>

      {(clientObj.configuratiiRoman||[]).map(cfg=>
        <ConfigRomanSalvataRow key={cfg.id} cfg={cfg} clientId={clientObj.id} setClients={setClients} C={C} onPrint={()=>printSaved({...cfg,clientName:clientObj.name})}/>

}

  const toggleProdus=(e)=>{e.stopPropagation();setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiRoman:(c.configuratiiRoman||[]).map(x=>x.id!==cfg.id?x:{...x,produs:!x.produs})}));};
  const saveObs=()=>{ setClients(p=>p.map(c=>c.id!==clientId?c:{...c,configuratiiRoman:(c.configuratiiRoman||[]).map(x=>x.id!==cfg.id?x:{...x,observatii:obsText.trim()})})); };

        <span style={{fontSize:13,fontWeight:600,color:cfg.produs?C.textMuted:C.text}}>{cfg.camera||"(fără cameră)"}</span>
        <span style={{fontSize:11,color:C.textMuted,marginLeft:8}}>{cfg.input.width}×{cfg.input.height}mm · {cfg.input.mechKey}</span>
        {cfg.observatii&&<span style={{fontSize:10,fontWeight:700,color:"#fff",background:"#5C6B65",padding:"2px 8px",marginLeft:8}}>📝 observație</span>}
      </div>
      <span style={{fontSize:11,color:C.textMuted}}>{open?"▾":"▸"}</span>

    {open&&<div style={{padding:"12px 14px"}}>

        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:4,color:C.textMuted}}>📝 Observație pentru Dan</div>

          style={{width:"100%",fontSize:13,border:`1px solid ${C.border}`,padding:"8px 10px",background:C.bg,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>
        {obsText!==(cfg.observatii||"")&&<button onClick={saveObs} style={{marginTop:6,fontSize:11,fontWeight:600,padding:"5px 12px",background:"#5C6B65",color:"#fff",border:"none",cursor:"pointer"}}>💾 Salvează observația</button>}

      <div style={{fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600,marginBottom:6}}>Date introduse</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:0,marginBottom:14}}>
        {[["Lățime",cfg.input.width+" mm"],["Înălțime",cfg.input.height+" mm"],["Înălțime montaj",cfg.input.installHeight?cfg.input.installHeight+" mm":"—"],
          ["Mecanism",cfg.input.mechKey],
          ["Țesătură",cfg.input.fabricKey],
          ...(!cfg.result.isMotor?[["Parte comandă",cfg.input.controlSide]]:[]),

          <div key={l} style={{marginBottom:8}}>
